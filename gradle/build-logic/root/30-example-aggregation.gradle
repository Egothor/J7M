tasks.register("compileNuggetAdminConsoleExample", JavaCompile) {
    group = "verification"
    description = "Compiles the standalone nugget admin console example sources from the root build without adding a settings entry."
    source = files(
            fileTree("examples/nugget-admin-console/src/main/java") {
                include "**/*.java"
            },
            fileTree("examples/nugget-admin-console/src/test/java") {
                include "**/*.java"
            })
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir("classes/nugget-admin-console-example")
    options.release = 25
    options.encoding = "UTF-8"
}

tasks.register("runNuggetAdminConsoleRunbookTest", JavaExec) {
    group = "verification"
    description = "Runs the standalone nugget admin console runbook command-form checks."
    dependsOn "compileNuggetAdminConsoleExample"
    classpath = files(layout.buildDirectory.dir("classes/nugget-admin-console-example"))
    mainClass = "org.j7m.examples.nugget.console.NuggetAdminConsoleRunbookTest"
    outputs.file layout.buildDirectory.file("reports/j7m/examples/nugget-admin-console-runbook-commands.out")
    java.io.ByteArrayOutputStream capturedOutput = new java.io.ByteArrayOutputStream(4096)
    standardOutput = capturedOutput
    errorOutput = capturedOutput
    doFirst {
        capturedOutput.reset()
    }
    doLast {
        File output = layout.buildDirectory.file("reports/j7m/examples/nugget-admin-console-runbook-commands.out").get().asFile
        output.parentFile.mkdirs()
        output.setText(capturedOutput.toString("UTF-8"), "UTF-8")
    }
}

tasks.register("validateNuggetAdminConsoleExample") {
    group = "verification"
    description = "Validates the standalone nugget admin console example structure, compileability, expected output, and smoke backing."
    dependsOn "runNuggetAdminConsoleRunbookTest"
    dependsOn ":j7m-tests:phase7NuggetCliDemoEvidence"
    dependsOn ":j7m-tests:phase7NuggetCliApplicationLifecycleDemoEvidence"
    dependsOn ":j7m-tests:phase7NuggetCliKillDisabledDemoEvidence"
    dependsOn ":j7m-tests:phase7NuggetPinFailureDemoEvidence"
    doLast {
        File root = file("examples/nugget-admin-console")
        List<String> requiredFiles = [
                "README.md",
                "build.gradle",
                "EXPECTED_OUTPUT.txt",
                "src/main/java/module-info.java",
                "src/main/java/org/j7m/examples/nugget/console/NuggetAdminConsoleRunbook.java",
                "src/test/java/org/j7m/examples/nugget/console/NuggetAdminConsoleRunbookTest.java"
        ]
        requiredFiles.each { String relativePath ->
            if (!new File(root, relativePath).isFile()) {
                throw new GradleException("nugget admin console example missing required file: ${relativePath}")
            }
        }
        if (new File(root, "META-INF/j7m-application.json").isFile()) {
            throw new GradleException("nugget admin console is operator-only and must not include META-INF/j7m-application.json")
        }
        String readmeText = new File(root, "README.md").getText("UTF-8")
        String readmeLower = readmeText.toLowerCase(java.util.Locale.ROOT)
        if (!readmeLower.contains("not a deployable j7m application bundle")) {
            throw new GradleException("nugget admin console README must explicitly state that the console is not deployable")
        }
        [
                "manifest is present",
                "copyable application structure",
                "deployable hello application",
                "packages and publishes",
                "activate the console"
        ].each { String forbiddenClaim ->
            if (readmeLower.contains(forbiddenClaim)) {
                throw new GradleException("nugget admin console README contains stale deployability claim: ${forbiddenClaim}")
            }
        }
        File source = new File(root, "src/main/java/org/j7m/examples/nugget/console/NuggetAdminConsoleRunbook.java")
        String sourceText = source.getText("UTF-8")
        if (readmeText.contains("j7m nugget status --id")
                || sourceText.contains("\"status\", \"--id\"")) {
            throw new GradleException("nugget admin console status command must not use --id")
        }
        File commandEvidence = layout.buildDirectory.file(
                "reports/j7m/examples/nugget-admin-console-runbook-commands.out").get().asFile
        if (!commandEvidence.isFile()) {
            throw new GradleException("nugget admin console runbook command evidence was not generated")
        }
        List<String> testedCommands = commandEvidence.readLines("UTF-8").collect { String line ->
            line.trim()
        }.findAll { String line ->
            !line.isEmpty()
        }
        if (testedCommands.isEmpty()) {
            throw new GradleException("nugget admin console runbook command evidence is empty")
        }
        testedCommands.each { String command ->
            if (command.contains("740001")) {
                throw new GradleException("nugget admin console command evidence exposed literal PIN material")
            }
            if (command == "j7m nugget status --id demo-nugget --pin-env J7M_DEMO_PIN"
                    || command.startsWith("j7m nugget status --id ")) {
                throw new GradleException("nugget admin console command evidence contains unsupported status --id form")
            }
            if (!readmeText.contains(command)) {
                throw new GradleException("nugget admin console README missing tested runbook command: ${command}")
            }
        }
        List<String> readmeCommands = readmeText.readLines().collect { String line ->
            line.trim()
        }.findAll { String line ->
            line.startsWith("j7m nugget ")
        }
        Set<String> readmeCommandSet = readmeCommands as Set
        Set<String> testedCommandSet = testedCommands as Set
        if (readmeCommandSet != testedCommandSet) {
            throw new GradleException("nugget admin console README command forms differ from tested runbook commands")
        }
        Map<String, List<String>> evidenceMarkers = [
                "nugget-cli-demo.out": [
                        "phase7 nugget cli demo: production-entrypoint",
                        "phase7 nugget cli inspection commands: ps objects apps env disk health readiness metrics errors",
                        "phase7 nugget cli exit code: 0",
                        "phase7 nugget cli all-nugget prompt visible: true",
                        "phase7 nugget cli discovery visible: true",
                        "phase7 nugget cli all-nugget target visible: true",
                        "phase7 nugget cli selected-nugget prompt visible: true",
                        "phase7 nugget cli selected-nugget target visible: true",
                        "phase7 nugget cli status command visible: true",
                        "phase7 nugget cli returned all-nugget mode: true",
                        "phase7 nugget cli json envelope: true",
                        "phase7 nugget cli ps output: true",
                        "phase7 nugget cli no secret leakage: true"
                ],
                "nugget-cli-application-lifecycle-demo.out": [
                        "phase7.6 nugget cli lifecycle demo: real-application-manager",
                        "phase7.6 nugget cli lifecycle discovery/select/auth: true",
                        "phase7.6 nugget cli lifecycle start dry-run: true",
                        "phase7.6 nugget cli lifecycle start exact coordinate: true",
                        "phase7.6 nugget cli lifecycle apps status: true",
                        "phase7.6 nugget cli lifecycle drain: true",
                        "phase7.6 nugget cli lifecycle stop: true",
                        "phase7.6 nugget cli lifecycle service after stop candidates: 0",
                        "phase7.6 nugget cli lifecycle unload: true",
                        "phase7.6 nugget cli lifecycle audit safe redaction: true"
                ],
                "nugget-cli-kill-disabled-demo.out": [
                        "phase7.7 nugget cli kill-disabled demo: public-contracts",
                        "phase7.7 nugget cli discovery exact target auth: true",
                        "phase7.7 nugget cli drain safe partial: true",
                        "phase7.7 nugget cli shutdown confirmation-required: true",
                        "phase7.7 nugget cli kill disabled despite confirmation: true",
                        "phase7.7 nugget cli no arbitrary process control: true",
                        "phase7.7 nugget cli no jvm termination: true",
                        "phase7.7 nugget cli audit/output safe: true"
                ],
                "nugget-pin-failure-demo.out": [
                        "phase7 nugget pin failure demo: production-cli-entrypoint",
                        "phase7 nugget pin failure cli exit non-success: true",
                        "phase7 nugget pin failure cli denial stable: true",
                        "phase7 nugget pin failure outcome: REJECTED",
                        "phase7 nugget pin failure accepted: false",
                        "phase7 nugget pin failure secret printed: false"
                ]
        ]
        File phase7Reports = layout.buildDirectory.dir("reports/j7m/phase7").get().asFile
        Set<String> allowedExpectedMarkers = [] as Set
        evidenceMarkers.each { String reportName, List<String> markers ->
            File report = new File(phase7Reports, reportName)
            if (!report.isFile()) {
                throw new GradleException("missing nugget admin console demo evidence report: ${reportName}")
            }
            String reportText = report.getText("UTF-8")
            markers.each { String marker ->
                allowedExpectedMarkers.add(marker)
                if (!reportText.contains(marker)) {
                    throw new GradleException("demo evidence ${reportName} missing expected marker: ${marker}")
                }
            }
        }
        List<String> expectedOutput = new File(root, "EXPECTED_OUTPUT.txt").readLines("UTF-8").collect { String line ->
            line.trim()
        }.findAll { String line ->
            !line.isEmpty()
        }
        allowedExpectedMarkers.each { String marker ->
            if (!expectedOutput.contains(marker)) {
                throw new GradleException("nugget admin console expected output missing marker: ${marker}")
            }
        }
        expectedOutput.each { String marker ->
            if (!allowedExpectedMarkers.contains(marker)) {
                throw new GradleException("nugget admin console expected output contains untested marker: ${marker}")
            }
        }
        String localBuild = new File(root, "build.gradle").getText("UTF-8")
        if (localBuild.contains("smokeNuggetAdminConsoleExample")) {
            throw new GradleException("nugget admin console example declares a task that is not loaded by the root build")
        }
    }
}

