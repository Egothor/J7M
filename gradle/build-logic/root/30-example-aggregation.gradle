/*
 * Purpose: orchestrates developer-facing example validation, packaging, smoke runs,
 * and local deployer workflow placeholders.
 * Owns: validateRequiredExampleFiles, validateExampleReadmes, validateExamples,
 * buildExamples, packageExamples, verifyExamples, runExamplesSmoke, and j7m* local workflow tasks.
 * Must not own: production module dependencies, j7m-demo JavaExec task bodies,
 * or source code for examples.
 * Root rationale: examples span standalone directories and compiled support modules,
 * so root orchestration validates taxonomy without hiding module-local dependencies.
 * Related validation tasks: validateExamples, validateExampleReadmes,
 * validateAnnotationExamples, validateExampleSourceDocumentation.
 */

tasks.register("validateRequiredExampleFiles") {
    group = "verification"
    description = "Validates required Phase 5.5 example files and README sections."
    dependsOn "validateExampleJavadocs"
    dependsOn "validateExampleSourceDocumentation"
    doLast {
        List<String> examples = [
                "hello-remote-service",
                "callbacks-and-events",
                "secure-banking-workflow",
                "workload-processing",
                "streaming-pipeline",
                "ha-hp-cluster",
                "deployable-application",
                "regulated-enterprise-app",
                "annotation-first-simple-service",
                "annotation-first-secure-service",
                "annotation-first-remote-invocation",
                "annotation-first-security-audit",
                "annotation-first-saga-workflow",
                "annotation-first-durable-queue-consumer",
                "annotation-first-lifecycle",
                "annotation-first-isolation-profile",
                "annotation-first-observability",
                "nugget-admin-console"
        ]
        List<String> additionalExamples = [
                "modular-deployable-application"
        ]
        Set<String> nonModularAnnotationExamples = [
                "annotation-first-remote-invocation",
                "annotation-first-security-audit"
        ] as Set
        Set<String> basicAnnotationExamplesWithoutManifest = [
                "annotation-first-simple-service",
                "annotation-first-lifecycle"
        ] as Set
        List<String> allDocumentedExamples = []
        allDocumentedExamples.addAll(examples)
        allDocumentedExamples.addAll(additionalExamples)
        List<String> templates = [
                "annotation-first-service",
                "deployable-app",
                "secure-service",
                "simple-service",
                "streaming-app",
                "workload-app"
        ]
        List<String> sections = [
                "Purpose",
                "Architecture flow",
                "Prerequisites",
                "Build",
                "Test",
                "Package",
                "Verify bundle",
                "Deploy to local repository",
                "Start / activate",
                "Invoke / verify behavior",
                "Status / observability",
                "Stop / unload",
                "Upgrade / rollback, where applicable",
                "Expected output",
                "Security notes",
                "Cleanup",
                "Known limitations"
        ]
        allDocumentedExamples.each { String example ->
            File root = file("examples/${example}")
            File readme = new File(root, "README.md")
            if (!readme.isFile()) {
                throw new GradleException("missing README for required example ${example}")
            }
            String readmeText = readme.getText("UTF-8")
            sections.each { String section ->
                if (!readmeText.contains("## ${section}")) {
                    throw new GradleException("README for ${example} missing section ${section}")
                }
            }
            String lower = readmeText.toLowerCase(java.util.Locale.ROOT)
            ["documentation placeholder", "deferred", "future packaged", "future end-to-end"].each { String marker ->
                if (lower.contains(marker)) {
                    throw new GradleException("required example ${example} contains placeholder marker: ${marker}")
                }
            }
        }
        examples.each { String example ->
            File root = file("examples/${example}")
            if (!new File(root, "build.gradle").isFile()) {
                throw new GradleException("missing build.gradle for required example ${example}")
            }
            File manifest = new File(root, "META-INF/j7m-application.json")
            if (example == "nugget-admin-console") {
                if (manifest.isFile()) {
                    throw new GradleException("operator-only example ${example} must not declare a J7M application manifest")
                }
            } else if (basicAnnotationExamplesWithoutManifest.contains(example)) {
                if (manifest.isFile()) {
                    throw new GradleException("BASIC annotation example ${example} must not declare a J7M application manifest without production packaging validation")
                }
            } else if (!manifest.isFile()) {
                throw new GradleException("missing manifest for required example ${example}")
            }
            File mainRoot = new File(root, "src/main/java")
            File testRoot = new File(root, "src/test/java")
            if (!mainRoot.isDirectory() || fileTree(mainRoot).matching { include "**/*.java" }.files.isEmpty()) {
                throw new GradleException("full example ${example} has no main Java source")
            }
            if (!testRoot.isDirectory() || fileTree(testRoot).matching { include "**/*.java" }.files.isEmpty()) {
                throw new GradleException("full example ${example} has no test Java source")
            }
            if (!nonModularAnnotationExamples.contains(example) && !new File(mainRoot, "module-info.java").isFile()) {
                throw new GradleException("full example ${example} missing JPMS module-info.java")
            }
            File expectedOutput = new File(root, "EXPECTED_OUTPUT.txt")
            if (!expectedOutput.isFile()) {
                throw new GradleException("full example ${example} missing EXPECTED_OUTPUT.txt")
            }
            List<String> requiredMarkers = []
            switch (example) {
                case "hello-remote-service":
                    requiredMarkers = ["export", "lookup", "proxy invocation", "package/deploy/start/status"]
                    break
                case "callbacks-and-events":
                    requiredMarkers = ["callback", "grpc", "rmi", "audit"]
                    break
                case "secure-banking-workflow":
                    requiredMarkers = ["@requiresrole", "@requirespermission", "@sensitive", "denied"]
                    break
                case "workload-processing":
                    requiredMarkers = ["checkpoint", "lease", "fencing", "cancellation"]
                    break
                case "streaming-pipeline":
                    requiredMarkers = ["server batch", "client batch", "bidirectional", "backpressure"]
                    break
                case "ha-hp-cluster":
                    requiredMarkers = ["failover", "overload penalty", "selection explanation"]
                    break
                case "deployable-application":
                    requiredMarkers = [".j7m", "repository publish", "upgrade", "rollback"]
                    break
                case "regulated-enterprise-app":
                    requiredMarkers = ["compliance evidence", "tamper-evident", "crypto posture", "no certification claim"]
                    break
                case "annotation-first-simple-service":
                    requiredMarkers = ["@j7mapplication", "@j7mservice", "constructor injection", "@j7mresource"]
                    break
                case "annotation-first-secure-service":
                    requiredMarkers = ["@requiresrole", "@requirespermission", "@sensitive", "denied"]
                    break
                case "annotation-first-remote-invocation":
                    requiredMarkers = ["@remoteservice", "@oneway", "@callback", "non-idempotent"]
                    break
                case "annotation-first-security-audit":
                    requiredMarkers = ["@requiresrole", "@requirespermission", "@requirestrustdomain", "confidential boundary"]
                    break
                case "annotation-first-saga-workflow":
                    requiredMarkers = ["@sagadefinition", "@sagastep", "@compensation", "descriptor-only"]
                    break
                case "annotation-first-durable-queue-consumer":
                    requiredMarkers = ["@durablequeueconsumer", "@outboxpublisher", "@inboxhandler", "descriptor-only"]
                    break
                case "annotation-first-lifecycle":
                    requiredMarkers = ["@initialize", "@startup", "@healthcheck", "@readinesscheck"]
                    break
                case "annotation-first-isolation-profile":
                    requiredMarkers = ["@isolationprofile", "descriptor-only", "isolationprovider"]
                    break
                case "annotation-first-observability":
                    requiredMarkers = ["workload", "routing", "recovery", "benchmark"]
                    break
                case "nugget-admin-console":
                    requiredMarkers = ["safe pin", "discovery", "auth", "status", "info", "inspection", "lifecycle", "kill-disabled"]
                    break
                default:
                    requiredMarkers = []
            }
            String readmeText = new File(root, "README.md").getText("UTF-8").toLowerCase(java.util.Locale.ROOT)
            requiredMarkers.each { String marker ->
                if (!readmeText.contains(marker)) {
                    throw new GradleException("README for ${example} does not document required scenario marker ${marker}")
                }
            }
            fileTree(root).matching { include "**/*.java"; exclude "**/build/**" }.files.each { File source ->
                String text = source.getText("UTF-8").toLowerCase(java.util.Locale.ROOT)
                ["todo", "unsupportedoperationexception", "not implemented", "placeholder"].each { String marker ->
                    if (text.contains(marker)) {
                        throw new GradleException("full example ${example} contains placeholder source marker ${marker} in ${source}")
                    }
                }
            }
        }
        templates.each { String template ->
            File root = file("examples/templates/${template}")
            if (!root.isDirectory() || !new File(root, "README.md").isFile()) {
                throw new GradleException("missing template example ${template}")
            }
        }
        if (!file("examples/regulated-enterprise-app/META-INF/sbom.spdx.json").isFile()) {
            throw new GradleException("regulated enterprise example missing SBOM")
        }
        if (!file("examples/regulated-enterprise-app/META-INF/j7m-provenance.json").isFile()) {
            throw new GradleException("regulated enterprise example missing provenance")
        }
    }
}

