            inventoryRows.each { Map<String, Object> row ->
                String taskName = row.taskName as String
                taskCounts[taskName] = taskCounts.getOrDefault(taskName, 0) + 1
            }
            List<String> duplicateTasks = taskCounts.findAll { String taskName, Integer count -> count > 1 }.keySet().toList().sort()
            if (!duplicateTasks.isEmpty()) {
                throw new GradleException("demo task inventory contains duplicate task rows: ${duplicateTasks}")
            }
            Set<String> inventoriedTasks = inventoryRows.collect { Map<String, Object> row -> row.taskName as String }.toSet()
            List<String> missingInventory = registeredRunTasks.findAll { String taskName -> !inventoriedTasks.contains(taskName) }.sort()
