tasks.register("validateProfessionalJavadocs") {
    group = "verification"
    description = "Runs the stricter Phase 6.11 professional public API documentation audit."
    dependsOn "validatePublicApiDocs"
    dependsOn "validateExampleJavadocs"
    dependsOn "validateExampleSourceDocumentation"
    doLast {
        List<String> shallowPatterns = [
                "/** Gets ",
                "/** Returns the value.",
                "/** Creates object.",
                "Tag-only"
        ]
        List<File> publicSources = fileTree("j7m-api/src/main/java").matching {
            include "**/*.java"
            exclude "**/internal/**"
        }.files as List<File>
        List<String> shallow = []
        publicSources.each { File source ->
            String text = source.getText("UTF-8")
            shallowPatterns.each { String pattern ->
                if (text.contains(pattern)) {
                    shallow.add("${source}:${pattern}")
                }
            }
        }
        if (!shallow.isEmpty()) {
            throw new GradleException("shallow public API Javadocs detected: ${shallow.take(20)}")
        }
    }
}

tasks.named("build") {
    dependsOn "validatePublicApiDocs"
    dependsOn "validateBuildConventions"
    dependsOn "validateVersionCatalog"
    dependsOn "validateModuleTopology"
    dependsOn "validateInjectionModel"
    dependsOn "validateAnnotationModel"
    dependsOn "validateProfessionalJavadocs"
    dependsOn "validateExampleJavadocs"
    dependsOn "validateExampleSourceDocumentation"
}
