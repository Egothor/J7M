/*
 * Purpose: validates Gradle build architecture, version catalog use, module topology,
 * injection model presence, annotation model coverage, and example documentation quality.
 * Owns: validateBuildConventions, validateVersionCatalog, validateModuleTopology,
 * validateInjectionModel, validateAnnotationModel, validateAnnotationExamples,
 * validateExampleJavadocs, validateExampleSourceDocumentation, and validateProfessionalJavadocs.
 * Must not own: production dependency declarations, demo JavaExec implementations,
 * example packaging implementations, or release-report generation.
 * Root rationale: these are cross-repository guards that inspect build logic,
 * modules, and examples from an orchestration perspective.
 * Related validation tasks: validateBuildConventions, validateVersionCatalog,
 * validateModuleTopology, validateInjectionModel, validateAnnotationModel,
 * validateAnnotationExamples, validateExampleJavadocs, validateExampleSourceDocumentation,
 * validateProfessionalJavadocs.
 */

tasks.register("validateBuildConventions") {
    group = "verification"
    description = "Validates Phase 6.11 Gradle convention plugin structure."
    doLast {
        int rootBuildNonCommentLimit = 80
        int rootBuildTaskRegistrationLimit = 0
        List<String> requiredPlugins = [
                "j7m.java-conventions.gradle",
                "j7m.jpms-library.gradle",
                "j7m.public-api-module.gradle",
                "j7m.platform-service-module.gradle",
                "j7m.transport-module.gradle",
                "j7m.demo-module.gradle",
                "j7m.example-module.gradle",
                "j7m.test-module.gradle",
                "j7m.tck-module.gradle",
                "j7m.javadoc-conventions.gradle",
                "j7m.validation-conventions.gradle"
        ]
        List<String> missing = requiredPlugins.findAll { String pluginName ->
            !file("buildSrc/src/main/groovy/${pluginName}").isFile()
        }
        if (!missing.isEmpty()) {
            throw new GradleException("missing convention plugins: ${missing}")
        }
        String rootBuild = file("build.gradle").getText("UTF-8")
        Closure<Integer> nonCommentLines = { String text ->
            int count = 0
            text.readLines().each { String line ->
                String trimmed = line.trim()
                if (!trimmed.isEmpty() && !trimmed.startsWith("//")) {
                    count++
                }
            }
            return count
        }
        Closure<Void> validateRootText = { String text ->
            int nonComment = nonCommentLines(text)
            if (nonComment > rootBuildNonCommentLimit) {
                throw new GradleException("root build.gradle exceeds orchestration line budget: ${nonComment} > ${rootBuildNonCommentLimit}")
            }
            int taskRegistrations = 0
            java.util.regex.Matcher taskMatcher = java.util.regex.Pattern.compile("(?m)^\\s*tasks\\.register\\(").matcher(text)
            while (taskMatcher.find()) {
                taskRegistrations++
            }
            if (taskRegistrations > rootBuildTaskRegistrationLimit) {
                throw new GradleException("root build.gradle contains inline task registrations: ${taskRegistrations}")
            }
            if (java.util.regex.Pattern.compile("(?m)^\\s*project\\(\\s*['\\\"]:j7m-[^'\\\"]+['\\\"]\\s*\\)\\s*\\{").matcher(text).find()) {
                throw new GradleException("root build.gradle contains module-specific project configuration block")
            }
            if (java.util.regex.Pattern.compile("(?m)^\\s*tasks\\.register\\(\\s*['\\\"]run[A-Za-z0-9]*(Demo|Example)['\\\"]\\s*,\\s*JavaExec").matcher(text).find()) {
                throw new GradleException("root build.gradle contains module-specific JavaExec demo task body")
            }
            if (java.util.regex.Pattern.compile("(?m)^\\s*(api|implementation|compileOnly|runtimeOnly|testImplementation|testRuntimeOnly)\\s+project\\(\\s*['\\\"]:j7m-[^'\\\"]+['\\\"]\\s*\\)").matcher(text).find()) {
                throw new GradleException("root build.gradle contains production module dependency wiring")
            }
        }
        List<String> missingSegmentDocumentation = []
        fileTree("gradle/build-logic/root").matching { include "*.gradle" }.files.each { File segment ->
            String text = segment.getText("UTF-8")
            ["Purpose:", "Owns:", "Must not own:", "Root rationale:", "Related validation tasks:"].each { String marker ->
                if (!text.contains(marker)) {
                    missingSegmentDocumentation.add("${segment}:${marker}")
                }
            }
            if (java.util.regex.Pattern.compile("(?m)^\\s*(api|implementation|compileOnly|runtimeOnly|testImplementation|testRuntimeOnly)\\s+project\\(").matcher(text).find()) {
                throw new GradleException("root build segment hides production dependency graph: ${segment}")
            }
            if (java.util.regex.Pattern.compile("(?m)^\\s*tasks\\.register\\(\\s*['\\\"]run[A-Za-z0-9]*(Demo|Example)['\\\"]\\s*,\\s*JavaExec").matcher(text).find()) {
                throw new GradleException("root build segment contains demo JavaExec task body: ${segment}")
            }
        }
        if (!missingSegmentDocumentation.isEmpty()) {
            throw new GradleException("root build segments missing ownership documentation: ${missingSegmentDocumentation}")
        }
        Map<String, String> rootConventionPatterns = [
                "JavaCompile convention": "(?m)^\\s*tasks\\.withType\\(JavaCompile\\)",
                "Test convention": "(?m)^\\s*tasks\\.withType\\(Test\\)",
                "JavaExec convention": "(?m)^\\s*tasks\\.withType\\(JavaExec\\)",
                "Javadoc convention": "(?m)^\\s*tasks\\.withType\\(Javadoc\\)"
        ]
        rootConventionPatterns.each { String label, String pattern ->
            if (java.util.regex.Pattern.compile(pattern).matcher(rootBuild).find()) {
                throw new GradleException("root build still owns repeated ${label}")
            }
        }
        validateRootText(rootBuild)

        List<String> weakConventionPlugins = []
        fileTree("buildSrc/src/main/groovy").matching { include "j7m.*.gradle" }.files.each { File plugin ->
            String text = plugin.getText("UTF-8")
            boolean hasPurpose = text.contains("j7mConventionPurpose")
            boolean hasConfiguration = text.contains("tasks.withType")
                    || text.contains("java {")
                    || text.contains("application")
                    || text.contains("j7mConventionKind")
            if (!hasPurpose || !hasConfiguration) {
                weakConventionPlugins.add(plugin.path)
            }
        }
        if (!weakConventionPlugins.isEmpty()) {
            throw new GradleException("convention plugins lack meaningful configuration or documented purpose: ${weakConventionPlugins}")
        }

        List<String> moduleBuildViolations = []
        fileTree(".").matching {
            include "j7m-*/build.gradle"
            include "examples/*/build.gradle"
            include "examples/*/*/build.gradle"
            exclude "build/**"
        }.files.each { File moduleBuild ->
            String text = moduleBuild.getText("UTF-8")
            if (java.util.regex.Pattern.compile("\"(?:org\\.junit|org\\.junit\\.platform|io\\.grpc|com\\.google\\.protobuf):[^\"]+:[^\"]+\"").matcher(text).find()) {
                moduleBuildViolations.add("${moduleBuild}:hardcoded dependency version")
            }
            ["tasks.withType(JavaCompile)", "tasks.withType(Test)", "tasks.withType(Javadoc)", "tasks.withType(JavaExec)", "languageVersion = JavaLanguageVersion.of"].each { String marker ->
                if (text.contains(marker)) {
                    moduleBuildViolations.add("${moduleBuild}:repeated standard boilerplate ${marker}")
                }
            }
        }
        if (!moduleBuildViolations.isEmpty()) {
            throw new GradleException("module-local build convention violations: ${moduleBuildViolations}")
        }

        Closure<Void> expectBuildConventionFailure = { String name, Closure<Void> action ->
            try {
                action.call()
            } catch (GradleException expected) {
                return
            }
            throw new GradleException("synthetic invalid build convention passed validation: ${name}")
        }
        String oversizedRoot = (1..(rootBuildNonCommentLimit + 1)).collect { "tasks.register(\"x${it}\") { }" }.join("\n")
        expectBuildConventionFailure("oversized-root") { validateRootText(oversizedRoot) }
        expectBuildConventionFailure("root-project-block") { validateRootText("project(\":j7m-demo\") { dependencies { implementation project(\":j7m-api\") } }") }
        expectBuildConventionFailure("root-demo-javaexec") { validateRootText("tasks.register(\"runExampleDemo\", JavaExec) { mainClass = \"Example\" }") }
        expectBuildConventionFailure("root-example-task") { validateRootText("tasks.register(\"runExampleSmoke\") { doLast { println \"example\" } }") }
        expectBuildConventionFailure("root-dependency-wiring") { validateRootText("implementation project(\":j7m-demo\")") }
        expectBuildConventionFailure("undocumented-segment") {
            String badSegment = "tasks.register(\"validateSomething\") { }"
            if (!badSegment.contains("Purpose:")) {
                throw new GradleException("synthetic undocumented segment rejected")
            }
        }
        expectBuildConventionFailure("mixed-concern-segment") {
            String badSegment = "implementation project(\":j7m-api\")"
            if (java.util.regex.Pattern.compile("(?m)^\\s*(api|implementation|compileOnly|runtimeOnly|testImplementation|testRuntimeOnly)\\s+project\\(").matcher(badSegment).find()) {
                throw new GradleException("synthetic mixed-concern segment rejected")
            }
        }
        expectBuildConventionFailure("hardcoded-version") {
            String badModule = "dependencies { testImplementation \"org.junit.jupiter:junit-jupiter:5.14.3\" }"
            if (badModule.contains("org.junit.jupiter:junit-jupiter:5.14.3")) {
                throw new GradleException("synthetic hardcoded version rejected")
            }
        }
        expectBuildConventionFailure("repeated-boilerplate") {
            String badModule = "tasks.withType(JavaCompile).configureEach { options.release = 25 }"
            if (badModule.contains("tasks.withType(JavaCompile)")) {
                throw new GradleException("synthetic repeated boilerplate rejected")
            }
        }
        expectBuildConventionFailure("noop-convention") {
            String badPlugin = "plugins { id \"j7m.java-conventions\" }"
            if (!badPlugin.contains("j7mConventionPurpose")) {
                throw new GradleException("synthetic no-op convention rejected")
            }
        }
    }
}

tasks.register("validateVersionCatalog") {
    group = "verification"
    description = "Validates centralized dependency versions and forbidden dependency patterns."
    doLast {
        File catalog = file("gradle/libs.versions.toml")
        if (!catalog.isFile()) {
            throw new GradleException("missing Gradle version catalog: gradle/libs.versions.toml")
        }
        String catalogText = catalog.getText("UTF-8")
        ["junit-jupiter", "junit-platform-launcher", "grpc-api", "grpc-stub", "grpc-netty-shaded", "protobuf-java"].each { String alias ->
            if (!catalogText.contains(alias)) {
                throw new GradleException("version catalog missing required alias: ${alias}")
            }
        }
        String rootBuild = file("build.gradle").getText("UTF-8")
        java.util.regex.Matcher coordinateMatcher = java.util.regex.Pattern
                .compile("\"(?:org\\.junit|org\\.junit\\.platform|io\\.grpc|com\\.google\\.protobuf):[^\"]+:[^\"]+\"")
                .matcher(rootBuild)
        if (coordinateMatcher.find()) {
            throw new GradleException("hardcoded third-party dependency coordinate remains in root build: ${coordinateMatcher.group()}")
        }
        List<String> forbidden = [
                "org.apache.kafka", "com.rabbitmq", "org.apache.pulsar", "io.etcd", "org.apache.zookeeper",
                "io.kubernetes", "io.fabric8", "org.postgresql", "org.elasticsearch", "com.amazonaws",
                "software.amazon.awssdk", "com.google.cloud", "com.azure", "com.github.dockerjava",
                "org.testcontainers"
        ]
        List<String> matches = []
        [catalog, file("build.gradle"), file("settings.gradle")].findAll { File candidate -> candidate.isFile() }.each { File candidate ->
            candidate.readLines("UTF-8").eachWithIndex { String line, int index ->
                String trimmed = line.trim()
                boolean productionDependencyLine = trimmed ==~ /^(api|implementation|compileOnly|runtimeOnly)\s+.*/
                boolean catalogDependencyLine = candidate.name == "libs.versions.toml" && trimmed.startsWith("[") == false
                if (productionDependencyLine || catalogDependencyLine) {
                    forbidden.each { String token ->
                        if (trimmed.contains(token)) {
                            matches.add("${candidate}:${index + 1}:${token}")
                        }
                    }
                }
            }
        }
        if (!matches.isEmpty()) {
            throw new GradleException("forbidden production dependency pattern found: ${matches}")
        }
    }
}

tasks.register("validateModuleTopology") {
    group = "verification"
    description = "Validates the current published module topology inventory."
    doLast {
        File topology = file("documentation/docs/programming/module-dependencies.md")
        if (!topology.isFile()) {
            throw new GradleException("missing module consolidation document")
        }
        String text = topology.getText("UTF-8")
        ["JPMS", "requires", "ServiceLoader"].each { String marker ->
            if (!text.contains(marker)) {
                throw new GradleException("module topology document missing marker: ${marker}")
            }
        }
        List<String> missingProjects = subprojects.findAll { Project candidate ->
            candidate.file("src/main/java/module-info.java").isFile()
        }.collect { Project candidate -> candidate.path }
                .findAll { String path -> !text.contains(path.substring(1)) }
        if (!missingProjects.isEmpty()) {
            throw new GradleException("module topology document missing subprojects: ${missingProjects}")
        }
    }
}

tasks.register("validateInjectionModel") {
    group = "verification"
    description = "Validates the J7M-native injection model vertical slice."
    dependsOn ":j7m-application-platform:test"
    doLast {
        [
                "j7m-api/src/main/java/org/j7m/middleware/application/api/J7mInjector.java",
                "j7m-api/src/main/java/org/j7m/middleware/application/api/InjectionBindingKey.java",
                "j7m-application-platform/src/main/java/org/j7m/middleware/application/components/DefaultJ7mInjector.java",
                "j7m-application-platform/src/test/java/org/j7m/middleware/application/components/J7mInjectionModelTest.java"
        ].each { String path ->
            if (!file(path).isFile()) {
                throw new GradleException("missing injection model file: ${path}")
            }
        }
    }
}

tasks.register("validateAnnotationModel") {
    group = "verification"
    description = "Validates the annotation-first developer programming model."
    dependsOn ":j7m-application-platform:test"
    doLast {
        [
                "J7mApplication.java", "J7mComponent.java", "J7mService.java", "Inject.java",
                "ConfigValue.java", "J7mResource.java", "CurrentInvocation.java", "CurrentPrincipal.java",
                "CurrentApplication.java", "HealthCheck.java", "ReadinessCheck.java"
        ].each { String fileName ->
            if (!file("j7m-api/src/main/java/org/j7m/middleware/annotations/${fileName}").isFile()) {
                throw new GradleException("missing annotation API: ${fileName}")
            }
        }
        if (!file("j7m-application-platform/src/main/java/org/j7m/middleware/application/components/AnnotationModelProcessor.java").isFile()) {
            throw new GradleException("missing annotation model processor")
        }
    }
}

