                }
                if (row.supportOnly) {
                    if (!(row.classification as String).contains("support smoke")) {
                        throw new GradleException("support-only demo task lacks support smoke classification: ${taskName}")
                    }
                    return
                }
                File source = file(row.sourceFile as String)
                if (!source.isFile()) {
                    throw new GradleException("demo task inventory maps ${taskName} to missing source file: ${source}")
                }
                if ((row.signatures as List<String>).isEmpty()) {
                    throw new GradleException("demo task inventory maps ${taskName} without method-flow signatures")
                }
                if ((row.concepts as List<List<String>>) == null || (row.concepts as List<List<String>>).isEmpty()) {
                    throw new GradleException("demo task inventory maps ${taskName} without intended concepts")
                }
                if (!(row.minimumTeachingComments instanceof Number) || (row.minimumTeachingComments as int) <= 0) {
                    throw new GradleException("demo task inventory maps ${taskName} without teaching-comment requirement")
                }
                String sourceText = source.getText("UTF-8")
                String simpleClassName = (row.mainClass as String).tokenize(".").last()
                if (!sourceText.contains("class ${simpleClassName}") && !sourceText.contains("interface ${simpleClassName}")) {
                    throw new GradleException("demo task inventory maps ${taskName} to stale source file: ${source}")
                }
                (row.signatures as List<String>).each { String signature ->
                    if (!sourceText.contains(signature)) {
                        throw new GradleException("demo task inventory maps ${taskName} to stale source missing signature: ${signature}")
                    }
                }
            }
        }
        Closure<Void> validateDemoTaskInventory = {
            File demoBuild = file("j7m-demo/build.gradle")
            if (!demoBuild.isFile()) {
                throw new GradleException("missing j7m-demo/build.gradle for demo task inventory validation")
            }
            validateDemoTaskInventoryRows(registeredRunTasksFrom(demoBuild.getText("UTF-8")), demoTaskInventory)
        }
        Closure<Void> validateDemoMethodRequirements = { String name, String text ->
            String fileName = new File(name).name
            String normalizedName = name.replace(File.separatorChar, '/' as char)
            List<Map<String, Object>> rows = demoTaskInventory.findAll { Map<String, Object> row ->
                if (row.supportOnly) {
                    return false
                }
                String sourceFile = (row.sourceFile as String).replace(File.separatorChar, '/' as char)
                return normalizedName.endsWith(sourceFile) || new File(sourceFile).name == fileName
            }
            if (rows.isEmpty()) {
                return
            }
            rows.each { Map<String, Object> requirements ->
                StringBuilder methodFlow = new StringBuilder()
                (requirements.signatures as List<String>).each { String signature ->
                    String body = methodBody(text, signature)
                    if (body.isEmpty()) {
                        throw new GradleException("${name} missing required demo method body for ${requirements.taskName} signature: ${signature}")
                    }
                    methodFlow.append(body).append('\n')
                }
                String methodComments = commentText(methodFlow.toString())
                validateTeachingLineQuality("${name}:${requirements.taskName}", methodComments, requirements.minimumTeachingComments as int)
                requireTeachingConcepts("${name}:${requirements.taskName}", methodComments, requirements.concepts as List<List<String>>)
            }
        }
        Closure<Void> validateSourceText = { String name, String text ->
            String comments = commentText(text)
            String lowerComments = comments.toLowerCase(java.util.Locale.ROOT)
            if (!comments.contains("J7M teaching:")) {
                throw new GradleException("${name} lacks J7M teaching comments inside the developer-facing source flow")
            }
            ["todo", "tbd", "placeholder", "auto-generated", "generated comment"].each { String marker ->
                if (lowerComments.contains(marker)) {
                    throw new GradleException("${name} contains forbidden teaching-comment marker: ${marker}")
                }
            }
            ["// creates object", "// calls method", "// demo step", "// increments counter"].each { String shallow ->
                if (lowerComments.contains(shallow)) {
                    throw new GradleException("${name} contains shallow restatement comment: ${shallow}")
                }
            }
            ["enforces durable delivery automatically", "automatically enforces", "standalone security engine"].each { String overclaim ->
                boolean safeSecurityPhrase = lowerComments.contains("without treating annotations as a standalone security engine")
                        || lowerComments.contains("not a standalone security engine")
                if (lowerComments.contains(overclaim) && !safeSecurityPhrase) {
                    throw new GradleException("${name} contains teaching-comment overclaim: ${overclaim}")
                }
            }
            ["generic exactly-once", "distributed acid", "certified compatibility", "certified adapter",
             "full os sandbox guarantee", "full container runtime", "phase 7"].each { String forbidden ->
                if (lowerComments.contains(forbidden) && !safeForbiddenContext(lowerComments)) {
                    throw new GradleException("${name} contains forbidden positive teaching-comment claim: ${forbidden}")
                }
            }
            if (lowerComments.contains("phase6-demo-secret-value")) {
                throw new GradleException("${name} leaks a sentinel secret in teaching comments")
            }
            if (text.contains("@Sensitive") && !(lowerComments.contains("redact") || lowerComments.contains("redaction"))) {
                throw new GradleException("${name} uses @Sensitive without a teaching comment about redaction")
            }
            if ((text.contains("@RequiresRole") || text.contains("@RequiresPermission"))
                    && !(lowerComments.contains("authorization") || lowerComments.contains("denied"))) {
                throw new GradleException("${name} uses security annotations without a teaching comment about authorization")
            }
            if ((text.contains("@Initialize") || text.contains("@Startup") || text.contains("@Drain") || text.contains("@Shutdown"))
                    && !(lowerComments.contains("lifecycle") && lowerComments.contains("order"))) {
                throw new GradleException("${name} uses lifecycle annotations without a teaching comment about lifecycle order")
            }
            if ((text.contains("@DurableQueueConsumer") || text.contains("@OutboxPublisher") || text.contains("@InboxHandler"))
                    && !(lowerComments.contains("descriptor metadata") || lowerComments.contains("durablequeue") || lowerComments.contains("durable delivery"))) {
                throw new GradleException("${name} uses queue annotations without a teaching comment about descriptor-only delivery boundaries")
            }
            if ((text.contains("@SagaDefinition") || text.contains("@SagaStep") || text.contains("@Compensation"))
                    && !(lowerComments.contains("descriptor metadata") || lowerComments.contains("saga"))) {
                throw new GradleException("${name} uses saga annotations without a teaching comment about saga descriptor boundaries")
            }
            if (text.contains("@IsolationProfile") && !(lowerComments.contains("container") || lowerComments.contains("os sandbox"))) {
                throw new GradleException("${name} uses isolation annotations without a teaching comment about isolation limits")
            }
            if (name.endsWith("AnnotationModelDemo.java")) {
                ["descriptor", "injection", "lifecycle", "redaction", "descriptor-only", "external services"].each { String term ->
                    if (!lowerComments.contains(term)) {
                        throw new GradleException("${name} AnnotationModelDemo comments missing concept: ${term}")
                    }
                }
            }
            validateDemoMethodRequirements(name, text)
        }

        validateDemoTaskInventory.call()

        sourceFiles.each { File source ->
            validateSourceText(source.path, source.getText("UTF-8"))
        }

        Closure<Void> expectFailure = { String name, String text ->
            try {
                validateSourceText(name, text)
            } catch (GradleException expected) {
                return
            }
            throw new GradleException("synthetic invalid source documentation passed validation: ${name}")
        }
        expectFailure("no-comments.java", "public final class Bad { public void run() { System.out.println(\"x\"); } }")
        expectFailure("shallow.java", "public final class Bad { public void run() { // calls method\nx(); } }")
        expectFailure("secure.java", "public final class Bad { @Sensitive public String run(String secret) { // J7M teaching: business code only.\nreturn secret; } }")
        expectFailure("lifecycle.java", "public final class Bad { @Startup public void start() { // J7M teaching: starts component.\n} }")
        expectFailure("descriptor-overclaim.java", "public final class Bad { @DurableQueueConsumer public void run() { // J7M teaching: this enforces durable delivery automatically.\n} }")
        expectFailure("forbidden.java", "public final class Bad { public void run() { // J7M teaching: provides generic exactly-once distributed ACID certified compatibility.\n} }")
        expectFailure("ConsensusSimulationDemo.java", "public final class ConsensusSimulationDemo {\n// J7M teaching: this demo block is self-contained so acceptance smoke runs do not require external services.\npublic static void main(String[] args) { electLeader(); submitCommand(); }\n}\n")
        expectFailure("ConsensusSimulationDemo.java", "public final class ConsensusSimulationDemo {\n// J7M teaching: adversarial leader election stale leader majority safety invariant exactly-once acid\npublic static void main(String[] args) { electLeader(); submitCommand(); }\n}\n")
        expectFailure("ConsensusSimulationDemo.java", "public final class ConsensusSimulationDemo {\npublic static void main(String[] args) {\n// J7M teaching: leader election is shown for the initial state so callers know which node accepts work.\n// J7M teaching: the majority side is used for progress after a partition so the demo remains deterministic.\n// J7M teaching: the report avoids generic exactly-once or ACID claims while printing safe status.\n}}\n")
        expectFailure("CoordinationDemo.java", "public final class CoordinationDemo {\npublic static void main(String[] args) {\n// J7M teaching: membership liveness evidence is safe and local to the demo.\n// J7M teaching: a lease is acquired for leadership evidence.\n// J7M teaching: compare-and-set records guarded metadata without consensus.\n}}\n")
        expectFailure("SagaDemo.java", "public final class SagaDemo {\npublic static void main(String[] args) {\n// J7M teaching: saga definition metadata sets the local workflow scope without ACID.\n// J7M teaching: ordered step execution is shown with a durable local service.\n// J7M teaching: compensation handles prior side effects without XA.\n// J7M teaching: timeout is driven by deterministic time.\n// J7M teaching: duplicate starts avoid generic exactly-once claims.\n// J7M teaching: status prints safe operational evidence.\n}}\n")
