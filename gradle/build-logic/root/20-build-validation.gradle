Closure<String> annotationFirstTaskSuffix = { String example ->
    return example.split("-").collect { String part -> part.capitalize() }.join("")
}

List<TaskProvider<JavaCompile>> annotationFirstStandaloneCompileTasks = []
List<TaskProvider<JavaExec>> annotationFirstStandaloneSmokeTasks = []
annotationFirstStandaloneExamples.each { String example ->
    String suffix = annotationFirstTaskSuffix(example)
    Provider<Directory> mainDestination = layout.buildDirectory.dir("classes/annotation-first-standalone/${example}/main")
    TaskProvider<JavaCompile> mainCompile = tasks.register("compile${suffix}StandaloneMain", JavaCompile) { JavaCompile task ->
        group = "verification"
        description = "Compiles the standalone ${example} main sources against the exported J7M public API."
        dependsOn ":j7m-api:classes"
        dependsOn ":j7m-kernel:classes"
        dependsOn ":j7m-runtime:classes"
        dependsOn ":j7m-durable-log:classes"
        dependsOn ":j7m-application-platform:classes"
        source = files(fileTree("examples/${example}/src/main/java") {
            include "**/*.java"
        })
        classpath = files(
                project(":j7m-api").sourceSets.main.output,
                project(":j7m-kernel").sourceSets.main.output,
                project(":j7m-runtime").sourceSets.main.output,
                project(":j7m-durable-log").sourceSets.main.output,
                project(":j7m-application-platform").sourceSets.main.output)
        destinationDirectory = mainDestination
        options.release = 25
        options.encoding = "UTF-8"
    }
    TaskProvider<JavaCompile> testCompile = tasks.register("compile${suffix}StandaloneTest", JavaCompile) { JavaCompile task ->
        group = "verification"
        description = "Compiles the standalone ${example} test sources against the compiled example main output."
        dependsOn mainCompile
        source = files(fileTree("examples/${example}/src/test/java") {
            include "**/*.java"
        })
        classpath = files(
                mainDestination,
                project(":j7m-api").sourceSets.main.output,
                project(":j7m-kernel").sourceSets.main.output,
                project(":j7m-runtime").sourceSets.main.output,
                project(":j7m-durable-log").sourceSets.main.output,
                project(":j7m-application-platform").sourceSets.main.output)
        destinationDirectory = layout.buildDirectory.dir("classes/annotation-first-standalone/${example}/test")
        options.release = 25
        options.encoding = "UTF-8"
    }
    annotationFirstStandaloneCompileTasks.add(testCompile)
    if (annotationFirstSmokeMainClasses.containsKey(example)) {
        TaskProvider<JavaExec> smokeTask = tasks.register("smoke${suffix}StandaloneExample", JavaExec) { JavaExec task ->
            group = "verification"
            description = "Runs deterministic annotation-first smoke output for ${example}."
            dependsOn mainCompile
            mainClass = annotationFirstSmokeMainClasses.get(example)
            classpath = files(
                    mainDestination,
                    project(":j7m-api").sourceSets.main.output,
                    project(":j7m-kernel").sourceSets.main.output,
                    project(":j7m-runtime").sourceSets.main.output,
                    project(":j7m-durable-log").sourceSets.main.output,
                    project(":j7m-application-platform").sourceSets.main.output)
            ByteArrayOutputStream capturedOutput = new ByteArrayOutputStream()
            standardOutput = capturedOutput
            errorOutput = capturedOutput
            outputs.file layout.buildDirectory.file("reports/j7m/annotation-first/${example}.out")
            doLast {
                File output = layout.buildDirectory.file("reports/j7m/annotation-first/${example}.out").get().asFile
                output.parentFile.mkdirs()
                String actual = capturedOutput.toString("UTF-8").replace("\r\n", "\n")
                output.setText(actual, "UTF-8")
                File expectedFile = file("examples/${example}/EXPECTED_OUTPUT.txt")
                expectedFile.readLines("UTF-8").findAll { String line -> !line.isBlank() }.each { String marker ->
                    if (!actual.contains(marker)) {
                        throw new GradleException("annotation-first smoke output for ${example} missing expected marker: ${marker}")
                    }
                }
                ["J7M_SECURITY_AUDIT_SENTINEL_SECRET", "J7M_OBSERVABILITY_SENTINEL_SECRET"].each { String sentinel ->
                    if (actual.contains(sentinel)) {
                        throw new GradleException("annotation-first smoke output for ${example} leaked secret sentinel: ${sentinel}")
                    }
                }
            }
        }
        annotationFirstStandaloneSmokeTasks.add(smokeTask)
    }
}

List<Map<String, Object>> annotationFirstBasicCopyPasteMavenModules = [
        [projectPath: ":j7m-api", artifactId: "j7m-api", dependencies: []],
        [projectPath: ":j7m-kernel", artifactId: "j7m-kernel", dependencies: ["j7m-api"]],
        [projectPath: ":j7m-runtime", artifactId: "j7m-runtime", dependencies: ["j7m-api", "j7m-kernel"]],
        [projectPath: ":j7m-durable-log", artifactId: "j7m-durable-log", dependencies: ["j7m-api"]],
        [projectPath: ":j7m-application-platform", artifactId: "j7m-application-platform", dependencies: ["j7m-api", "j7m-runtime", "j7m-durable-log"]]
]
Provider<Directory> annotationFirstBasicMavenRepository = layout.buildDirectory.dir("tmp/annotation-first-basic-maven-repository")
TaskProvider<Task> prepareAnnotationFirstBasicMavenRepository = tasks.register("prepareAnnotationFirstBasicCopyPasteMavenRepository") { Task task ->
    group = "verification"
    description = "Prepares a deterministic local Maven-style repository for BASIC annotation-first copy/paste validation."
    dependsOn annotationFirstBasicCopyPasteMavenModules.collect { Map<String, Object> module -> "${module.projectPath}:jar" }
    outputs.dir annotationFirstBasicMavenRepository
    doLast {
        File repositoryRoot = annotationFirstBasicMavenRepository.get().asFile
        delete(repositoryRoot)
        annotationFirstBasicCopyPasteMavenModules.each { Map<String, Object> module ->
            Project moduleProject = project(module.projectPath as String)
            org.gradle.jvm.tasks.Jar jarTask = moduleProject.tasks.named("jar", org.gradle.jvm.tasks.Jar).get()
            File jarFile = jarTask.archiveFile.get().asFile
            File artifactDirectory = new File(repositoryRoot, "org/j7m/${module.artifactId}/${project.version}")
            artifactDirectory.mkdirs()
            File targetJar = new File(artifactDirectory, "${module.artifactId}-${project.version}.jar")
            java.nio.file.Files.copy(jarFile.toPath(), targetJar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)

            StringBuilder pom = new StringBuilder(512)
            pom.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
            pom.append("<project xmlns=\"http://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd\">\n")
            pom.append("  <modelVersion>4.0.0</modelVersion>\n")
            pom.append("  <groupId>org.j7m</groupId>\n")
            pom.append("  <artifactId>").append(module.artifactId).append("</artifactId>\n")
            pom.append("  <version>").append(project.version).append("</version>\n")
            List<String> moduleDependencies = module.dependencies as List<String>
            if (!moduleDependencies.isEmpty()) {
                pom.append("  <dependencies>\n")
                moduleDependencies.each { String dependencyArtifactId ->
                    pom.append("    <dependency>\n")
                    pom.append("      <groupId>org.j7m</groupId>\n")
                    pom.append("      <artifactId>").append(dependencyArtifactId).append("</artifactId>\n")
                    pom.append("      <version>").append(project.version).append("</version>\n")
                    pom.append("    </dependency>\n")
                }
                pom.append("  </dependencies>\n")
            }
            pom.append("</project>\n")
            new File(artifactDirectory, "${module.artifactId}-${project.version}.pom").setText(pom.toString(), "UTF-8")
        }
    }
}

