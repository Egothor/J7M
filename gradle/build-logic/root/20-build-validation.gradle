tasks.register("validateAnnotationExamples") {
    group = "verification"
    description = "Validates Phase 7.10 annotation-first examples, README coverage, compile gates, copy/paste gates, and executable demo coverage."
    dependsOn ":j7m-examples:test"
    dependsOn ":j7m-demo:runAnnotationModelDemo"
    dependsOn "compileAnnotationFirstStandaloneExamples"
    dependsOn annotationFirstStandaloneSmokeTasks
    dependsOn "validateAnnotationFirstBasicCopyPasteExamples"
    dependsOn "validateExampleJavadocs"
    dependsOn "validateExampleSourceDocumentation"
    doLast {
        List<String> examples = annotationFirstStandaloneExamples
        List<String> readmeSections = [
                "Purpose",
                "Architecture flow",
                "Annotations demonstrated",
                "Injected services demonstrated",
                "Enforcement status",
                "Prerequisites",
                "Build",
                "Test",
                "Package",
                "Run / demo",
                "Verification",
                "Expected output",
                "Security notes",
                "Redaction notes",
                "Troubleshooting",
                "Cleanup",
                "Known limitations"
        ]
        examples.each { String example ->
            File root = file("examples/${example}")
            if (!root.isDirectory()) {
                throw new GradleException("missing annotation-first example: ${example}")
            }
            List<String> requiredFiles = ["README.md", "build.gradle", "EXPECTED_OUTPUT.txt"]
            if (!annotationFirstBasicCopyPasteExamples.contains(example)) {
                requiredFiles.add("META-INF/j7m-application.json")
            }
            requiredFiles.each { String name ->
                if (!new File(root, name).isFile()) {
                    throw new GradleException("annotation-first example ${example} missing ${name}")
                }
            }
            if (annotationFirstBasicCopyPasteExamples.contains(example)
                    && new File(root, "META-INF/j7m-application.json").isFile()) {
                throw new GradleException("BASIC annotation example ${example} must not declare META-INF/j7m-application.json unless validateAnnotationFirstBasicCopyPasteExamples validates production packaging")
            }
            File mainRoot = new File(root, "src/main/java")
            File testRoot = new File(root, "src/test/java")
            if (annotationFirstModularExamples.contains(example) && !new File(mainRoot, "module-info.java").isFile()) {
                throw new GradleException("annotation-first example ${example} missing module-info.java")
            }
            if (fileTree(mainRoot).matching { include "**/*.java" }.files.size() < 2) {
                throw new GradleException("annotation-first example ${example} has too little main source")
            }
            if (fileTree(testRoot).matching { include "**/*.java" }.files.isEmpty()) {
                throw new GradleException("annotation-first example ${example} has no test source")
            }
            String readmeText = new File(root, "README.md").getText("UTF-8")
            readmeSections.each { String section ->
                if (!readmeText.contains("## ${section}")) {
                    throw new GradleException("annotation-first README ${example} missing section ${section}")
                }
            }
            if (!readmeText.contains("## Start Here")) {
                throw new GradleException("annotation-first README ${example} missing Start Here section")
            }
            if (!readmeText.contains("## Safe modification exercise")) {
                throw new GradleException("annotation-first README ${example} missing safe modification exercise")
            }
            if (!readmeText.contains("./gradlew validateAnnotationExamples --no-daemon")) {
                throw new GradleException("annotation-first README ${example} missing current validation command")
            }
            if (!readmeText.contains("EXPECTED_OUTPUT.txt")) {
                throw new GradleException("annotation-first README ${example} missing expected-output file reference")
            }
            String lowerReadme = readmeText.toLowerCase(java.util.Locale.ROOT)
            ["external di", "spring", "guice", "cdi", "micronaut", "dagger", "generic exactly-once", "distributed acid"].each { String forbidden ->
                boolean negated = lowerReadme.contains("no ${forbidden}")
                        || lowerReadme.contains("not ${forbidden}")
                        || lowerReadme.contains("does not ${forbidden}")
                        || lowerReadme.contains("without ${forbidden}")
                        || lowerReadme.contains("does not create a generic distributed transaction")
                        || lowerReadme.contains("does not start a broker")
                        || lowerReadme.contains("no external")
                if (lowerReadme.contains(forbidden) && !negated) {
                    throw new GradleException("annotation-first README ${example} contains forbidden overclaim or dependency: ${forbidden}")
                }
            }
            fileTree(root).matching { include "**/*.java"; exclude "**/build/**" }.files.each { File source ->
                String lowerSource = source.getText("UTF-8").toLowerCase(java.util.Locale.ROOT)
                ["todo", "unsupportedoperationexception", "not implemented", "placeholder"].each { String marker ->
                    if (lowerSource.contains(marker)) {
                        throw new GradleException("annotation-first example ${example} contains source marker ${marker}: ${source}")
                    }
                }
            }
        }

        File formerObservabilityService = file("examples/annotation-first-observability/src/main/java/org/j7m/examples/annotation/observability/ObservabilityService.java")
        if (formerObservabilityService.exists()) {
            throw new GradleException("annotation-first observability must not return to one overloaded ObservabilityService.java")
        }
        [
                "examples/annotation-first-observability/src/main/java/org/j7m/examples/annotation/observability/workload/WorkloadAdmissionMetadata.java",
                "examples/annotation-first-observability/src/main/java/org/j7m/examples/annotation/observability/routing/RoutingOrderingMetadata.java",
                "examples/annotation-first-observability/src/main/java/org/j7m/examples/annotation/observability/recovery/RecoveryProgressCallbackMetadata.java",
                "examples/annotation-first-observability/src/main/java/org/j7m/examples/annotation/observability/benchmark/ObservabilityBenchmarkMetadata.java"
        ].each { String requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("annotation-first observability missing focused source unit: ${requiredPath}")
            }
        }

        String allAnnotationExampleText = annotationFirstStandaloneExamples.collect { String example ->
            return fileTree("examples/${example}").matching {
                include "**/*.java"
                include "**/*.md"
                include "**/*.txt"
            }.files.collect { File source -> source.getText("UTF-8") }.join("\n")
        }.join("\n").toLowerCase(java.util.Locale.ROOT)
        ["active runtime support", "switches runtime levels", "runtime-level switching is active"].each { String forbidden ->
            if (allAnnotationExampleText.contains(forbidden)) {
                throw new GradleException("@SwitchLevel or reserved lifecycle documentation contains active-support claim: ${forbidden}")
            }
        }
        [
                "metadata-only annotations enforce",
                "metadata-only annotation enforces",
                "annotation itself enforces",
                "annotation itself starts",
                "annotation itself emits",
                "annotation itself encrypts",
                "annotations automatically enforce"
        ].each { String forbidden ->
            if (allAnnotationExampleText.contains(forbidden)) {
                throw new GradleException("annotation examples contain metadata-only enforcement overclaim: ${forbidden}")
            }
        }

        String exampleSource = fileTree("examples").matching {
            include "annotation-first-*/src/main/java/**/*.java"
            include "templates/annotation-first-service/src/main/java/**/*.java"
        }.files.collect { File source -> source.getText("UTF-8") }.join("\n")
        // These references execute generated-index/container/codec integration in j7m-examples:test.
        Set<File> executableSources = fileTree("examples").matching {
            include "annotation-first-*/src/main/java/**/*.java"
            include "templates/annotation-first-service/src/main/java/**/*.java"
        }.files + fileTree("j7m-examples/src/main/java/org/j7m/middleware/examples/annotation").matching {
            include "ManagedAnnotationUsage.java", "ManagedUsageStyle.java", "ManagedUsageSettings.java", "ManagedUsagePayload.java"
        }.files
        String executableExampleSource = executableSources.collect { File source ->
            source.getText("UTF-8")
                    .replaceAll("(?s)/\\*.*?\\*/", "")
                    .replaceAll("(?m)//.*\$", "")
        }.join("\n")
        List<String> annotations
        URL[] apiClasses = project(":j7m-api").sourceSets.main.output.classesDirs.files.collect { it.toURI().toURL() } as URL[]
        new URLClassLoader(apiClasses, (ClassLoader) null).withCloseable { loader ->
            annotations = fileTree("j7m-api/src/main/java/org/j7m/middleware/annotations").matching {
                include "*.java"
            }.files.collect { it.name.replace(".java", "") }.findAll { name ->
                Class<?> type = Class.forName("org.j7m.middleware.annotations." + name, false, loader)
                type.isAnnotation() && java.lang.reflect.Modifier.isPublic(type.modifiers)
            }.sort()
        }
        annotations.each { String annotationName ->
            java.util.regex.Pattern pattern = java.util.regex.Pattern.compile("(^|[\\s(,])@" + java.util.regex.Pattern.quote(annotationName) + "\\b", java.util.regex.Pattern.MULTILINE)
            if (!pattern.matcher(executableExampleSource).find()) {
                throw new GradleException("annotation-first examples missing concrete usage for @${annotationName}")
            }
        }

        File coverage = file("documentation/docs/annotations/index.md")
        if (!coverage.isFile()) {
            throw new GradleException("missing public annotation reference")
        }
        String coverageText = coverage.getText("UTF-8")
        String familyText = fileTree("documentation/docs/annotations").matching {
            include "*.md"
            exclude "index.md"
        }.files.collect { it.getText("UTF-8") }.join("\n")
        annotations.each { String name ->
            if (!coverageText.contains("[@" + name + "](")) {
                throw new GradleException("public annotation index missing @${name}")
            }
            String heading = "## @" + name + " {#"
            int start = familyText.indexOf(heading)
            int end = start < 0 ? -1 : familyText.indexOf("\n## ", start + heading.length())
            String entry = start < 0 ? "" : familyText.substring(start, end < 0 ? familyText.length() : end)
            if (!entry.contains("```java") || !entry.contains("@" + name)) {
                throw new GradleException("public annotation reference lacks its own Java example for @${name}")
            }
        }

        String rootReadme = file("README.md").getText("UTF-8")
        [
                "@Health",
                "@Ready",
                "@Streaming",
                "@RetryPolicy",
                "@HighPerformance",
                "@Lease"
        ].each { String obsoleteAnnotation ->
            if (rootReadme.contains("`" + obsoleteAnnotation + "`")) {
                throw new GradleException("README annotation glossary contains obsolete annotation name: ${obsoleteAnnotation}")
            }
        }
        [
                "@HealthCheck",
                "@ReadinessCheck",
                "@Retry",
                "@Backpressure"
        ].each { String currentAnnotation ->
            if (!rootReadme.contains("`" + currentAnnotation + "`")) {
                throw new GradleException("README annotation glossary missing current annotation name: ${currentAnnotation}")
            }
        }
        [
                "@Checkpoint`: recovery metadata",
                "@Restore`: recovery metadata",
                "@Async`: descriptor metadata",
                "@HighAvailability`: descriptor metadata",
                "@Benchmark`: descriptor metadata"
        ].each { String requiredPhrase ->
            if (!rootReadme.contains(requiredPhrase)) {
                throw new GradleException("README annotation glossary missing metadata-only boundary phrase: ${requiredPhrase}")
            }
        }

        String compiledExampleSource = fileTree("j7m-examples/src/main/java/org/j7m/middleware/examples/annotation").matching {
            include "**/*.java"
        }.files.collect { File source -> source.getText("UTF-8") }.join("\n")
        ["AnnotationModelProcessor", "DefaultJ7mInjector", "AnnotationFirstExampleTest"].each { String token ->
            String combined = compiledExampleSource + "\n" + file("j7m-examples/src/test/java/org/j7m/middleware/examples/annotation/AnnotationFirstExampleTest.java").getText("UTF-8")
            if (!combined.contains(token)) {
                throw new GradleException("compiled annotation examples missing executable coverage token: ${token}")
            }
        }
        File demo = file("j7m-demo/src/main/java/org/j7m/middleware/demo/annotation/AnnotationModelDemo.java")
        ["source-inventory coverage", "runtime-supported examples", "build metadata examples",
         "metadata-only examples", "reserved annotations", "descriptor", "lifecycle",
         "redaction", "security metadata", "idempotency metadata"].each { String token ->
            if (!demo.getText("UTF-8").toLowerCase(java.util.Locale.ROOT).contains(token)) {
                throw new GradleException("runAnnotationModelDemo source missing output token: ${token}")
            }
        }
    }
}

tasks.register("validateExampleJavadocs") {
    group = "verification"
    description = "Validates professional Javadocs for annotation-first examples, templates, and demos."
    dependsOn "validateExampleSourceDocumentation"
    doLast {
        List<File> sourceFiles = []
        sourceFiles.addAll(fileTree("examples").matching {
            include "annotation-first-*/src/main/java/**/*.java"
            include "templates/annotation-first-service/src/main/java/**/*.java"
            exclude "**/module-info.java"
        }.files)
        sourceFiles.addAll(fileTree("j7m-examples/src/main/java/org/j7m/middleware/examples/annotation").matching {
            include "**/*.java"
        }.files)
        sourceFiles.add(file("j7m-demo/src/main/java/org/j7m/middleware/demo/annotation/AnnotationModelDemo.java"))
        sourceFiles = sourceFiles.findAll { File source -> source.isFile() }.sort { File left, File right -> left.path <=> right.path }
        if (sourceFiles.isEmpty()) {
            throw new GradleException("no annotation example Java sources found for Javadoc validation")
        }

        List<String> placeholderPatterns = [
                "Example class.",
                "Demo service.",
                "Gets the value.",
                "Sets the value.",
                "Handles request.",
                "Main method.",
                "TODO",
                "TBD",
                "Auto-generated",
                "tag-only",
                "placeholder"
        ]
        List<String> forbiddenClaims = [
                "generic exactly-once guarantee",
                "generic exactly-once delivery",
                "generic exactly-once execution is provided",
                "distributed ACID transaction",
                "distributed acid transaction",
                "certified adapter",
                "certified compatibility",
                "Phase 7"
        ]

        Closure<Boolean> hasJavadocBefore = { List<String> lines, int index ->
            int cursor = index - 1
            while (cursor >= 0) {
                String trimmed = lines[cursor].trim()
                if (trimmed.isEmpty() || trimmed.startsWith("@")) {
                    cursor--
                    continue
                }
                return trimmed.contains("*/")
            }
            return false
        }
        Closure<Boolean> hasOverrideBefore = { List<String> lines, int index ->
            int cursor = index - 1
            while (cursor >= 0) {
                String trimmed = lines[cursor].trim()
                if (trimmed.isEmpty()) {
                    cursor--
                    continue
                }
                if (trimmed.startsWith("@")) {
                    if (trimmed.equals("@Override")) {
                        return true
                    }
                    cursor--
                    continue
                }
                return false
            }
            return false
        }

        Closure<Void> requireTerms = { File source, String text, String reason, List<String> terms ->
            String lower = text.toLowerCase(java.util.Locale.ROOT)
            terms.each { String term ->
                if (!lower.contains(term.toLowerCase(java.util.Locale.ROOT))) {
                    throw new GradleException("${source} Javadocs missing ${reason}: ${term}")
                }
            }
        }

        Closure<Void> validateSourceText = { File source, String text ->
            placeholderPatterns.each { String pattern ->
                if (text.contains(pattern)) {
                    throw new GradleException("${source} contains placeholder Javadoc text: ${pattern}")
                }
            }
            if (java.util.regex.Pattern.compile("(?s)/\\*\\*\\s*\\n\\s*\\*\\s*@(param|return|throws)[^/]*\\*/\\s*\\n\\s*public")
                    .matcher(text)
                    .find()) {
                throw new GradleException("${source} contains tag-only Javadocs")
            }
            String lower = text.toLowerCase(java.util.Locale.ROOT)
            String normalizedLower = lower
                    .replaceAll("(?m)^\\s*\\*\\s?", " ")
                    .replaceAll("\\s+", " ")
            forbiddenClaims.each { String claim ->
                if (normalizedLower.contains(claim.toLowerCase(java.util.Locale.ROOT))) {
                    boolean negated = normalizedLower.contains("does not claim generic exactly-once")
                            || normalizedLower.contains("does not provide generic exactly-once")
                            || normalizedLower.contains("avoid distributed acid")
                            || normalizedLower.contains("deliberately avoids distributed acid")
                            || normalizedLower.contains("does not claim distributed acid")
                            || normalizedLower.contains("not a certification")
                            || normalizedLower.contains("no phase 7")
                    if (!negated) {
                        throw new GradleException("${source} contains forbidden positive claim: ${claim}")
                    }
                }
            }
            if (!text.contains("/**")) {
                throw new GradleException("${source} has no Javadocs")
            }
            List<String> lines = text.readLines()
            lines.eachWithIndex { String line, int index ->
                String trimmed = line.trim()
                boolean publicType = trimmed ==~ /public\s+(final\s+)?(class|record|interface)\s+.*/
                boolean publicMethod = trimmed ==~ /public\s+(static\s+)?(final\s+)?[\w<>\[\].]+\s+\w+\s*\(.*/
                boolean publicConstructor = trimmed ==~ /public\s+[A-Z][A-Za-z0-9_]*\s*\(.*/ || trimmed ==~ /public\s+[A-Z][A-Za-z0-9_]*\s*\{.*/
                if ((publicType || publicMethod || publicConstructor)
                        && !hasOverrideBefore(lines, index)
                        && !hasJavadocBefore(lines, index)) {
                    throw new GradleException("${source}:${index + 1} public declaration lacks meaningful Javadoc")
                }
            }

            String executable = text
                    .replaceAll("(?s)/\\*.*?\\*/", "")
                    .replaceAll("(?m)//.*\$", "")
            if (executable.contains("@Sensitive")) {
                requireTerms(source, text, "@Sensitive redaction explanation", ["Sensitive", "redact"])
            }
            if (executable.contains("@RequiresRole") || executable.contains("@RequiresPermission")) {
                requireTerms(source, text, "security annotation behavior", ["descriptor metadata", "authorization"])
                if (source.path.contains("secure")) {
                    requireTerms(source, text, "secure example authorized/denied behavior", ["denied"])
                }
            }
            if (executable.contains("@Idempotent")
                    || executable.contains("@Retry")
                    || executable.contains("@Deadline")
                    || executable.contains("@Backpressure")) {
                requireTerms(source, text, "invocation semantic descriptor-only status", ["descriptor metadata"])
            }
            if (executable.contains("@DurableQueueConsumer")
                    || executable.contains("@OutboxPublisher")
                    || executable.contains("@InboxHandler")) {
                requireTerms(source, text, "queue annotation limitations", ["descriptor metadata", "durable queue"])
            }
            if (executable.contains("@SagaDefinition")
                    || executable.contains("@SagaStep")
                    || executable.contains("@Compensation")
                    || executable.contains("@DeadLetterHandler")) {
                requireTerms(source, text, "saga annotation limitations", ["descriptor metadata"])
            }
            if (executable.contains("@IsolationProfile")) {
                requireTerms(source, text, "isolation annotation limitations", ["descriptor metadata", "container", "os sandbox"])
            }
            if (executable.contains("@Initialize")
                    || executable.contains("@Startup")
                    || executable.contains("@Drain")
                    || executable.contains("@Shutdown")
                    || executable.contains("@HealthCheck")
                    || executable.contains("@ReadinessCheck")) {
                requireTerms(source, text, "lifecycle ordering", ["lifecycle", "order"])
            }
            if (executable.contains("@Inject")
                    || executable.contains("@CurrentApplication")
                    || executable.contains("@CurrentInvocation")
                    || executable.contains("@CurrentPrincipal")
