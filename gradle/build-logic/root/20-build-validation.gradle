            return lower.contains("does not claim")
                    || lower.contains("does not provide")
                    || lower.contains("not provide")
                    || lower.contains("without claiming")
                    || lower.contains("deliberately avoids")
                    || lower.contains("not a certification")
                    || lower.contains("no phase 7")
                    || lower.contains("phase 7.0-7.4")
        }
        Closure<String> commentText = { String text ->
            return text.readLines().findAll { String line ->
                String trimmed = line.trim()
                return trimmed.startsWith("//") || trimmed.startsWith("*") || trimmed.startsWith("/*")
            }.join("\n")
        }
        Closure<String> methodBody = { String text, String signature ->
            int signatureIndex = text.indexOf(signature)
            if (signatureIndex < 0) {
                return ""
            }
            int openBrace = text.indexOf("{", signatureIndex)
            if (openBrace < 0) {
                return ""
            }
            int depth = 0
            for (int index = openBrace; index < text.length(); index++) {
                char character = text.charAt(index)
                if (character == "{" as char) {
                    depth++
                } else if (character == "}" as char) {
                    depth--
                    if (depth == 0) {
                        return text.substring(openBrace + 1, index)
                    }
                }
            }
            return text.substring(openBrace + 1)
        }
