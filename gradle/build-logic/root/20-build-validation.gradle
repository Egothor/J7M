annotationFirstBasicCopyPasteExamples.each { String example ->
    String suffix = annotationFirstTaskSuffix(example)
    Provider<Directory> copiedRoot = layout.buildDirectory.dir("tmp/annotation-first-copy-paste/${example}")
    TaskProvider<Copy> copyTask = tasks.register("copy${suffix}BasicAnnotationExample", Copy) { Copy task ->
        group = "verification"
        description = "Copies the documented ${example} project files into a fresh bounded copy/paste validation directory."
        dependsOn prepareAnnotationFirstBasicMavenRepository
        from("examples/${example}") {
            include "README.md"
            include "build.gradle"
            include "settings.gradle"
            include "EXPECTED_OUTPUT.txt"
            include "src/main/java/**"
            include "src/main/resources/**"
            include "src/test/java/**"
            include "src/test/resources/**"
        }
        from(annotationFirstBasicMavenRepository) {
            into "j7m-local-repository"
        }
        into(copiedRoot)
        doFirst {
            delete(copiedRoot)
        }
        doLast {
            File copiedSourceRoot = copiedRoot.get().dir("src/main/java").asFile
            List<File> copiedFiles = fileTree(copiedSourceRoot).matching {
                include "**/*.java"
            }.files.sort { File left, File right -> left.path <=> right.path }
            if (copiedFiles.size() < 2 || copiedFiles.size() > 4) {
                throw new GradleException("copy/paste validation for ${example} copied ${copiedFiles.size()} Java files; expected 2..4")
            }
            List<String> relativePaths = copiedFiles.collect { File copiedFile ->
                return copiedSourceRoot.toPath().relativize(copiedFile.toPath()).toString().replace(File.separatorChar, "/" as char)
            }
            if (!relativePaths.contains("module-info.java")) {
                throw new GradleException("copy/paste validation for ${example} did not copy module-info.java")
            }
            File copiedTestRoot = copiedRoot.get().dir("src/test/java").asFile
            List<File> copiedTestFiles = fileTree(copiedTestRoot).matching {
                include "**/*.java"
            }.files.sort { File left, File right -> left.path <=> right.path }
            if (copiedTestFiles.isEmpty()) {
                throw new GradleException("copy/paste validation for ${example} copied no test Java sources")
            }
            String expectedTestPath = annotationFirstBasicCopyPasteExpectedTestPaths.get(example)
            if (!copiedRoot.get().file(expectedTestPath).asFile.isFile()) {
                throw new GradleException("copy/paste validation for ${example} did not copy expected test source ${expectedTestPath}")
            }
            File sourceManifest = file("examples/${example}/META-INF/j7m-application.json")
            if (sourceManifest.isFile()) {
                throw new GradleException("BASIC annotation example ${example} must not declare META-INF/j7m-application.json unless this validator packages and validates it through the production application-platform path")
            }
            if (copiedRoot.get().file("META-INF/j7m-application.json").asFile.isFile()) {
                throw new GradleException("copy/paste validation for ${example} copied an unvalidated BASIC application manifest")
            }
            [
                    "README.md",
                    "build.gradle",
                    "settings.gradle",
                    "EXPECTED_OUTPUT.txt",
                    "src/main/java/module-info.java"
            ].each { String requiredPath ->
                if (!copiedRoot.get().file(requiredPath).asFile.isFile()) {
                    throw new GradleException("copy/paste validation for ${example} did not copy documented file ${requiredPath}")
                }
            }
            File copiedRepository = copiedRoot.get().dir("j7m-local-repository").asFile
            if (!copiedRepository.isDirectory()) {
                throw new GradleException("copy/paste validation for ${example} did not prepare j7m-local-repository")
            }
            long copiedProjectBytes = 0L
            fileTree(copiedRoot).matching {
                exclude "j7m-local-repository/**"
            }.files.each { File copiedFile ->
                copiedProjectBytes += copiedFile.length()
            }
            long maxCopiedProjectBytes = 131072L
            if (copiedProjectBytes > maxCopiedProjectBytes) {
                throw new GradleException("copy/paste validation for ${example} copied ${copiedProjectBytes} project bytes; limit is ${maxCopiedProjectBytes}")
            }
            String copiedBuild = copiedRoot.get().file("build.gradle").asFile.getText("UTF-8")
            [
                    "implementation \"org.j7m:j7m-api:${project.version}\"",
                    "implementation \"org.j7m:j7m-application-platform:${project.version}\"",
                    "j7m-local-repository",
                    "verifyExpectedOutput"
            ].each { String requiredBuildMarker ->
                if (!copiedBuild.contains(requiredBuildMarker)) {
                    throw new GradleException("copy/paste validation for ${example} build.gradle missing required marker: ${requiredBuildMarker}")
                }
            }
            [
                    "project(",
                    "sourceSets.main.output",
                    "rootProject"
            ].each { String forbiddenBuildMarker ->
                if (copiedBuild.contains(forbiddenBuildMarker)) {
                    throw new GradleException("copy/paste validation for ${example} build.gradle contains hidden root classpath or project dependency marker: ${forbiddenBuildMarker}")
                }
            }
            String copiedReadme = copiedRoot.get().file("README.md").asFile.getText("UTF-8")
            [
                    "gradle build --no-daemon",
                    "gradle verifyExpectedOutput --no-daemon",
                    "DefaultJ7mInjector",
                    "no `META-INF/j7m-application.json`"
            ].each { String requiredCommand ->
                if (!copiedReadme.contains(requiredCommand)) {
                    throw new GradleException("copy/paste validation for ${example} README missing copied-project proof marker: ${requiredCommand}")
                }
            }
            String copiedMainText = fileTree(copiedRoot.get().dir("src/main/java").asFile).matching {
                include "**/*.java"
            }.files.collect { File source ->
                source.getText("UTF-8")
                        .replaceAll("(?s)/\\*.*?\\*/", "")
                        .replaceAll("(?m)//.*\$", "")
            }.join("\n")
            if (!copiedMainText.contains("DefaultJ7mInjector")) {
                throw new GradleException("copy/paste validation for ${example} executable source does not use DefaultJ7mInjector")
            }
            if (example == "annotation-first-simple-service") {
                if (copiedMainText.contains("new SimpleGreetingService(")) {
                    throw new GradleException("simple BASIC smoke flow manually constructs SimpleGreetingService instead of using the public injector")
                }
                if (!copiedMainText.contains("invokeLifecycle(application, org.j7m.middleware.annotations.Startup.class)")) {
                    throw new GradleException("simple BASIC smoke flow does not invoke startup through the public injector")
                }
            }
            if (example == "annotation-first-lifecycle") {
                [
                        "component.initialize()",
                        "component.startup()",
                        "component.drain()",
                        "component.shutdown()"
                ].each { String manualLifecycleCall ->
                    if (copiedMainText.contains(manualLifecycleCall)) {
                        throw new GradleException("lifecycle BASIC smoke flow manually invokes lifecycle hook: ${manualLifecycleCall}")
                    }
                }
                [
                        "invokeLifecycle(component, Initialize.class)",
                        "invokeLifecycle(component, Startup.class)",
                        "invokeLifecycle(component, Drain.class)",
                        "invokeLifecycle(component, Shutdown.class)"
                ].each { String requiredLifecycleCall ->
                    if (!copiedMainText.contains(requiredLifecycleCall)) {
                        throw new GradleException("lifecycle BASIC smoke flow missing injector lifecycle invocation: ${requiredLifecycleCall}")
                    }
                }
            }
        }
    }
    TaskProvider<org.gradle.api.tasks.GradleBuild> projectTask = tasks.register("validate${suffix}BasicCopyPasteProject", org.gradle.api.tasks.GradleBuild) { org.gradle.api.tasks.GradleBuild task ->
        group = "verification"
        description = "Runs the documented build and EXPECTED_OUTPUT smoke commands in the fresh copied ${example} project."
        dependsOn copyTask
        dir = copiedRoot.get().asFile
        tasks = ["build", "verifyExpectedOutput"]
    }
    annotationFirstCopyPasteProjectTasks.add(projectTask)
}

