            ]
        }
        Closure<Map<String, Object>> artifactEvidenceRow = { String evidenceKind, String evidenceArtifact, String status, String guidanceCommand ->
            return [
                    evidenceKind: evidenceKind,
                    evidenceArtifact: evidenceArtifact,
                    evidenceDigest: artifactDigest(evidenceArtifact),
                    status: status,
                    operatorGuidanceCommand: guidanceCommand
            ]
        }
        validationCommandTasks.each { String command, List<String> taskPaths ->
            List<Map<String, Object>> rows = []
            taskPaths.each { String taskPath ->
                Map<String, Object> row = taskEvidenceRow(taskPath, command)
                rows.add(row)
                validationTaskEvidence.add(row)
            }
            if (command == "./gradlew :j7m-tests:phase5ApplicationPlatformTest --no-daemon --rerun-tasks") {
                rows.add(artifactEvidenceRow("TEST_XML_SUITE_ARTIFACT",
                        "j7m-tests/build/test-results/phase5ApplicationPlatformTest",
                        testEvidence.j7mTests,
                        command))
            }
            if (command == "./gradlew :j7m-gradle-plugin:test --no-daemon") {
                rows.add(artifactEvidenceRow("TEST_XML_SUITE_ARTIFACT",
                        "j7m-gradle-plugin/build/test-results/test",
                        testEvidence.gradlePluginTests,
                        command))
            }
            if (command == "./gradlew :j7m-deployer-cli:test --no-daemon") {
                rows.add(artifactEvidenceRow("TEST_XML_SUITE_ARTIFACT",
                        "j7m-deployer-cli/build/test-results/test",
                        testEvidence.deployerCliTests,
                        command))
            }
            if (command == "./gradlew validateJ7mArchitecture --no-daemon") {
                rows.add(artifactEvidenceRow("JSON_REPORT_ARTIFACT",
                        "build/reports/j7m/jpms-boundaries.json",
                        jsonArtifactEvidenceStatus("build/reports/j7m/jpms-boundaries.json"),
                        command))
            }
            if (command == "./gradlew validateApplicationPlatform --no-daemon") {
                rows.add(artifactEvidenceRow("TEST_XML_SUITE_ARTIFACT",
                        "j7m-tests/build/test-results/phase5ApplicationPlatformTest",
                        testEvidence.j7mTests,
                        command))
                rows.add(artifactEvidenceRow("TEST_XML_SUITE_ARTIFACT",
                        "j7m-gradle-plugin/build/test-results/test",
                        testEvidence.gradlePluginTests,
                        command))
                rows.add(artifactEvidenceRow("TEST_XML_SUITE_ARTIFACT",
                        "j7m-deployer-cli/build/test-results/test",
                        testEvidence.deployerCliTests,
                        command))
                rows.add(artifactEvidenceRow("JSON_REPORT_ARTIFACT",
                        "build/reports/j7m/jpms-boundaries.json",
                        jsonArtifactEvidenceStatus("build/reports/j7m/jpms-boundaries.json"),
                        command))
            }
            validationTaskEvidence.addAll(rows.findAll { Map<String, Object> row -> row.evidenceKind != "GRADLE_TASK_OUTCOME" })
            validationAggregateEvidence.add([
                    evidenceKind: "AGGREGATE_TASK_STATE",
                    status: requiredEvidenceStatus(rows.collect { Map<String, Object> row -> row.status as String }),
                    taskPaths: taskPaths,
                    operatorGuidanceCommand: command,
                    guidanceOnly: true
            ])
        }
        File jpmsReportFile = file("${buildDir}/reports/j7m/jpms-boundaries.json")
        Object jpmsReport = jpmsReportFile.isFile() ? new groovy.json.JsonSlurper().parse(jpmsReportFile) : [:]
        String jpmsEvidenceStatus = requiredEvidenceStatus([
                taskEvidenceStatus(":validateJ7mArchitecture"),
                jsonArtifactEvidenceStatus("${buildDir}/reports/j7m/jpms-boundaries.json")
        ])
        Map<String, String> requiredFieldEvidence = [
                dependencyBoundaries: requiredEvidenceStatus([
                        taskEvidenceStatus(":j7m-kernel:dependencies"),
                        taskEvidenceStatus(":j7m-runtime:dependencies")
                ]),
                phase1Regression: testEvidence.j7mTests,
                signatureVerification: testEvidence.j7mTests,
                strictUnsignedRejection: testEvidence.j7mTests,
                invalidSignatureRejection: testEvidence.j7mTests,
                sbomVerification: testEvidence.j7mTests,
                provenanceVerification: testEvidence.j7mTests,
                repositoryAuditChain: testEvidence.j7mTests,
                activationRequiresVerification: testEvidence.j7mTests,
                resourcePolicy: testEvidence.j7mTests,
                resourceUsage: testEvidence.j7mTests,
                objectRefNonBearer: testEvidence.j7mTests,
                redaction: testEvidence.j7mTests,
                activationPlanning: testEvidence.j7mTests,
                stopLifecycle: testEvidence.j7mTests,
                unloadLifecycle: testEvidence.j7mTests,
                unloadCleanupProof: testEvidence.j7mTests,
                failedActivationDiagnostics: testEvidence.j7mTests,
                upgradeStopStart: testEvidence.j7mTests,
                upgradeRolling: demoTaskResults["j7m-demo:runRollingUpgradeDemo"],
                upgradeBlueGreen: demoTaskResults["j7m-demo:runBlueGreenUpgradeDemo"],
                upgradeCanaryBaseline: demoTaskResults["j7m-demo:runCanaryBaselineUpgradeDemo"],
                rollback: demoTaskResults["j7m-demo:runApplicationUpgradeRollbackDemo"],
                adminStatusCompleteness: demoTaskResults["j7m-demo:runApplicationAdminStatusDemo"],
                lifecycleAuditEvidence: testEvidence.j7mTests,
                exampleBuildValidation: exampleValidationResults.exampleBuildValidation,
                examplePackageValidation: exampleValidationResults.examplePackageValidation,
                exampleVerifyValidation: exampleValidationResults.exampleVerifyValidation,
                requiredExamplesIncluded: exampleValidationResults.requiredExamplesIncluded,
                readmeCommandValidation: exampleValidationResults.readmeCommandValidation,
                gradlePlugin: exampleValidationResults.gradlePlugin,
                gradlePluginTasks: exampleValidationResults.gradlePluginTasks,
                gradlePluginClasspathApp: exampleValidationResults.gradlePluginClasspathApp,
                gradlePluginJpmsApp: exampleValidationResults.gradlePluginJpmsApp,
                gradlePluginStrictRegulatedApp: exampleValidationResults.gradlePluginStrictRegulatedApp,
                deployerCli: exampleValidationResults.deployerCli,
                deployerCliCommands: exampleValidationResults.deployerCliCommands,
                deployerCliExitCodes: exampleValidationResults.deployerCliExitCodes,
                deployerCliStrictVerification: exampleValidationResults.deployerCliStrictVerification,
                deployerCliLifecycleWorkflow: exampleValidationResults.deployerCliLifecycleWorkflow,
                deployerCliUpgradeRollback: exampleValidationResults.deployerCliUpgradeRollback
        ]
        boolean technicalRecommendationAcceptable = acceptanceSummary.PASS_WITH_LIMITATION == 0
                && acceptanceSummary.PARTIAL == 0
                && acceptanceSummary.DEFERRED == 0
                && acceptanceSummary.FAIL == 0
                && testCounts.skipped == 0
                && skippedTests.isEmpty()
                && validationAggregateEvidence.every { Map<String, Object> row -> row.status == "PASS" }
