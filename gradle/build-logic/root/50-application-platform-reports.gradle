                productionModulesWithoutDescriptor: jpmsReport.productionModulesWithoutDescriptor ?: 0,
                exportedInternalPackages: jpmsReport.exportedInternalPackages ?: 0,
                splitPackages: jpmsReport.splitPackages ?: 0,
                coreReadsConcreteTransport: jpmsReport.coreReadsConcreteTransport ?: false,
                runtimeReadsConcreteTransport: jpmsReport.runtimeReadsConcreteTransport ?: false,
                jpmsAppIsolation: jpmsReport.jpmsAppIsolation ?: jpmsEvidenceStatus,
                classpathFallback: jpmsReport.classpathFallback ?: jpmsEvidenceStatus,
                signatureVerification: requiredFieldEvidence.signatureVerification,
                strictUnsignedRejection: requiredFieldEvidence.strictUnsignedRejection,
                invalidSignatureRejection: requiredFieldEvidence.invalidSignatureRejection,
                sbomVerification: requiredFieldEvidence.sbomVerification,
                provenanceVerification: requiredFieldEvidence.provenanceVerification,
                repositoryAuditChain: requiredFieldEvidence.repositoryAuditChain,
                activationRequiresVerification: requiredFieldEvidence.activationRequiresVerification,
                resourcePolicy: requiredFieldEvidence.resourcePolicy,
                resourceUsage: requiredFieldEvidence.resourceUsage,
                objectRefNonBearer: requiredFieldEvidence.objectRefNonBearer,
                redaction: requiredFieldEvidence.redaction,
                activationPlanning: requiredFieldEvidence.activationPlanning,
                stopLifecycle: requiredFieldEvidence.stopLifecycle,
                unloadLifecycle: requiredFieldEvidence.unloadLifecycle,
                unloadCleanupProof: requiredFieldEvidence.unloadCleanupProof,
                failedActivationDiagnostics: requiredFieldEvidence.failedActivationDiagnostics,
                upgradeStopStart: requiredFieldEvidence.upgradeStopStart,
                upgradeRolling: requiredFieldEvidence.upgradeRolling,
                upgradeBlueGreen: requiredFieldEvidence.upgradeBlueGreen,
                upgradeCanaryBaseline: requiredFieldEvidence.upgradeCanaryBaseline,
                rollback: requiredFieldEvidence.rollback,
                adminStatusCompleteness: requiredFieldEvidence.adminStatusCompleteness,
                lifecycleAuditEvidence: requiredFieldEvidence.lifecycleAuditEvidence,
                exampleBuildValidation: requiredFieldEvidence.exampleBuildValidation,
                examplePackageValidation: requiredFieldEvidence.examplePackageValidation,
                exampleVerifyValidation: requiredFieldEvidence.exampleVerifyValidation,
                requiredExamplesIncluded: requiredFieldEvidence.requiredExamplesIncluded,
                readmeCommandValidation: requiredFieldEvidence.readmeCommandValidation,
                gradlePlugin: requiredFieldEvidence.gradlePlugin,
                gradlePluginTasks: requiredFieldEvidence.gradlePluginTasks,
                gradlePluginClasspathApp: requiredFieldEvidence.gradlePluginClasspathApp,
                gradlePluginJpmsApp: requiredFieldEvidence.gradlePluginJpmsApp,
                gradlePluginStrictRegulatedApp: requiredFieldEvidence.gradlePluginStrictRegulatedApp,
                deployerCli: requiredFieldEvidence.deployerCli,
                deployerCliCommands: requiredFieldEvidence.deployerCliCommands,
                deployerCliExitCodes: requiredFieldEvidence.deployerCliExitCodes,
                deployerCliStrictVerification: requiredFieldEvidence.deployerCliStrictVerification,
                deployerCliLifecycleWorkflow: requiredFieldEvidence.deployerCliLifecycleWorkflow,
                deployerCliUpgradeRollback: requiredFieldEvidence.deployerCliUpgradeRollback,
                knownLimitations: [
                        "JVM class unloading is not guaranteed by Java; J7M releases manager-held references deterministically",
                        "application admin/status is local-runtime scoped"
                ],
                deferredItems: rowsForStatus("DEFERRED"),
                java25RuntimeCaveat: "Required Test and JavaExec tasks set the Java 25 native-access flags documented in documentation/docs/getting-started/prerequisites.md.",
                pluginImplemented: true,
                cliImplemented: true,
                nonGoalConfirmation: "No durable messaging, consensus, exactly-once delivery, distributed transactions, database replication, crawler politeness, search indexing, full compute platform, full container sandboxing, external artifact replication, or production vendor integrations were started."
        ]
        String json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(evidence))
        Object parsed = new groovy.json.JsonSlurper().parseText(json)
        if (parsed.acceptanceMatrixStatusSummary != acceptanceSummary) {
            throw new GradleException("generated acceptance JSON does not round-trip status counts")
        }
        [
                "signatureVerification",
                "strictUnsignedRejection",
                "invalidSignatureRejection",
                "sbomVerification",
                "provenanceVerification",
                "repositoryAuditChain",
                "activationRequiresVerification",
                "resourcePolicy",
                "resourceUsage",
                "objectRefNonBearer",
                "redaction",
                "activationPlanning",
                "stopLifecycle",
                "unloadLifecycle",
                "unloadCleanupProof",
                "failedActivationDiagnostics",
                "upgradeStopStart",
                "upgradeRolling",
                "upgradeBlueGreen",
                "upgradeCanaryBaseline",
                "rollback",
                "adminStatusCompleteness",
                "lifecycleAuditEvidence",
                "exampleBuildValidation",
                "examplePackageValidation",
                "exampleVerifyValidation",
                "requiredExamplesIncluded",
                "readmeCommandValidation",
                "gradlePlugin",
                "gradlePluginTasks",
                "gradlePluginClasspathApp",
                "gradlePluginJpmsApp",
                "gradlePluginStrictRegulatedApp",
                "deployerCli",
                "deployerCliCommands",
                "deployerCliExitCodes",
                "deployerCliStrictVerification",
                "deployerCliLifecycleWorkflow",
                "deployerCliUpgradeRollback",
                "dependencyBoundaries",
                "phase1Regression"
        ].each { String field ->
            if (parsed[field] != "PASS") {
                throw new GradleException("required evidence field is not PASS: ${field}")
            }
        }
        if (parsed.technicalRecommendation != "ACCEPT") {
            throw new GradleException("technical recommendation is not ACCEPT")
        }
        if (parsed.validationAggregateEvidence.isEmpty()) {
            throw new GradleException("validation aggregate evidence is missing")
        }
        if (parsed.validationTaskEvidence.isEmpty()) {
            throw new GradleException("validation task evidence is missing")
        }
        parsed.validationAggregateEvidence.each { Object row ->
            if (row.evidenceKind != "AGGREGATE_TASK_STATE" || row.status != "PASS" || row.operatorGuidanceCommand == null || row.guidanceOnly != true) {
                throw new GradleException("invalid validation aggregate evidence row: ${row}")
            }
        }
        parsed.validationTaskEvidence.each { Object row ->
            if (row.status != "PASS") {
                throw new GradleException("validation evidence row is not PASS: ${row}")
            }
            if (row.evidenceKind == "GRADLE_TASK_OUTCOME") {
                if (row.taskPath == null || row.taskOutcome == null || row.taskOutcome == "MISSING" || row.currentRunMarker == null) {
                    throw new GradleException("Gradle task outcome evidence is incomplete: ${row}")
                }
            } else if (row.evidenceKind == "TEST_XML_SUITE_ARTIFACT" || row.evidenceKind == "JSON_REPORT_ARTIFACT") {
                if (row.evidenceArtifact == null || row.evidenceDigest == null || row.evidenceDigest == "missing") {
                    throw new GradleException("artifact validation evidence is incomplete: ${row}")
                }
            } else {
                throw new GradleException("unknown validation evidence kind: ${row.evidenceKind}")
            }
        }
        if (!parsed.exactCommandEvidence.isEmpty()) {
            throw new GradleException("Phase 5 report does not record exact command execution evidence")
        }
        if (dirtyWorkingTree == "true" && parsed.recommendation == "ACCEPT") {
            throw new GradleException("acceptance report claims ACCEPT while the working tree is dirty")
        }
        if (dirtyWorkingTree == "false" && parsed.recommendation != "ACCEPT") {
            throw new GradleException("clean acceptance report did not produce ACCEPT")
        }
        ["PASS_WITH_LIMITATION", "PARTIAL", "DEFERRED", "FAIL"].each { String status ->
            if ((parsed.acceptanceMatrixStatusSummary[status] ?: 0) != 0) {
                throw new GradleException("acceptance matrix contains disallowed ${status} rows: ${rowsForStatus(status)}")
            }
        }
        if (parsed.testCounts.skipped != 0 || !parsed.skippedTests.isEmpty()) {
            throw new GradleException("required validation suite contains skipped tests")
        }
        new File(reportDirectory, "application-platform-acceptance.json").setText(json + System.lineSeparator(), "UTF-8")
        StringBuilder markdown = new StringBuilder()
        markdown.append("# Application Platform Acceptance Evidence\n\n")
        markdown.append("- Timestamp: ").append(evidence.timestamp).append('\n')
        markdown.append("- Git commit: ").append(gitCommit).append('\n')
        markdown.append("- Git branch: ").append(gitBranch).append('\n')
        markdown.append("- Dirty working tree: ").append(dirtyWorkingTree).append('\n')
        markdown.append("- Java version: ").append(evidence.javaVersion).append(" (runtime ").append(evidence.javaRuntimeVersion).append(")\n")
        markdown.append("- Gradle version: ").append(evidence.gradleVersion).append('\n')
        markdown.append("- OS: ").append(evidence.osName).append(" / ").append(evidence.osArchitecture).append('\n')
        markdown.append("- Tests: ").append(testCounts).append('\n')
        markdown.append("- Skipped tests: ").append(skippedTests).append('\n')
        markdown.append("- UDP multicast capability: ").append(evidence.udpMulticastCapability).append('\n')
        markdown.append("- Acceptance status summary: ").append(acceptanceSummary).append('\n')
        markdown.append("- Recommendation: ").append(evidence.recommendation).append('\n')
        markdown.append("- Technical recommendation: ").append(evidence.technicalRecommendation).append('\n')
        markdown.append("- Clean working tree release seal: ").append(evidence.cleanWorkingTreeReleaseSeal).append('\n')
        markdown.append("- Operator guidance commands: guidance only; not exact command execution proof. ").append(operatorGuidanceCommands).append('\n')
        markdown.append("- Exact command evidence: ").append(evidence.exactCommandEvidence).append('\n')
        markdown.append("- Validation aggregate evidence kind: AGGREGATE_TASK_STATE\n")
        evidence.validationAggregateEvidence.each { Map<String, Object> row ->
            markdown.append("  - guidance: ").append(row.operatorGuidanceCommand)
                    .append("; status: ").append(row.status)
                    .append("; taskPaths: ").append(row.taskPaths)
                    .append("; guidanceOnly: ").append(row.guidanceOnly)
                    .append('\n')
        }
        markdown.append("- Validation task evidence:\n")
        evidence.validationTaskEvidence.each { Map<String, Object> row ->
            markdown.append("  - evidenceKind: ").append(row.evidenceKind)
                    .append("; status: ").append(row.status)
            if (row.taskPath != null) {
                markdown.append("; taskPath: ").append(row.taskPath)
                        .append("; taskOutcome: ").append(row.taskOutcome)
                        .append("; currentRunMarker: ").append(row.currentRunMarker)
            }
            if (row.evidenceArtifact != null) {
                markdown.append("; evidenceArtifact: ").append(row.evidenceArtifact)
                        .append("; evidenceDigest: ").append(row.evidenceDigest)
            }
            if (row.operatorGuidanceCommand != null) {
                markdown.append("; guidance: ").append(row.operatorGuidanceCommand)
            }
            markdown.append('\n')
        }
        markdown.append("- Security audit: ").append(evidence.securityAuditSummary).append('\n')
        markdown.append("- Operational audit: ").append(evidence.operationalAuditSummary).append('\n')
        markdown.append("- Example validation: ").append(evidence.exampleValidationResults).append('\n')
        markdown.append("- Demo validation: ").append(evidence.demoTaskResults).append('\n')
        markdown.append("- Dependency boundary summary: ").append(evidence.dependencyBoundarySummary).append('\n')
        markdown.append("- Dependency boundaries: ").append(evidence.dependencyBoundaries).append('\n')
        markdown.append("- Phase 1 regression: ").append(evidence.phase1Regression).append('\n')
        markdown.append("- JPMS boundary summary: ").append(evidence.jpmsBoundarySummary).append('\n')
        markdown.append("- JPMS descriptor coverage: ").append(evidence.jpmsDescriptorCoverage).append('\n')
        markdown.append("- Production modules without descriptor: ").append(evidence.productionModulesWithoutDescriptor).append('\n')
        markdown.append("- Exported internal packages: ").append(evidence.exportedInternalPackages).append('\n')
        markdown.append("- Split packages: ").append(evidence.splitPackages).append('\n')
        markdown.append("- Core reads concrete transport: ").append(evidence.coreReadsConcreteTransport).append('\n')
        markdown.append("- Runtime reads concrete transport: ").append(evidence.runtimeReadsConcreteTransport).append('\n')
        markdown.append("- JPMS app isolation: ").append(evidence.jpmsAppIsolation).append('\n')
        markdown.append("- Classpath fallback: ").append(evidence.classpathFallback).append('\n')
        markdown.append("- Signature verification: ").append(evidence.signatureVerification).append('\n')
        markdown.append("- Strict unsigned rejection: ").append(evidence.strictUnsignedRejection).append('\n')
        markdown.append("- Invalid signature rejection: ").append(evidence.invalidSignatureRejection).append('\n')
        markdown.append("- SBOM verification: ").append(evidence.sbomVerification).append('\n')
        markdown.append("- Provenance verification: ").append(evidence.provenanceVerification).append('\n')
        markdown.append("- Repository audit chain: ").append(evidence.repositoryAuditChain).append('\n')
        markdown.append("- Activation requires verification: ").append(evidence.activationRequiresVerification).append('\n')
        markdown.append("- Resource policy: ").append(evidence.resourcePolicy).append('\n')
        markdown.append("- Resource usage: ").append(evidence.resourceUsage).append('\n')
        markdown.append("- ObjectRef non-bearer: ").append(evidence.objectRefNonBearer).append('\n')
        markdown.append("- Redaction: ").append(evidence.redaction).append('\n')
        markdown.append("- Activation planning: ").append(evidence.activationPlanning).append('\n')
        markdown.append("- Stop lifecycle: ").append(evidence.stopLifecycle).append('\n')
        markdown.append("- Unload lifecycle: ").append(evidence.unloadLifecycle).append('\n')
        markdown.append("- Unload cleanup proof: ").append(evidence.unloadCleanupProof).append('\n')
        markdown.append("- Failed activation diagnostics: ").append(evidence.failedActivationDiagnostics).append('\n')
        markdown.append("- Upgrade stop-start: ").append(evidence.upgradeStopStart).append('\n')
        markdown.append("- Upgrade rolling: ").append(evidence.upgradeRolling).append('\n')
        markdown.append("- Upgrade blue-green: ").append(evidence.upgradeBlueGreen).append('\n')
        markdown.append("- Upgrade canary-baseline: ").append(evidence.upgradeCanaryBaseline).append('\n')
        markdown.append("- Rollback: ").append(evidence.rollback).append('\n')
        markdown.append("- Admin/status completeness: ").append(evidence.adminStatusCompleteness).append('\n')
        markdown.append("- Lifecycle audit/evidence: ").append(evidence.lifecycleAuditEvidence).append('\n')
        markdown.append("- Known limitations: ").append(evidence.knownLimitations).append('\n')
        markdown.append("- Deferred items: ").append(evidence.deferredItems).append('\n')
        markdown.append("- Java 25 runtime caveat: ").append(evidence.java25RuntimeCaveat).append('\n')
        markdown.append("- Gradle plugin implemented: ").append(evidence.pluginImplemented).append('\n')
        markdown.append("- Deployer CLI implemented: ").append(evidence.cliImplemented).append('\n')
        markdown.append("- Example build validation: ").append(evidence.exampleBuildValidation).append('\n')
        markdown.append("- Example package validation: ").append(evidence.examplePackageValidation).append('\n')
        markdown.append("- Example verify validation: ").append(evidence.exampleVerifyValidation).append('\n')
        markdown.append("- README command validation: ").append(evidence.readmeCommandValidation).append('\n')
        markdown.append("- Gradle plugin: ").append(evidence.gradlePlugin).append('\n')
        markdown.append("- Gradle plugin tasks: ").append(evidence.gradlePluginTasks).append('\n')
        markdown.append("- Gradle plugin classpath app: ").append(evidence.gradlePluginClasspathApp).append('\n')
        markdown.append("- Gradle plugin JPMS app: ").append(evidence.gradlePluginJpmsApp).append('\n')
        markdown.append("- Gradle plugin strict regulated app: ").append(evidence.gradlePluginStrictRegulatedApp).append('\n')
        markdown.append("- Deployer CLI: ").append(evidence.deployerCli).append('\n')
        markdown.append("- Deployer CLI commands: ").append(evidence.deployerCliCommands).append('\n')
        markdown.append("- Deployer CLI exit codes: ").append(evidence.deployerCliExitCodes).append('\n')
        markdown.append("- Deployer CLI strict verification: ").append(evidence.deployerCliStrictVerification).append('\n')
        markdown.append("- Deployer CLI lifecycle workflow: ").append(evidence.deployerCliLifecycleWorkflow).append('\n')
        markdown.append("- Deployer CLI upgrade/rollback: ").append(evidence.deployerCliUpgradeRollback).append('\n')
        markdown.append("- Non-goal confirmation: ").append(evidence.nonGoalConfirmation).append('\n')
        String markdownText = markdown.toString()
        acceptanceSummary.each { String status, Integer count ->
            if (!markdownText.contains("${status}:${count}") && !markdownText.contains("${status}=${count}")) {
                throw new GradleException("generated Markdown does not include status count ${status}=${count}")
            }
        }
        if (markdownText.contains("Validation command results")) {
            throw new GradleException("generated Markdown contains exact-command result wording")
        }
        evidence.validationAggregateEvidence.each { Map<String, Object> row ->
            if (!markdownText.contains(row.operatorGuidanceCommand as String)
                    || !markdownText.contains("AGGREGATE_TASK_STATE")
                    || !markdownText.contains("guidanceOnly: true")) {
                throw new GradleException("generated Markdown does not agree with validation aggregate evidence")
            }
        }
        evidence.validationTaskEvidence.each { Map<String, Object> row ->
            if (!markdownText.contains(row.evidenceKind as String) || !markdownText.contains(row.status as String)) {
                throw new GradleException("generated Markdown does not agree with validation task evidence")
            }
        }
        new File(reportDirectory, "application-platform-acceptance.md").setText(markdownText, "UTF-8")
        println "Generated ${project.relativePath(new File(reportDirectory, "application-platform-acceptance.json"))}"
        println "Generated ${project.relativePath(new File(reportDirectory, "application-platform-acceptance.md"))}"
    }
}

tasks.register("generateApplicationPlatformLimitationBurndownReport") {
    group = "verification"
