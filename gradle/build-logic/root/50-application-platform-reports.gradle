/*
 * Purpose: generates and validates Phase 5 application-platform acceptance and
 * limitation-burndown evidence used by examples and Phase 6 acceptance checks.
 * Owns: validateApplicationPlatformDocs, diagnoseUdpMulticastCapability,
 * generateApplicationPlatformAcceptanceReport, generateApplicationPlatformLimitationBurndownReport,
 * and validateApplicationPlatform.
 * Must not own: normal module dependency graphs, demo JavaExec implementations,
 * final Phase 6 acceptance matrix rendering, or example source code.
 * Root rationale: the reports aggregate evidence from several modules and demos
 * and are therefore orchestration artifacts rather than module-local build logic.
 * Related validation tasks: validateApplicationPlatform, validateSovereignReliability.
 */

tasks.register("validateApplicationPlatformDocs") {
    group = "verification"
    description = "Validates Phase 5.6 application-platform handoff documents."
    doLast {
        Map<String, List<String>> requiredDocs = [
                "documentation/docs/deployment/signed-applications.md": ["SignaturePolicy", "verification"],
                "documentation/docs/deployment/repositories.md": ["publish", "promote", "verifyAuditChain"],
                "documentation/docs/deployment/upgrade-rollback.md": ["stop-start", "rolling", "blue-green", "rollback"],
                "documentation/docs/deployment/gradle-workflow.md": ["j7mPackage", "j7mVerify", "unavailable"],
                "documentation/docs/programming/module-dependencies.md": ["JPMS", "module"],
                "documentation/docs/programming/contexts-identities.md": ["identity", "context"],
                "documentation/docs/programming/workloads.md": ["workload", "stream"],
                "documentation/docs/reference/cli.md": ["start", "--dry-run", "--json"],
                "documentation/docs/about/middleware-contributing.md": ["PMD", "test", "validatePublicApiDocs"]
        ]
        requiredDocs.each { String relative, List<String> tokens ->
            File document = file(relative)
            if (!document.isFile() || document.text.trim().isEmpty()) {
                throw new GradleException("missing or empty required document: ${relative}")
            }
            String text = document.getText("UTF-8").toLowerCase(java.util.Locale.ROOT)
            tokens.each { String token ->
                if (!text.contains(token.toLowerCase(java.util.Locale.ROOT))) {
                    throw new GradleException("application platform public documentation missing ${token}: ${relative}")
                }
            }
        }
    }
}

tasks.register("diagnoseUdpMulticastCapability") {
    group = "verification"
    description = "Reports whether the latest test run observed loopback UDP multicast support."
    dependsOn ":j7m-tests:phase2DiscoveryIntegrationTest"
    doLast {
        File resultDirectory = file("j7m-tests/build/test-results/phase2DiscoveryIntegrationTest")
        List<String> udpSkips = []
        fileTree(resultDirectory).matching { include "TEST-*.xml" }.files.each { File result ->
            String text = result.getText("UTF-8")
            java.util.regex.Matcher matcher = java.util.regex.Pattern
                    .compile("<testcase name=\"([^\"]+)\" classname=\"([^\"]+)\"[^>]*>\\s*<skipped message=\"([^\"]+)\"", java.util.regex.Pattern.DOTALL)
                    .matcher(text)
            while (matcher.find()) {
                if (matcher.group(3).contains("loopback multicast is not available on this host")) {
                    udpSkips.add("${matcher.group(2)}.${matcher.group(1)}")
                }
            }
        }
        if (udpSkips.isEmpty()) {
            println "UDP loopback multicast capability: available or no host-dependent UDP tests skipped in latest results"
        } else {
            println "UDP loopback multicast capability: unavailable on this host"
            udpSkips.each { String testName -> println "  skipped: ${testName}" }
        }
    }
}

