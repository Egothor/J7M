    dependsOn ":j7m-demo:runCanaryBaselineUpgradeDemo"
    dependsOn ":j7m-demo:runApplicationFailureDiagnosticsDemo"
    dependsOn ":j7m-demo:runApplicationAdminStatusDemo"
    dependsOn ":j7m-demo:runHelloRemoteServiceExample"
    dependsOn ":j7m-demo:runCallbacksAndEventsExample"
    dependsOn ":j7m-demo:runSecureBankingWorkflowExample"
    dependsOn ":j7m-demo:runHaHpClusterExample"
    dependsOn ":j7m-demo:runWorkloadProcessingExample"
    dependsOn ":j7m-demo:runStreamingPipelineExample"
    dependsOn ":j7m-demo:runRegulatedEnterpriseAppExample"
    dependsOn ":j7m-demo:runGradlePluginWorkflowDemo"
    dependsOn ":j7m-demo:runDeployerCliWorkflowDemo"
    dependsOn ":j7m-demo:runDeployerCliUpgradeRollbackDemo"
    dependsOn ":j7m-demo:runUdpMulticastDemo"
    dependsOn ":j7m-demo:runSecurityDemo"
    dependsOn ":j7m-demo:runMtlsSecurityDemo"
    dependsOn ":j7m-demo:runWorkloadDemo"
    dependsOn ":j7m-demo:runStreamingWorkloadDemo"
    dependsOn ":j7m-demo:runComplianceDemo"
    dependsOn ":j7m-demo:runEnterpriseReadinessDemo"
    dependsOn ":j7m-kernel:dependencies"
    dependsOn ":j7m-runtime:dependencies"
    dependsOn "validateJ7mArchitecture"
    dependsOn "validateApplicationPlatformDocs"
    doLast {
        File reportDirectory = file("${buildDir}/reports/j7m")
        reportDirectory.mkdirs()
        Map<String, Integer> testCounts = [tests: 0, failures: 0, errors: 0, skipped: 0, passed: 0]
        List<Map<String, Object>> skippedTests = []
        Closure<Integer> testSuiteAttribute = { String line, String attribute ->
            java.util.regex.Matcher matcher = java.util.regex.Pattern
                    .compile(attribute + "=\"(\\d+)\"")
                    .matcher(line)
            if (matcher.find()) {
                return Integer.parseInt(matcher.group(1))
            }
            return 0
        }
        [
                "j7m-tests/build/test-results/phase5ApplicationPlatformTest",
                "j7m-gradle-plugin/build/test-results/test",
                "j7m-deployer-cli/build/test-results/test"
        ].each { String testResultPath ->
            fileTree(testResultPath).matching { include "TEST-*.xml" }.files.each { File result ->
                String text = result.getText("UTF-8")
                java.util.regex.Matcher suite = java.util.regex.Pattern
                        .compile("<testsuite[^>]*>")
                        .matcher(text)
                if (suite.find()) {
                    String line = suite.group()
                    testCounts.tests += testSuiteAttribute(line, "tests")
                    testCounts.failures += testSuiteAttribute(line, "failures")
                    testCounts.errors += testSuiteAttribute(line, "errors")
                    testCounts.skipped += testSuiteAttribute(line, "skipped")
                }
                java.util.regex.Matcher skipped = java.util.regex.Pattern
                        .compile("<testcase name=\"([^\"]+)\" classname=\"([^\"]+)\"[^>]*>\\s*<skipped message=\"([^\"]+)\"", java.util.regex.Pattern.DOTALL)
                        .matcher(text)
                while (skipped.find()) {
                    throw new GradleException("required validation suite contains skipped test: ${skipped.group(2)}.${skipped.group(1)}: ${skipped.group(3)}")
                }
            }
        }
        testCounts.passed = testCounts.tests - testCounts.failures - testCounts.errors - testCounts.skipped

        // Current-run test results replace archived milestone receipt counts.
        Map<String, Integer> acceptanceSummary = [
                PASS: testCounts.passed, PASS_WITH_LIMITATION: 0, PARTIAL: 0, DEFERRED: 0,
                FAIL: testCounts.failures + testCounts.errors + testCounts.skipped, NOT_APPLICABLE: 0
        ]
        Closure<List<String>> rowsForStatus = { String status ->
            status == "FAIL" && acceptanceSummary.FAIL > 0
                    ? ["Current application-platform JUnit results contain failures/errors/skips"] : []
        }

        Closure<String> taskEvidenceStatus = { String taskPath ->
            def evidenceTask = tasks.findByPath(taskPath)
            if (evidenceTask == null) {
                return "MISSING"
            }
            def state = evidenceTask.state
            if (state.failure != null) {
                return "FAIL"
            }
            if (state.executed || state.didWork || state.upToDate) {
                return "PASS"
            }
            if (state.skipped) {
                return "SKIPPED"
            }
            return "MISSING"
        }
        Closure<String> taskEvidenceOutcome = { String taskPath ->
            def evidenceTask = tasks.findByPath(taskPath)
            if (evidenceTask == null) {
                return "MISSING"
            }
            def state = evidenceTask.state
            if (state.failure != null) {
                return "FAILED"
            }
            if (state.executed || state.didWork) {
                return "EXECUTED"
            }
            if (state.upToDate) {
                return "UP_TO_DATE"
            }
            if (state.skipped) {
                return "SKIPPED"
            }
            return "MISSING"
        }
        Closure<String> xmlSuiteEvidenceStatus = { String testResultPath ->
            List<File> results = fileTree(testResultPath).matching { include "TEST-*.xml" }.files
                    .sort { File left, File right -> left.name <=> right.name }
            if (results.isEmpty()) {
                return "MISSING"
            }
            boolean sawTest = false
            for (File result : results) {
                String text
                try {
                    text = result.getText("UTF-8")
                } catch (Exception ignored) {
                    return "ERROR"
                }
                java.util.regex.Matcher suite = java.util.regex.Pattern
                        .compile("<testsuite[^>]*>")
                        .matcher(text)
                if (!suite.find()) {
                    return "ERROR"
                }
                do {
                    String line = suite.group()
                    int tests = testSuiteAttribute(line, "tests")
                    int failures = testSuiteAttribute(line, "failures")
                    int errors = testSuiteAttribute(line, "errors")
                    int skipped = testSuiteAttribute(line, "skipped")
                    if (tests > 0) {
                        sawTest = true
                    }
                    if (failures > 0) {
                        return "FAIL"
                    }
                    if (errors > 0) {
                        return "ERROR"
                    }
                    if (skipped > 0) {
                        return "SKIPPED"
                    }
                } while (suite.find())
            }
            return sawTest ? "PASS" : "MISSING"
        }
        Closure<String> xmlTestMethodEvidenceStatus = { String testResultPath, String methodName ->
            String suiteStatus = xmlSuiteEvidenceStatus(testResultPath)
            if (suiteStatus != "PASS") {
                return suiteStatus
            }
            List<File> results = fileTree(testResultPath).matching { include "TEST-*.xml" }.files
                    .sort { File left, File right -> left.name <=> right.name }
            for (File result : results) {
                String text
                try {
                    text = result.getText("UTF-8")
                } catch (Exception ignored) {
                    return "ERROR"
                }
                if (text.contains("name=\"${methodName}\"") || text.contains("name=\"${methodName}()\"")) {
                    return "PASS"
                }
            }
            return "MISSING"
        }
        Closure<String> jsonArtifactEvidenceStatus = { String relativePath ->
            File evidenceFile = file(relativePath)
            if (!evidenceFile.isFile() || evidenceFile.length() == 0L) {
                return "MISSING"
            }
            try {
                new groovy.json.JsonSlurper().parse(evidenceFile)
                return "PASS"
            } catch (Exception ignored) {
                return "ERROR"
            }
        }
        Closure<String> artifactDigest = { String relativePath ->
            File evidenceFile = file(relativePath)
            if (!evidenceFile.exists()) {
                return "missing"
            }
            java.security.MessageDigest digest = java.security.MessageDigest.getInstance("SHA-256")
            if (evidenceFile.isFile()) {
                digest.update(evidenceFile.path.getBytes("UTF-8"))
                digest.update((byte) 0)
                digest.update(evidenceFile.bytes)
            } else if (evidenceFile.isDirectory()) {
                List<File> files = fileTree(evidenceFile).files
                        .findAll { File candidate -> candidate.isFile() }
                        .sort { File left, File right -> left.path <=> right.path }
                files.each { File candidate ->
                    digest.update(evidenceFile.toPath().relativize(candidate.toPath()).toString().getBytes("UTF-8"))
                    digest.update((byte) 0)
                    digest.update(candidate.bytes)
                    digest.update((byte) 0)
                }
            }
            return digest.digest().encodeHex().toString()
        }
        Closure<String> requiredEvidenceStatus = { Collection<String> statuses ->
            if (statuses.any { String status -> status == "ERROR" }) {
                return "ERROR"
            }
            if (statuses.any { String status -> status == "FAIL" }) {
                return "FAIL"
            }
            if (statuses.any { String status -> status == "SKIPPED" }) {
                return "SKIPPED"
            }
            if (statuses.any { String status -> status == "MISSING" }) {
                return "MISSING"
            }
            return "PASS"
        }

        String gitCommit = "unknown"
        try {
            Process process = ["git", "rev-parse", "HEAD"].execute(null, rootDir)
            process.waitFor()
            if (process.exitValue() == 0) {
                gitCommit = process.text.trim()
            }
        } catch (Exception ignored) {
            gitCommit = "unavailable"
        }
        String gitBranch = "unknown"
        String dirtyWorkingTree = "unknown"
        try {
            Process branchProcess = ["git", "rev-parse", "--abbrev-ref", "HEAD"].execute(null, rootDir)
            branchProcess.waitFor()
            if (branchProcess.exitValue() == 0) {
                gitBranch = branchProcess.text.trim()
            }
            Process statusProcess = ["git", "status", "--porcelain"].execute(null, rootDir)
            statusProcess.waitFor()
            if (statusProcess.exitValue() == 0) {
                dirtyWorkingTree = statusProcess.text.trim().isEmpty() ? "false" : "true"
            }
        } catch (Exception ignored) {
            gitBranch = "unavailable"
            dirtyWorkingTree = "unavailable"
        }

        Map<String, String> testEvidence = [
                j7mTests: requiredEvidenceStatus([taskEvidenceStatus(":j7m-tests:phase5ApplicationPlatformTest"),
                                                   xmlSuiteEvidenceStatus("j7m-tests/build/test-results/phase5ApplicationPlatformTest")]),
                gradlePluginTests: requiredEvidenceStatus([taskEvidenceStatus(":j7m-gradle-plugin:test"),
                                                           xmlSuiteEvidenceStatus("j7m-gradle-plugin/build/test-results/test")]),
                deployerCliTests: requiredEvidenceStatus([taskEvidenceStatus(":j7m-deployer-cli:test"),
                                                          xmlSuiteEvidenceStatus("j7m-deployer-cli/build/test-results/test")])
        ]
        Map<String, String> demoTaskResults = [
                "j7m-demo:run": taskEvidenceStatus(":j7m-demo:run"),
                "j7m-demo:runApplicationDeploymentDemo": taskEvidenceStatus(":j7m-demo:runApplicationDeploymentDemo"),
                "j7m-demo:runModularApplicationDeploymentDemo": taskEvidenceStatus(":j7m-demo:runModularApplicationDeploymentDemo"),
                "j7m-demo:runApplicationUpgradeRollbackDemo": taskEvidenceStatus(":j7m-demo:runApplicationUpgradeRollbackDemo"),
                "j7m-demo:runRollingUpgradeDemo": taskEvidenceStatus(":j7m-demo:runRollingUpgradeDemo"),
                "j7m-demo:runBlueGreenUpgradeDemo": taskEvidenceStatus(":j7m-demo:runBlueGreenUpgradeDemo"),
                "j7m-demo:runCanaryBaselineUpgradeDemo": taskEvidenceStatus(":j7m-demo:runCanaryBaselineUpgradeDemo"),
                "j7m-demo:runApplicationFailureDiagnosticsDemo": taskEvidenceStatus(":j7m-demo:runApplicationFailureDiagnosticsDemo"),
                "j7m-demo:runApplicationAdminStatusDemo": taskEvidenceStatus(":j7m-demo:runApplicationAdminStatusDemo"),
                "j7m-demo:runHelloRemoteServiceExample": taskEvidenceStatus(":j7m-demo:runHelloRemoteServiceExample"),
                "j7m-demo:runCallbacksAndEventsExample": taskEvidenceStatus(":j7m-demo:runCallbacksAndEventsExample"),
                "j7m-demo:runSecureBankingWorkflowExample": taskEvidenceStatus(":j7m-demo:runSecureBankingWorkflowExample"),
                "j7m-demo:runHaHpClusterExample": taskEvidenceStatus(":j7m-demo:runHaHpClusterExample"),
                "j7m-demo:runWorkloadProcessingExample": taskEvidenceStatus(":j7m-demo:runWorkloadProcessingExample"),
                "j7m-demo:runStreamingPipelineExample": taskEvidenceStatus(":j7m-demo:runStreamingPipelineExample"),
                "j7m-demo:runRegulatedEnterpriseAppExample": taskEvidenceStatus(":j7m-demo:runRegulatedEnterpriseAppExample"),
                "j7m-demo:runGradlePluginWorkflowDemo": taskEvidenceStatus(":j7m-demo:runGradlePluginWorkflowDemo"),
                "j7m-demo:runDeployerCliWorkflowDemo": taskEvidenceStatus(":j7m-demo:runDeployerCliWorkflowDemo"),
                "j7m-demo:runDeployerCliUpgradeRollbackDemo": taskEvidenceStatus(":j7m-demo:runDeployerCliUpgradeRollbackDemo"),
                "j7m-demo:runUdpMulticastDemo": taskEvidenceStatus(":j7m-demo:runUdpMulticastDemo"),
                "j7m-demo:runSecurityDemo": taskEvidenceStatus(":j7m-demo:runSecurityDemo"),
                "j7m-demo:runMtlsSecurityDemo": taskEvidenceStatus(":j7m-demo:runMtlsSecurityDemo"),
                "j7m-demo:runWorkloadDemo": taskEvidenceStatus(":j7m-demo:runWorkloadDemo"),
                "j7m-demo:runStreamingWorkloadDemo": taskEvidenceStatus(":j7m-demo:runStreamingWorkloadDemo"),
                "j7m-demo:runComplianceDemo": taskEvidenceStatus(":j7m-demo:runComplianceDemo"),
                "j7m-demo:runEnterpriseReadinessDemo": taskEvidenceStatus(":j7m-demo:runEnterpriseReadinessDemo")
        ]
        Map<String, String> exampleValidationResults = [
                buildExamples: taskEvidenceStatus(":buildExamples"),
                packageExamples: taskEvidenceStatus(":packageExamples"),
                verifyExamples: taskEvidenceStatus(":verifyExamples"),
                exampleBuildValidation: taskEvidenceStatus(":buildExamples"),
                examplePackageValidation: taskEvidenceStatus(":packageExamples"),
                exampleVerifyValidation: taskEvidenceStatus(":verifyExamples"),
                requiredExamplesIncluded: requiredEvidenceStatus([
                        demoTaskResults["j7m-demo:runWorkloadProcessingExample"],
                        demoTaskResults["j7m-demo:runStreamingPipelineExample"],
                        demoTaskResults["j7m-demo:runRegulatedEnterpriseAppExample"]
                ]),
                readmeCommandValidation: taskEvidenceStatus(":validateApplicationPlatformDocs"),
                gradlePlugin: testEvidence.gradlePluginTests,
                gradlePluginTasks: requiredEvidenceStatus([
                        taskEvidenceStatus(":j7mPackage"),
                        taskEvidenceStatus(":j7mSign"),
                        taskEvidenceStatus(":j7mVerify"),
                        taskEvidenceStatus(":j7mDeployLocal")
                ]),
                gradlePluginClasspathApp: taskEvidenceStatus(":j7mPackage"),
                gradlePluginJpmsApp: xmlTestMethodEvidenceStatus(
                        "j7m-gradle-plugin/build/test-results/test",
                        "pluginJpmsBundleActivatesThroughRealApplicationManager"),
                gradlePluginStrictRegulatedApp: taskEvidenceStatus(":j7mSign"),
                deployerCli: testEvidence.deployerCliTests,
                deployerCliCommands: testEvidence.deployerCliTests,
                deployerCliExitCodes: testEvidence.deployerCliTests,
                deployerCliStrictVerification: testEvidence.deployerCliTests,
                deployerCliLifecycleWorkflow: demoTaskResults["j7m-demo:runDeployerCliWorkflowDemo"],
                deployerCliUpgradeRollback: demoTaskResults["j7m-demo:runDeployerCliUpgradeRollbackDemo"],
                placeholders: [],
                requiredExamplesPlaceholder: 0,
                workloadProcessing: demoTaskResults["j7m-demo:runWorkloadProcessingExample"],
                streamingPipeline: demoTaskResults["j7m-demo:runStreamingPipelineExample"],
                regulatedEnterpriseApp: demoTaskResults["j7m-demo:runRegulatedEnterpriseAppExample"]
        ]
        Map<String, List<String>> validationCommandTasks = [
                "./gradlew build --no-daemon": [":build"],
                "./gradlew :j7m-tests:phase5ApplicationPlatformTest --no-daemon --rerun-tasks": [":j7m-tests:phase5ApplicationPlatformTest"],
