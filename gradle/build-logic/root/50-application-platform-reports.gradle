                && jpmsEvidenceStatus == "PASS"
        boolean cleanWorkingTree = dirtyWorkingTree == "false"
        String finalRecommendation = technicalRecommendationAcceptable
                ? (cleanWorkingTree ? "ACCEPT" : "ACCEPT_PENDING_OWNER_COMMIT")
                : "REJECT"
        Map<String, Object> evidence = [
                timestamp: "deterministic-phase-5-evidence-v1",
