                        ":j7m-gradle-plugin:test",
                        ":j7mPackage",
                        ":j7mSign",
                        ":j7mVerify",
                        ":j7mDeployLocal",
                        ":j7mPlanLocal",
                        ":j7mRunLocal",
                        ":j7mStatusLocal",
                        ":j7mStopLocal",
                        ":j7mUnloadLocal",
                        ":j7m-deployer-cli:test",
                        ":validateJ7mArchitecture",
                        ":validateApplicationPlatformDocs",
                        ":j7m-kernel:dependencies",
                        ":j7m-runtime:dependencies"
                ],
                "./gradlew :j7m-demo:run --no-daemon": [":j7m-demo:run"],
                "./gradlew :j7m-demo:runApplicationDeploymentDemo --no-daemon": [":j7m-demo:runApplicationDeploymentDemo"],
                "./gradlew :j7m-demo:runModularApplicationDeploymentDemo --no-daemon": [":j7m-demo:runModularApplicationDeploymentDemo"],
                "./gradlew :j7m-demo:runApplicationUpgradeRollbackDemo --no-daemon": [":j7m-demo:runApplicationUpgradeRollbackDemo"],
                "./gradlew :j7m-demo:runRollingUpgradeDemo --no-daemon": [":j7m-demo:runRollingUpgradeDemo"],
                "./gradlew :j7m-demo:runBlueGreenUpgradeDemo --no-daemon": [":j7m-demo:runBlueGreenUpgradeDemo"],
                "./gradlew :j7m-demo:runCanaryBaselineUpgradeDemo --no-daemon": [":j7m-demo:runCanaryBaselineUpgradeDemo"],
                "./gradlew :j7m-demo:runApplicationFailureDiagnosticsDemo --no-daemon": [":j7m-demo:runApplicationFailureDiagnosticsDemo"],
                "./gradlew :j7m-demo:runApplicationAdminStatusDemo --no-daemon": [":j7m-demo:runApplicationAdminStatusDemo"],
                "./gradlew :j7m-demo:runHelloRemoteServiceExample --no-daemon": [":j7m-demo:runHelloRemoteServiceExample"],
                "./gradlew :j7m-demo:runCallbacksAndEventsExample --no-daemon": [":j7m-demo:runCallbacksAndEventsExample"],
                "./gradlew :j7m-demo:runSecureBankingWorkflowExample --no-daemon": [":j7m-demo:runSecureBankingWorkflowExample"],
                "./gradlew :j7m-demo:runHaHpClusterExample --no-daemon": [":j7m-demo:runHaHpClusterExample"],
                "./gradlew :j7m-demo:runWorkloadProcessingExample --no-daemon": [":j7m-demo:runWorkloadProcessingExample"],
                "./gradlew :j7m-demo:runStreamingPipelineExample --no-daemon": [":j7m-demo:runStreamingPipelineExample"],
