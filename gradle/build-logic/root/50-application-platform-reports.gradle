                passWithLimitation: acceptanceSummary.PASS_WITH_LIMITATION,
                partial: acceptanceSummary.PARTIAL,
                deferred: acceptanceSummary.DEFERRED,
                fail: acceptanceSummary.FAIL,
                passWithLimitationRows: rowsForStatus("PASS_WITH_LIMITATION"),
                partialRows: rowsForStatus("PARTIAL"),
