 * Purpose: builds and validates final Phase 6 sovereign reliability acceptance evidence.
 * Owns: Phase 6 acceptance command lists, forbidden dependency/claim scans,
 * matrix generation helpers, generatePhase6AcceptanceReport, and validateSovereignReliability.
 * Must not own: production dependency declarations, demo task implementation bodies,
 * example source validation internals, or module-local configuration.
 * Root rationale: final acceptance is a repository-level audit artifact that aggregates
 * architecture, security, reliability, docs, demos, examples, and clean-tree evidence.
 * Related validation tasks: generatePhase6AcceptanceReport, validateSovereignReliability.
 */

