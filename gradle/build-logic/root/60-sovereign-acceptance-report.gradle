    details["all example validations pass"].validationEvidence = "Example validation task suite."
    details["architecture validation passes"].validationEvidence = "`validateJ7mArchitecture`."
    details["architecture validation passes"].status = "ACCEPT"
    details["architecture validation passes"].limitations = "Current Wave 5 same-run architecture task evidence."
    details["security audit passes"].validationEvidence = "Redaction/security validations across repository, saga, isolation, and adapter TCK."
    details["operations audit passes"].validationEvidence = "Status/metrics/recovery validations and demos."
    details["clean working tree release seal"].validationEvidence = "Current-run git status is written to the volatile build report and checked by `validateSovereignReliability`."
    details["clean working tree release seal"].status = "ACCEPT"
    details["clean working tree release seal"].limitations = "Current release seal evidence."
    if (dirtyTree) {
        details["clean working tree release seal"].status = "BLOCKED"
        details["clean working tree release seal"].limitations = "The working tree contains intentional uncommitted audit/report automation changes. Owner commit is required for final ACCEPT."
        details["clean working tree release seal"].blocksFinalAcceptance = "yes"
    }
    if (testCounts.skipped != 0 || testCounts.failures != 0 || testCounts.errors != 0) {
        details["all tests pass with 0 skips"].status = "REJECT"
        details["all tests pass with 0 skips"].limitations = "Current-run test totals are not clean: failures=${testCounts.failures}, errors=${testCounts.errors}, skipped=${testCounts.skipped}."
        details["all tests pass with 0 skips"].blocksFinalAcceptance = "yes"
    }
    return details.collect { String requirement, Map<String, String> value ->
        Map<String, String> row = new LinkedHashMap<>()
        row.requirement = requirement
        row.putAll(value)
        return row
    }
}

ext.phase6FinalVerdict = { List<Map<String, String>> matrix, Map<String, Integer> testCounts, boolean dirtyTree, List<String> blockers ->
    if (!blockers.isEmpty()) {
        return "BLOCKED"
    }
    if (testCounts.skipped != 0 || testCounts.failures != 0 || testCounts.errors != 0) {
        return "REJECT"
    }
    List<Map<String, String>> currentRows = matrix.findAll { Map<String, String> row -> row.status != "HISTORICAL_GUIDANCE" }
    List<Map<String, String>> nonAccept = currentRows.findAll { Map<String, String> row -> row.status != "ACCEPT" }
    if (nonAccept.isEmpty() && !dirtyTree) {
        return "ACCEPT"
    }
    if (dirtyTree && nonAccept.size() == 1 && nonAccept[0].requirement == "clean working tree release seal") {
        return "ACCEPT_PENDING_OWNER_COMMIT"
    }
    if (!nonAccept.isEmpty()) {
        return "REJECT"
    }
    return dirtyTree ? "ACCEPT_PENDING_OWNER_COMMIT" : "ACCEPT"
}

ext.phase6BuildAcceptanceEvidence = {
