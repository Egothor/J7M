tasks.register("validateSovereignReliability") {
    group = "verification"
    description = "Validates the final Phase 6 sovereign reliability acceptance matrix and report evidence."
    dependsOn "generatePhase6AcceptanceReport"
    dependsOn "validateBuildConventions"
    dependsOn "validateVersionCatalog"
    dependsOn "validateModuleTopology"
    dependsOn "validateInjectionModel"
    dependsOn "validateAnnotationModel"
    dependsOn "validateProfessionalJavadocs"
    dependsOn "validateExampleSourceDocumentation"
    doLast {
        File markdownReport = file("build/reports/j7m/phase-6-acceptance-contract.md")
        File buildMarkdownReport = file("${buildDir}/reports/j7m/phase-6-acceptance-report.md")
        File jsonReport = file("${buildDir}/reports/j7m/phase-6-acceptance-report.json")
	        [markdownReport, buildMarkdownReport, jsonReport].each { File required ->
	            if (!required.isFile() || required.length() == 0L) {
	                throw new GradleException("missing generated Phase 6 acceptance report: ${required}")
	            }
	        }
	        String markdown = markdownReport.getText("UTF-8")
	        String expectedStableMarkdown = rootProject.ext.phase6StableMarkdownReport()
	        if (markdown != expectedStableMarkdown) {
	            throw new GradleException("stable Phase 6 acceptance document is not idempotent/current; run generatePhase6AcceptanceReport")
	        }
	        List<String> volatileFindings = rootProject.ext.phase6StableReportHasVolatileContent(markdown)
	        if (!volatileFindings.isEmpty()) {
	            throw new GradleException("stable Phase 6 acceptance document contains volatile generated fields: ${volatileFindings}")
	        }
	        if (!markdown.contains("## Historical Acceptance Matrix")) {
	            throw new GradleException("Phase 6 acceptance report lacks the historical acceptance matrix")
	        }
	        String buildMarkdown = buildMarkdownReport.getText("UTF-8")
	        if (!buildMarkdown.contains("Generated:") || !buildMarkdown.contains("## Clean Working Tree Status")) {
	            throw new GradleException("volatile Phase 6 build markdown report lacks current-run generated evidence")
	        }
	        Object evidence = new groovy.json.JsonSlurper().parse(jsonReport)
        if (jsonReport.getText("UTF-8").contains("NOT_CAPTURED_BY_REPORT_GENERATOR")
                || buildMarkdown.contains("NOT_CAPTURED_BY_REPORT_GENERATOR")) {
            throw new GradleException("Phase 6 acceptance report contains placeholder NOT_CAPTURED_BY_REPORT_GENERATOR evidence")
        }
        if (evidence.sameRunWave5Evidence == null || evidence.sameRunWave5Evidence.technicalStatus != "TECHNICAL_PASS") {
            throw new GradleException("Phase 6 acceptance report lacks successful same-run Wave 5 evidence")
        }
        Set<String> presentRows = evidence.finalAcceptanceMatrix.collect { Object row -> row.requirement as String }.toSet()
        List<String> missingRows = rootProject.ext.phase6MatrixRequirements.findAll { String requirement -> !presentRows.contains(requirement) }
        if (!missingRows.isEmpty()) {
            throw new GradleException("Phase 6 acceptance matrix missing required rows: ${missingRows}")
        }
	        if (evidence.finalAcceptanceMatrix.size() != rootProject.ext.phase6MatrixRequirements.size()) {
	            throw new GradleException("Phase 6 acceptance matrix row count mismatch: expected ${rootProject.ext.phase6MatrixRequirements.size()}, found ${evidence.finalAcceptanceMatrix.size()}")
	        }
	        int acceptCount = evidence.finalAcceptanceMatrix.count { Object row -> row.status == "ACCEPT" }
	        int rejectCount = evidence.finalAcceptanceMatrix.count { Object row -> row.status == "REJECT" }
	        int blockedCount = evidence.finalAcceptanceMatrix.count { Object row -> row.status == "BLOCKED" }
	        if (evidence.acceptanceMatrixStatusCounts.ACCEPT != acceptCount
	                || (evidence.acceptanceMatrixStatusCounts.REJECT ?: 0) != rejectCount
	                || (evidence.acceptanceMatrixStatusCounts.BLOCKED ?: 0) != blockedCount) {
	            throw new GradleException("Phase 6 build report matrix status counts are internally inconsistent")
	        }
	        List<Object> unexpectedStatusRows = evidence.finalAcceptanceMatrix.findAll { Object row ->
	            row.status != "ACCEPT" && row.status != "HISTORICAL_GUIDANCE" && row.blocksFinalAcceptance != "yes"
	        }
	        if (!unexpectedStatusRows.isEmpty()) {
	            throw new GradleException("Phase 6 acceptance matrix contains unexpected non-blocking status rows: ${unexpectedStatusRows}")
	        }
	        List<Object> blockingRows = evidence.finalAcceptanceMatrix.findAll { Object row -> row.blocksFinalAcceptance == "yes" }
        boolean cleanTreeOnlyBlocker = blockingRows.size() == 1 && blockingRows[0].requirement == "clean working tree release seal" && evidence.finalVerdict == "ACCEPT_PENDING_OWNER_COMMIT"
        if (!blockingRows.isEmpty() && !cleanTreeOnlyBlocker) {
            throw new GradleException("Phase 6 acceptance matrix contains blocking rows: ${blockingRows}")
        }
        if (evidence.testCounts.skipped != 0 || !evidence.skippedTests.isEmpty()) {
            throw new GradleException("Phase 6 acceptance evidence contains skipped tests")
        }
        if (evidence.testCounts.failures != 0 || evidence.testCounts.errors != 0) {
            throw new GradleException("Phase 6 acceptance evidence contains failed or errored tests")
        }
        if (!evidence.blockers.isEmpty()) {
            throw new GradleException("Phase 6 acceptance evidence contains blockers: ${evidence.blockers}")
        }
        if (evidence.dependencyScan != "PASS" || evidence.forbiddenClaimScan != "PASS") {
            throw new GradleException("Phase 6 dependency or forbidden-claim scan failed")
        }
        if (markdown.contains("| ACCEPT_WITH_LIMITATIONS |") || evidence.finalVerdict == "ACCEPT_WITH_LIMITATIONS") {
            throw new GradleException("Phase 6 final report must not use ACCEPT_WITH_LIMITATIONS as a status")
        }
        boolean dirtyTree = rootProject.ext.phase6GitDirty()
        if (dirtyTree && evidence.finalVerdict == "ACCEPT") {
            throw new GradleException("Phase 6 final audit claims ACCEPT while the working tree is dirty")
        }
        if (!dirtyTree && evidence.finalVerdict == "ACCEPT_PENDING_OWNER_COMMIT") {
            throw new GradleException("Phase 6 final audit is pending owner commit despite a clean working tree")
        }
	        if (!(evidence.finalVerdict in ["ACCEPT", "ACCEPT_PENDING_OWNER_COMMIT"])) {
	            throw new GradleException("Phase 6 final verdict is not acceptable after hardening: ${evidence.finalVerdict}")
	        }
	        String recomputedVerdict = rootProject.ext.phase6FinalVerdict(
	                evidence.finalAcceptanceMatrix.collect { Object row -> [requirement: row.requirement as String, status: row.status as String] },
	                [tests: evidence.testCounts.tests as Integer, failures: evidence.testCounts.failures as Integer, errors: evidence.testCounts.errors as Integer, skipped: evidence.testCounts.skipped as Integer, passed: evidence.testCounts.passed as Integer],
	                evidence.dirtyWorkingTree as boolean,
	                evidence.blockers.collect { Object blocker -> blocker as String })
	        if (recomputedVerdict != evidence.finalVerdict) {
	            throw new GradleException("Phase 6 build report final verdict is internally inconsistent: expected ${recomputedVerdict}, found ${evidence.finalVerdict}")
	        }
        List<String> syntheticMissing = rootProject.ext.phase6MatrixRequirements.drop(1)
        if (syntheticMissing.contains(rootProject.ext.phase6MatrixRequirements[0])) {
            throw new GradleException("internal matrix-row self-test failed")
        }
        Map<String, Integer> syntheticCounts = [tests: 1, failures: 0, errors: 0, skipped: 0, passed: 1]
        List<Map<String, String>> syntheticDirtyMatrix = rootProject.ext.phase6AcceptanceRows(true, syntheticCounts)
        String syntheticDirtyVerdict = rootProject.ext.phase6FinalVerdict(syntheticDirtyMatrix, syntheticCounts, true, [])
        if (syntheticDirtyVerdict != "ACCEPT_PENDING_OWNER_COMMIT") {
            throw new GradleException("dirty-tree verdict self-test failed: ${syntheticDirtyVerdict}")
        }
        List<Map<String, String>> syntheticCleanMatrix = rootProject.ext.phase6AcceptanceRows(false, syntheticCounts)
        String syntheticCleanVerdict = rootProject.ext.phase6FinalVerdict(syntheticCleanMatrix, syntheticCounts, false, [])
        if (syntheticCleanVerdict != "ACCEPT") {
            throw new GradleException("clean-tree verdict self-test failed: ${syntheticCleanVerdict}")
        }
        String unsafeClaim = "J7M provides generic exactly-once distributed execution."
        if (rootProject.ext.phase6SafeClaimLine(unsafeClaim)) {
            throw new GradleException("forbidden-claim self-test incorrectly marked a positive claim safe")
        }
        String safeClaim = "J7M does not provide generic exactly-once distributed execution."
	        if (!rootProject.ext.phase6SafeClaimLine(safeClaim)) {
	            throw new GradleException("forbidden-claim self-test incorrectly rejected safe non-goal wording")
	        }
	        String stableSelfTest = rootProject.ext.phase6StableMarkdownReport()
	        if (!rootProject.ext.phase6StableReportHasVolatileContent(stableSelfTest).isEmpty()) {
	            throw new GradleException("stable-report self-test found volatile generated content")
	        }
	        String volatileSelfTest = rootProject.ext.phase6MarkdownReport(rootProject.ext.phase6BuildAcceptanceEvidence())
	        if (!volatileSelfTest.contains("Generated:") || !volatileSelfTest.contains("## Clean Working Tree Status")) {
	            throw new GradleException("volatile-report self-test failed to include current-run evidence")
	        }
	    }
	}
