            "./gradlew validateSovereignReliability --no-daemon",
            "git status --short --untracked-files=all",
            "git diff --stat",
            "git ls-files --others --exclude-standard"
    ].each { String command -> markdown.append("- `").append(command).append("`\n") }
    markdown.append("\n## Historical Phase-By-Phase Guidance\n\n")
    [
            "Phase 6.0 Enterprise Module Consolidation: historical guidance.",
            "Phase 6.1 Reliability Semantics Kernel: historical guidance.",
            "Phase 6.2 Durable Log: historical guidance.",
            "Phase 6.3 Durable Queue and Outbox/Inbox: historical guidance.",
            "Phase 6.4 Coordination and Membership: Wave 5 same-run evidence plus historical guidance.",
            "Phase 6.5 Consensus: Wave 5 same-run evidence plus historical guidance.",
            "Phase 6.6 Repository and Artifact Replication: Wave 5 same-run evidence plus historical guidance.",
            "Phase 6.7 Saga and Transaction Context: Wave 5 same-run evidence plus historical guidance.",
            "Phase 6.8 Isolation Provider: Wave 5 same-run evidence plus historical guidance.",
            "Phase 6.9 Adapter SPI and TCK: Wave 5 same-run evidence plus historical guidance.",
            "Phase 6.10 Sovereign Reliability Acceptance Audit Automation: implemented; current-run verdict is generated in build reports."
    ].each { String line -> markdown.append("- ").append(line).append('\n') }
    markdown.append("\n## Historical Acceptance Matrix\n\n")
    markdown.append("Rows marked `HISTORICAL_GUIDANCE` are not current same-run ACCEPT evidence. Current same-run outcomes are generated under `build/reports/j7m/`.\n\n")
    markdown.append("| # | Requirement | Implementation Evidence | Test/Validation Evidence | Demo/Evidence Report | Documentation Link | Status | Limitations | Blocks Phase 6 Final Acceptance |\n")
    markdown.append("|---:|---|---|---|---|---|---|---|---|\n")
    int rowNumber = 0
    stableMatrix.each { Map<String, String> row ->
        rowNumber++
        markdown.append("| ").append(rowNumber)
                .append(" | ").append(row.requirement)
                .append(" | ").append(row.implementationEvidence.replace("|", "\\|"))
                .append(" | ").append(row.validationEvidence.replace("|", "\\|"))
                .append(" | ").append(row.demoEvidence.replace("|", "\\|"))
                .append(" | ").append(row.documentationLink.replace("|", "\\|"))
                .append(" | ").append(row.status)
                .append(" | ").append(row.limitations.replace("|", "\\|"))
                .append(" | ").append(row.blocksFinalAcceptance)
                .append(" |\n")
    }
    markdown.append("\n## Non-Negotiable Rules\n\n")
    markdown.append("| Rule | Status | Evidence | Validation Source | Blocker |\n")
    markdown.append("|---|---|---|---|---|\n")
    stableRules.each { Map<String, String> row ->
        markdown.append("| ").append(row.rule.replace("|", "\\|"))
                .append(" | ").append(row.status)
                .append(" | ").append(row.evidence.replace("|", "\\|"))
                .append(" | ").append(row.validationSource.replace("|", "\\|"))
                .append(" | ").append(row.blocker)
                .append(" |\n")
    }
    markdown.append("\n## Validation Task List\n\n")
    rootProject.ext.phase6ValidationCommands.each { String command -> markdown.append("- `").append(command).append("`\n") }
    markdown.append("\n## Stable Limitations\n\n")
    markdown.append("- This file is not current-run evidence and does not by itself issue a release seal.\n")
    markdown.append("- Final `ACCEPT` still requires the generated build report and final git status checks from the current audit run.\n\n")
    markdown.append("## Confirmations\n\n")
    markdown.append("- No product feature implementation is part of the audit automation.\n")
    markdown.append("- No Phase 7 work is started by the audit automation.\n")
    markdown.append("- No production vendor adapter is accepted by Phase 6.\n")
    markdown.append("- No external platform dependency or vendor SDK dependency is accepted by Phase 6.\n")
    markdown.append("- No vendor-specific API shaping is accepted.\n")
    markdown.append("- No generic exactly-once claim is accepted.\n")
    markdown.append("- No generic distributed ACID claim is accepted.\n")
    markdown.append("- No certification claim is accepted.\n")
    markdown.append("- No commits are created by the automation.\n")
    return markdown.toString()
}

ext.phase6WriteIfChanged = { File target, String content ->
    if (target.isFile() && target.getText("UTF-8") == content) {
        return false
    }
    target.parentFile.mkdirs()
    target.setText(content, "UTF-8")
    return true
}

ext.wave5Phase6TaskOutcome = { String taskPath ->
    Task task = gradle.taskGraph.allTasks.find { Task candidate -> candidate.path == taskPath }
    if (task == null) {
        return [task: taskPath, outcome: "MISSING", detail: "task was not present in the same Gradle task graph"]
    }
    if (task.state.failure != null) {
        return [task: taskPath, outcome: "FAILED", detail: task.state.failure.message ?: "task failed"]
    }
    if (task.state.upToDate) {
        return [task: taskPath, outcome: "CURRENT_UP_TO_DATE", detail: "task outputs were current in the same evidence task graph"]
    }
    if (task.state.skipped) {
        return [task: taskPath, outcome: "SKIPPED", detail: task.state.skipMessage ?: "task skipped"]
    }
    if (!task.state.didWork) {
        return [task: taskPath, outcome: "NO_WORK", detail: "task produced no same-run work"]
    }
    return [task: taskPath, outcome: "SUCCESS", detail: "task executed in the same evidence run"]
}

ext.wave5Phase6LifecycleAggregateRequirementPaths = { String taskPath ->
    switch (taskPath) {
        case ":validateCoordination":
            return [":validateJ7mArchitecture", ":j7m-coordination:test"]
        case ":validateConsensus":
            return [":validateJ7mArchitecture", ":j7m-consensus:test", ":j7m-coordination:test"]
        case ":validateRepositoryReplication":
            return [":validateJ7mArchitecture", ":j7m-application-platform:test", ":j7m-consensus:test"]
        case ":validateSaga":
            return [":validateJ7mArchitecture", ":j7m-saga:test"]
        default:
            return []
    }
}

ext.wave5Phase6TaskEvidenceSuccessful = { Map<String, Object> taskOutcomes, String taskPath ->
    Map<String, Object> outcome = taskOutcomes[taskPath] as Map<String, Object>
    if (outcome == null) {
        return false
    }
    if (outcome.outcome == "SUCCESS") {
        return true
    }
    if (outcome.outcome == "CURRENT_UP_TO_DATE") {
        return true
    }
    if (outcome.outcome != "NO_WORK") {
        return false
    }
    List<String> requiredTasks = rootProject.ext.wave5Phase6LifecycleAggregateRequirementPaths(taskPath) as List<String>
    if (requiredTasks.isEmpty()) {
        return false
    }
    return requiredTasks.every { String requiredTaskPath ->
        rootProject.ext.wave5Phase6TaskEvidenceSuccessful(taskOutcomes, requiredTaskPath)
    }
}

ext.wave5Phase6JoinTaskPaths = { List<String> taskPaths ->
    StringBuilder builder = new StringBuilder()
    for (int index = 0; index < taskPaths.size(); index++) {
        if (index > 0) {
            builder.append(", ")
        }
        builder.append(taskPaths.get(index))
    }
    return builder.toString()
}

ext.wave5Phase6CollectJUnitEvidence = { List<String> blockers, Map<String, Object> taskOutcomes ->
    Map<String, Object> totals = [tests: 0, failures: 0, errors: 0, skipped: 0, passed: 0]
    Map<String, Object> byTask = new LinkedHashMap<>()
    rootProject.ext.wave5Phase6TestResultDirectories.each { String taskPath, String directoryPath ->
        File resultDirectory = file(directoryPath)
        List<File> resultFiles = resultDirectory.isDirectory()
                ? fileTree(resultDirectory).matching { include "TEST-*.xml" }.files.sort()
                : []
        if (resultFiles.isEmpty()) {
            blockers.add("missing JUnit XML for ${taskPath}: ${directoryPath}")
            byTask[taskPath] = [tests: 0, failures: 0, errors: 0, skipped: 0, passed: 0, files: []]
            return
        }
        Map<String, Object> taskCounts = [tests: 0, failures: 0, errors: 0, skipped: 0, passed: 0, files: []]
        Map<String, Object> taskOutcome = taskOutcomes[taskPath] as Map<String, Object>
        boolean currentUpToDate = taskOutcome != null && taskOutcome.outcome == "CURRENT_UP_TO_DATE"
        resultFiles.each { File resultFile ->
            if (!currentUpToDate && resultFile.lastModified() + 1000L < rootProject.ext.wave5Phase6RunStartedAtMillis) {
                blockers.add("stale JUnit XML for ${taskPath}: ${resultFile}")
            }
            try {
                Object suite = new groovy.xml.XmlSlurper(false, false).parse(resultFile)
                int tests = (suite.@tests as String) as int
                int failures = (suite.@failures as String) as int
                int errors = (suite.@errors as String) as int
                int skipped = (suite.@skipped as String) as int
                taskCounts.tests = (taskCounts.tests as int) + tests
                taskCounts.failures = (taskCounts.failures as int) + failures
                taskCounts.errors = (taskCounts.errors as int) + errors
                taskCounts.skipped = (taskCounts.skipped as int) + skipped
                taskCounts.files.add(resultFile.path)
            } catch (Exception exception) {
                blockers.add("malformed JUnit XML for ${taskPath}: ${resultFile}: ${exception.message}")
            }
        }
        taskCounts.passed = (taskCounts.tests as int) - (taskCounts.failures as int) - (taskCounts.errors as int) - (taskCounts.skipped as int)
        if ((taskCounts.failures as int) != 0 || (taskCounts.errors as int) != 0 || (taskCounts.skipped as int) != 0) {
            blockers.add("JUnit evidence is not clean for ${taskPath}: ${taskCounts}")
        }
        totals.tests = (totals.tests as int) + (taskCounts.tests as int)
        totals.failures = (totals.failures as int) + (taskCounts.failures as int)
        totals.errors = (totals.errors as int) + (taskCounts.errors as int)
        totals.skipped = (totals.skipped as int) + (taskCounts.skipped as int)
        byTask[taskPath] = taskCounts
    }
    totals.passed = (totals.tests as int) - (totals.failures as int) - (totals.errors as int) - (totals.skipped as int)
    return [totals: totals, byTask: byTask]
}

ext.wave5Phase6BuildEvidence = {
    List<String> blockers = []
    Map<String, Object> taskOutcomes = new LinkedHashMap<>()
    rootProject.ext.wave5Phase6RequiredTaskPaths.each { String taskPath ->
        Map<String, Object> outcome = rootProject.ext.wave5Phase6TaskOutcome(taskPath)
        taskOutcomes[taskPath] = outcome
    }
    taskOutcomes.each { String taskPath, Map<String, Object> outcome ->
        boolean successful = rootProject.ext.wave5Phase6TaskEvidenceSuccessful(taskOutcomes, taskPath)
        outcome.evidenceSuccessful = successful
        if (outcome.outcome == "NO_WORK" && successful) {
            List<String> acceptedNoWorkDependencies = rootProject.ext.wave5Phase6LifecycleAggregateRequirementPaths(taskPath) as List<String>
            outcome.acceptedNoWorkDependencies = acceptedNoWorkDependencies
            outcome.detail = "lifecycle aggregate produced no task action; required same-run dependency evidence succeeded: " + rootProject.ext.wave5Phase6JoinTaskPaths(acceptedNoWorkDependencies)
        }
        if (!successful) {
            blockers.add("task evidence is not successful for ${taskPath}: ${outcome.outcome}")
        }
    }
    Map<String, Object> junitEvidence = rootProject.ext.wave5Phase6CollectJUnitEvidence(blockers, taskOutcomes)
    Map<String, String> categoryStatus = new LinkedHashMap<>()
    rootProject.ext.wave5Phase6TaskCategories.each { String category, List<String> taskPaths ->
        boolean categoryPassed = taskPaths.every { String taskPath ->
            taskOutcomes.containsKey(taskPath) && rootProject.ext.wave5Phase6TaskEvidenceSuccessful(taskOutcomes, taskPath)
        }
        categoryStatus[category] = categoryPassed ? "PASS" : "BLOCKED"
    }
    List<String> staleOrMissing = blockers.findAll { String blocker ->
        String lower = blocker.toLowerCase(java.util.Locale.ROOT)
        lower.contains("missing") || lower.contains("stale") || lower.contains("malformed")
    }
    boolean dirtyTree = rootProject.ext.phase6GitDirty()
    String technicalStatus = blockers.isEmpty() ? "TECHNICAL_PASS" : "BLOCKED"
    String releaseVerdict = technicalStatus == "TECHNICAL_PASS"
            ? (dirtyTree ? "ACCEPT_PENDING_OWNER_COMMIT" : "ACCEPT")
            : "BLOCKED"
    return [
            evidenceSchema: "j7m-wave5-phase6-evidence-v1",
            generatedAt: java.time.Instant.now().toString(),
            runStartedAtMillis: rootProject.ext.wave5Phase6RunStartedAtMillis,
            scope: "Wave 5 checkpoint 4, Phase 6.4-6.9 targeted evidence",
            gitCommit: rootProject.ext.phase6RunGit(["git", "rev-parse", "HEAD"]),
            technicalStatus: technicalStatus,
            releaseVerdict: releaseVerdict,
            dirtyWorkingTree: dirtyTree,
            taskOutcomes: taskOutcomes,
            categories: categoryStatus,
            junit: junitEvidence,
            staleMissingOrMalformedEvidence: staleOrMissing,
            blockers: blockers,
            reportJson: rootProject.ext.wave5Phase6EvidenceJsonPath,
            reportMarkdown: rootProject.ext.wave5Phase6EvidenceMarkdownPath
    ]
}

ext.wave5Phase6MarkdownReport = { Map<String, Object> evidence ->
    StringBuilder markdown = new StringBuilder()
    markdown.append("# Wave 5 Phase 6.4-6.9 Evidence\n\n")
    markdown.append("- Technical status: `").append(evidence.technicalStatus).append("`\n")
    markdown.append("- Release verdict: `").append(evidence.releaseVerdict).append("`\n")
    markdown.append("- Dirty working tree: `").append(evidence.dirtyWorkingTree).append("`\n")
    markdown.append("- Scope: ").append(evidence.scope).append("\n")
    markdown.append("- JSON evidence: `").append(evidence.reportJson).append("`\n\n")
    markdown.append("## Categories\n\n")
    evidence.categories.each { String category, String status ->
        markdown.append("- `").append(category).append("`: `").append(status).append("`\n")
    }
    markdown.append("\n## JUnit Evidence\n\n")
    markdown.append("- Totals: `").append(evidence.junit.totals.tests).append(" tests, ")
            .append(evidence.junit.totals.failures).append(" failures, ")
            .append(evidence.junit.totals.errors).append(" errors, ")
            .append(evidence.junit.totals.skipped).append(" skipped`\n")
    evidence.junit.byTask.each { String taskPath, Object counts ->
        markdown.append("- `").append(taskPath).append("`: `").append(counts.tests).append(" tests, ")
                .append(counts.failures).append(" failures, ")
                .append(counts.errors).append(" errors, ")
                .append(counts.skipped).append(" skipped`\n")
    }
    markdown.append("\n## Task Outcomes\n\n")
    evidence.taskOutcomes.each { String taskPath, Object outcome ->
        markdown.append("- `").append(taskPath).append("`: `").append(outcome.outcome).append("` ")
                .append(outcome.detail)
        if (outcome.acceptedNoWorkDependencies instanceof List && !outcome.acceptedNoWorkDependencies.isEmpty()) {
            markdown.append(" dependencies=")
                    .append(rootProject.ext.wave5Phase6JoinTaskPaths(outcome.acceptedNoWorkDependencies as List<String>))
        }
        markdown.append("\n")
    }
    markdown.append("\n## Blockers\n\n")
    if (evidence.blockers.isEmpty()) {
        markdown.append("- None.\n")
    } else {
        evidence.blockers.each { String blocker -> markdown.append("- ").append(blocker).append("\n") }
    }
    return markdown.toString()
}

ext.wave5Phase6ReadEvidence = { List<String> blockers ->
    File evidenceFile = file(rootProject.ext.wave5Phase6EvidenceJsonPath)
    if (!evidenceFile.isFile() || evidenceFile.length() == 0L) {
        blockers.add("missing Wave 5 Phase 6 same-run evidence: ${rootProject.ext.wave5Phase6EvidenceJsonPath}")
        return [:]
    }
    try {
        Object parsed = new groovy.json.JsonSlurper().parse(evidenceFile)
        if (parsed.evidenceSchema != "j7m-wave5-phase6-evidence-v1") {
            blockers.add("malformed Wave 5 Phase 6 evidence schema: ${parsed.evidenceSchema}")
        }
        if (parsed.technicalStatus != "TECHNICAL_PASS") {
            blockers.add("Wave 5 Phase 6 same-run evidence is not a technical pass: ${parsed.technicalStatus}")
        }
        if ((parsed.blockers ?: []).size() != 0) {
            blockers.add("Wave 5 Phase 6 same-run evidence contains blockers: ${parsed.blockers}")
        }
        return parsed
    } catch (Exception exception) {
        blockers.add("malformed Wave 5 Phase 6 evidence JSON: ${exception.message}")
        return [:]
    }
}

ext.phase6StableReportHasVolatileContent = { String markdown ->
    List<String> findings = []
    List<String> forbiddenFragments = [
            "Generated:",
            "## Final Verdict\n",
            "- Verdict: `",
            "- Git commit:",
            "- Dirty working tree:",
            "- Tests: `",
            "- Javadoc warnings:",
            "## Clean Working Tree Status",
            "git status --short --untracked-files=all`: `",
            "git diff --stat`: `",
            "git ls-files --others --exclude-standard`: `"
    ]
    forbiddenFragments.each { String fragment ->
        if (markdown.contains(fragment)) {
            findings.add(fragment)
        }
    }
    java.util.regex.Matcher timestamp = java.util.regex.Pattern
            .compile(/Generated:\s+\d{4}-\d{2}-\d{2}T/)
            .matcher(markdown)
    if (timestamp.find()) {
        findings.add("generated timestamp")
    }
    return findings
}

tasks.register("generateWave5Phase6Evidence") {
    group = "verification"
    description = "Generates targeted Wave 5 Phase 6.4-6.9 same-run validation evidence."
    rootProject.ext.wave5Phase6RequiredTaskPaths.each { String taskPath -> dependsOn taskPath }
    outputs.upToDateWhen { false }
    doLast {
        File reportDirectory = file("${buildDir}/reports/j7m")
        reportDirectory.mkdirs()
        Map<String, Object> evidence = rootProject.ext.wave5Phase6BuildEvidence()
        String json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(evidence)) + System.lineSeparator()
        String markdown = rootProject.ext.wave5Phase6MarkdownReport(evidence)
        File jsonReport = file(rootProject.ext.wave5Phase6EvidenceJsonPath)
        File markdownReport = file(rootProject.ext.wave5Phase6EvidenceMarkdownPath)
        jsonReport.setText(json, "UTF-8")
        markdownReport.setText(markdown, "UTF-8")
        println "Generated ${jsonReport}"
        println "Generated ${markdownReport}"
        if (evidence.technicalStatus != "TECHNICAL_PASS") {
            throw new GradleException("Wave 5 Phase 6 evidence is blocked: ${evidence.blockers}")
        }
    }
}

tasks.register("validateWave5Phase6Evidence") {
    group = "verification"
    description = "Validates targeted Wave 5 Phase 6.4-6.9 same-run evidence."
    dependsOn "generateWave5Phase6Evidence"
    outputs.upToDateWhen { false }
    doLast {
        File jsonReport = file(rootProject.ext.wave5Phase6EvidenceJsonPath)
        File markdownReport = file(rootProject.ext.wave5Phase6EvidenceMarkdownPath)
        if (!jsonReport.isFile() || jsonReport.length() == 0L) {
            throw new GradleException("missing Wave 5 Phase 6 JSON evidence: ${jsonReport}")
        }
        if (!markdownReport.isFile() || markdownReport.length() == 0L) {
            throw new GradleException("missing Wave 5 Phase 6 Markdown evidence: ${markdownReport}")
        }
        Object evidence = new groovy.json.JsonSlurper().parse(jsonReport)
        String markdown = markdownReport.getText("UTF-8")
        if (evidence.technicalStatus != "TECHNICAL_PASS") {
            throw new GradleException("Wave 5 Phase 6 evidence is not a technical pass: ${evidence.technicalStatus}")
        }
        if (evidence.releaseVerdict == "ACCEPT" && (evidence.dirtyWorkingTree as boolean)) {
            throw new GradleException("Wave 5 Phase 6 evidence claims release ACCEPT while the working tree is dirty")
        }
        if ((evidence.blockers ?: []).size() != 0 || (evidence.staleMissingOrMalformedEvidence ?: []).size() != 0) {
            throw new GradleException("Wave 5 Phase 6 evidence contains blockers: ${evidence.blockers}")
        }
        if (jsonReport.getText("UTF-8").contains("NOT_CAPTURED_BY_REPORT_GENERATOR")
                || markdown.contains("NOT_CAPTURED_BY_REPORT_GENERATOR")) {
            throw new GradleException("Wave 5 Phase 6 evidence contains placeholder NOT_CAPTURED_BY_REPORT_GENERATOR")
        }
        if (!markdown.contains("Technical status: `${evidence.technicalStatus}`")
                || !markdown.contains("Release verdict: `${evidence.releaseVerdict}`")) {
            throw new GradleException("Wave 5 Phase 6 JSON and Markdown evidence disagree")
        }
    }
}

