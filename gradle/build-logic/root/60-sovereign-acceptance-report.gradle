ext.phase6SafeClaimLine = { String line ->
    String lower = line.toLowerCase(java.util.Locale.ROOT)
    return lower.contains("non-goal")
            || lower.contains("forbidden")
            || lower.contains("not supported")
            || lower.contains("unsupported")
            || lower.contains("future optional")
            || lower.contains("must not")
            || lower.contains("do not")
            || lower.contains("does not")
            || lower.contains("does not claim")
            || lower.contains("does not certify")
            || lower.contains("does not prove")
            || lower.contains("did not")
            || lower.contains("no ")
            || lower.contains("not ")
            || lower.contains("not generic")
            || lower.contains("without ")
            || lower.contains("reject")
            || lower.contains("avoid")
}

ext.phase6RunGit = { List<String> args ->
    try {
        Process process = args.execute(null, rootDir)
        process.waitFor()
        if (process.exitValue() == 0) {
            return process.text.trim()
        }
        return "unavailable"
    } catch (Exception ignored) {
        return "unavailable"
    }
}

ext.phase6GitDirty = {
    String status = rootProject.ext.phase6RunGit(["git", "status", "--porcelain=v1", "--untracked-files=all"])
    return status != "unavailable" && !status.isEmpty()
}

ext.phase6CollectTestCounts = {
    Map<String, Integer> counts = [tests: 0, failures: 0, errors: 0, skipped: 0, passed: 0]
    List<Map<String, String>> skippedTests = []
    Closure<Integer> attribute = { String line, String name ->
        java.util.regex.Matcher matcher = java.util.regex.Pattern.compile(name + "=\"(\\d+)\"").matcher(line)
        return matcher.find() ? Integer.parseInt(matcher.group(1)) : 0
    }
    fileTree(rootDir).matching {
        include "**/build/test-results/test/TEST-*.xml"
        include "j7m-tests/build/test-results/phase2DiscoveryIntegrationTest/TEST-*.xml"
        include "j7m-tests/build/test-results/phase5ApplicationPlatformTest/TEST-*.xml"
        include "j7m-tests/build/test-results/phase6ReliabilitySemanticsTest/TEST-*.xml"
        exclude "j7m-tests/build/test-results/test/**"
    }.files.each { File result ->
        String text = result.getText("UTF-8")
        java.util.regex.Matcher suite = java.util.regex.Pattern.compile("<testsuite[^>]*>").matcher(text)
        if (suite.find()) {
            String line = suite.group()
            counts.tests += attribute(line, "tests")
            counts.failures += attribute(line, "failures")
            counts.errors += attribute(line, "errors")
            counts.skipped += attribute(line, "skipped")
        }
        java.util.regex.Matcher skipped = java.util.regex.Pattern
                .compile("<testcase name=\"([^\"]+)\" classname=\"([^\"]+)\"[^>]*>\\s*<skipped(?:\\s+message=\"([^\"]*)\")?", java.util.regex.Pattern.DOTALL)
                .matcher(text)
        while (skipped.find()) {
            skippedTests.add([className: skipped.group(2), testName: skipped.group(1), reason: skipped.group(3) ?: "unspecified"])
        }
    }
    counts.passed = counts.tests - counts.failures - counts.errors - counts.skipped
    return [counts: counts, skippedTests: skippedTests]
}

ext.phase6FindSkippedSourceMarkers = {
    List<String> matches = []
    fileTree(rootDir).matching {
        include "**/src/test/java/**/*.java"
        exclude "**/build/**"
    }.files.each { File source ->
        int lineNumber = 0
        source.eachLine("UTF-8") { String line ->
            lineNumber++
            String trimmed = line.trim()
            if (trimmed.startsWith("assert") || trimmed.startsWith("String ")) {
                return
            }
            if (trimmed ==~ /^@(Disabled|EnabledIf|DisabledIf|EnabledOn.*|DisabledOn.*).*/
                    || trimmed.contains("Assumptions.")
                    || trimmed.contains("assumeTrue(")
                    || trimmed.contains("assumeFalse(")) {
                matches.add("${source}:${lineNumber}:${trimmed}")
            }
        }
    }
    return matches
}

ext.phase6ScanProductionDependencyLeaks = {
    List<String> leaks = []
    List<File> candidates = [file("build.gradle"), file("settings.gradle"), file("gradle/libs.versions.toml")]
            .findAll { File candidate -> candidate.isFile() }
    candidates.each { File candidate ->
        int lineNumber = 0
        candidate.eachLine("UTF-8") { String line ->
            lineNumber++
            String trimmed = line.trim()
            boolean productionDependencyLine = trimmed ==~ /^(api|implementation|compileOnly|runtimeOnly)\s+.*/
            if (productionDependencyLine) {
                rootProject.ext.phase6ForbiddenProductionDependencyTokens.each { String token ->
                    if (trimmed.toLowerCase(java.util.Locale.ROOT).contains(token.toLowerCase(java.util.Locale.ROOT))) {
                        leaks.add("${candidate}:${lineNumber}:${token}")
                    }
                }
            }
        }
    }
    return leaks
}

ext.phase6ScanForbiddenClaims = {
    List<String> claims = []
    List<File> candidates = []
    candidates.add(file("README.md"))
    candidates.addAll(fileTree("docs").matching { include "**/*.md" }.files)
    candidates.findAll { File candidate -> candidate.isFile() }.each { File candidate ->
        int lineNumber = 0
        boolean safeSection = false
        int safeContinuationLines = 0
        candidate.eachLine("UTF-8") { String line ->
            lineNumber++
            String trimmed = line.trim()
            String trimmedLower = trimmed.toLowerCase(java.util.Locale.ROOT)
            if (trimmed.startsWith("#")) {
                safeSection = trimmedLower.contains("non-goal")
                        || trimmedLower.contains("non-start")
                        || trimmedLower.contains("known limitation")
                        || trimmedLower.contains("boundary")
                        || trimmedLower.contains("forbidden")
                        || trimmedLower.contains("unavailable")
                        || trimmedLower.contains("deferred")
            } else if (trimmed.endsWith(":")) {
                safeSection = trimmedLower.contains("non-goal")
                        || trimmedLower.contains("non-start")
                        || trimmedLower.contains("known limitation")
                        || trimmedLower.contains("boundary")
                        || trimmedLower.contains("forbidden")
                        || trimmedLower.contains("unavailable")
                        || trimmedLower.contains("deferred")
            }
            String lower = line.toLowerCase(java.util.Locale.ROOT)
            boolean safeContinuation = safeContinuationLines > 0
            rootProject.ext.phase6ForbiddenClaimPatterns.each { String pattern ->
                if (lower.contains(pattern) && !safeSection && !safeContinuation && !rootProject.ext.phase6SafeClaimLine(line)) {
                    claims.add("${candidate}:${lineNumber}:${pattern}")
                }
            }
            if (rootProject.ext.phase6SafeClaimLine(line)) {
                safeContinuationLines = 3
            } else if (safeContinuationLines > 0) {
                safeContinuationLines--
            }
        }
    }
    return claims
}

ext.phase6ModuleInventory = {
    List<Map<String, String>> inventory = []
    rootProject.ext.jpmsProductionModules.each { String projectName, String moduleName ->
        inventory.add([module: projectName, jpms: moduleName, classification: "PRODUCTION"])
    }
    rootProject.ext.jpmsSupportModules.each { String projectName, String moduleName ->
        inventory.add([module: projectName, jpms: moduleName, classification: "SUPPORT"])
    }
    rootProject.ext.jpmsNotApplicableModules.each { String projectName, String reason ->
        inventory.add([module: projectName, jpms: "", classification: reason])
    }
    inventory.add([module: "examples:modular-hello-api", jpms: "com.example.j7m.modular.hello.api", classification: "EXAMPLE"])
    inventory.add([module: "examples:modular-hello-impl", jpms: "com.example.j7m.modular.hello.impl", classification: "EXAMPLE"])
    return inventory
}

