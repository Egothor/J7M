	                        ["thread-safe", "thread safety", "concurrent"],
	                        ["lifecycle", "activation"],
	                        ["security", "principal", "authorization"],
	                        ["redacted", "redaction", "sensitive"],
	                        ["jpms", "module"]
	                ],
	                "j7m-adapter-tck/src/main/java/org/j7m/middleware/adapter/tck/AdapterTckRunner.java": [
	                        ["thread-safe", "thread safety", "concurrent"],
	                        ["lifecycle", "runner"],
	                        ["error code", "failure", "rejected"],
	                        ["redacted", "redaction", "sensitive"],
	                        ["block", "blocking", "external services"]
	                ],
	                "j7m-api/src/main/java/org/j7m/middleware/application/api/J7mInjector.java": [
	                        ["thread-safe", "thread safety", "concurrent"],
	                        ["lifecycle", "lifecycle hooks"],
	                        ["error code", "error codes", "failure"],
	                        ["redacted", "redaction", "sensitive"],
	                        ["block", "blocking", "network"]
	                ],
	                "j7m-api/src/main/java/org/j7m/middleware/annotations/J7mApplication.java": [
	                        ["lifecycle", "activation"],
	                        ["security", "policy"],
	                        ["jpms", "module"],
	                        ["transport", "vendor"],
	                        ["injection", "capabilities"]
	                ],
	                "j7m-api/src/main/java/org/j7m/middleware/annotations/Inject.java": [
	                        ["constructor", "field"],
	                        ["jpms", "module"],
	                        ["error code", "failure"],
	                        ["diagnostics", "safe"],
	                        ["dependency", "dependencies"]
	                ]
	        ]
	        List<String> shallowServiceDocs = []
	        representativeDocs.each { String path, List<List<String>> groups ->
	            File source = file(path)
	            if (!source.isFile()) {
	                shallowServiceDocs.add("${path}:missing representative public API source")
	            } else {
	                String lowerText = source.getText("UTF-8").toLowerCase(java.util.Locale.ROOT)
	                groups.each { List<String> alternatives ->
	                    boolean matched = alternatives.any { String token -> lowerText.contains(token.toLowerCase(java.util.Locale.ROOT)) }
	                    if (!matched) {
	                        shallowServiceDocs.add("${path}:missing semantic documentation term from ${alternatives}")
	                    }
	                }
	            }
	        }
	        if (!shallowServiceDocs.isEmpty()) {
	            throw new GradleException("representative public API documentation is too shallow: ${shallowServiceDocs.unique()}")
	        }
	    }
	}
