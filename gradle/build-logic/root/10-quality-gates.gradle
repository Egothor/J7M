/*
 * Purpose: aggregates strict Javadoc and public API documentation quality gates.
 * Owns: aggregateJavadoc, validateJavadocs, and validatePublicApiDocs.
 * Must not own: module dependencies, demo task bodies, example smoke flows, or release reports.
 * Root rationale: these checks span multiple modules and enforce repository-wide
 * documentation policy while leaving module builds declarative.
 * Related validation tasks: validateJavadocs, validatePublicApiDocs.
 */

tasks.register("aggregateJavadoc") {
    group = "documentation"
    description = "Builds Javadocs for every Java module under strict doclint."
    dependsOn subprojects.collect { Project candidate -> candidate.tasks.matching { Task task -> task.name == "javadoc" } }
}

ext.pmdProductionModuleNames = [
        "j7m-api",
        "j7m-annotation-processor",
        "j7m-kernel",
        "j7m-runtime",
        "j7m-durable-log",
        "j7m-messaging",
        "j7m-coordination",
        "j7m-consensus",
        "j7m-distributed-core",
        "j7m-integrations",
        "j7m-cluster-management",
        "j7m-saga",
        "j7m-isolation",
