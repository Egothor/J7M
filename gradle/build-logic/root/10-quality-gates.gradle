	                        ["block", "blocking", "deadline", "timeout"]
	                ],
	                "j7m-adapter-spi/src/main/java/org/j7m/middleware/adapter/spi/AdapterProvider.java": [
	                        ["thread-safe", "thread safety", "concurrent"],
	                        ["lifecycle", "close"],
	                        ["error code", "error codes", "failure"],
	                        ["redacted", "redaction", "sensitive"],
	                        ["block", "blocking", "deadline", "timeout"]
	                ],
	                "j7m-api/src/main/java/org/j7m/middleware/api/MiddlewareRuntime.java": [
	                        ["thread-safe", "thread safety", "concurrent"],
	                        ["lifecycle", "close"],
