tasks.register("validateIsolation") {
    group = "verification"
    description = "Validates Phase 6.8 isolation provider implementation, tests, documentation, and boundaries."
    dependsOn ":j7m-isolation:test"
    dependsOn "validateJ7mArchitecture"
    dependsOn "validatePublicApiDocs"
    doLast {
        File document = file("documentation/docs/security/isolation-providers.md")
        if (!document.isFile()) {
            throw new GradleException("missing documentation/docs/security/isolation-providers.md")
        }
        String text = document.getText("UTF-8")
        [
                "IsolationProvider", "InProcessIsolationProvider", "LocalProcessIsolationProvider",
                "resource-budget", "filesystem policy", "network policy", "environment",
                "lifecycle", "stdout", "stderr", "redaction", "audit", "metrics", "advisory"
        ].each { String token ->
            if (!text.toLowerCase(java.util.Locale.ROOT).contains(token.toLowerCase(java.util.Locale.ROOT))) {
                throw new GradleException("isolation provider document missing required section or phrase: ${token}")
            }
        }
        String descriptor = file("j7m-isolation/src/main/java/module-info.java").getText("UTF-8")
        if (descriptor.contains(".internal")) {
            throw new GradleException("j7m-isolation exports an internal package")
        }
        String lower = text.toLowerCase(java.util.Locale.ROOT)
        if (lower.contains("queue/backlog budget | enforced")) {
            throw new GradleException("isolation docs must not claim queue/backlog enforcement for the Java-only baseline")
        }
        if (!lower.contains("queue/backlog budget | policy only")) {
            throw new GradleException("isolation docs must classify queue/backlog budget as POLICY_ONLY for the Java-only baseline")
        }
        if (!lower.contains("smaller request timeout and resource-budget maximum runtime")
                || !lower.contains("smaller stream-policy and resource-budget bounds")) {
            throw new GradleException("isolation docs must describe effective runtime and output limit calculations")
        }
    }
}

tasks.register("validateAdapterSpi") {
    group = "verification"
    description = "Validates Phase 6.9 adapter SPI contracts, documentation, Javadocs, and dependency boundaries."
    dependsOn ":j7m-adapter-spi:test"
    dependsOn "validateJ7mArchitecture"
    dependsOn "validatePublicApiDocs"
    doLast {
        File descriptor = file("j7m-adapter-spi/src/main/java/module-info.java")
        if (!descriptor.getText("UTF-8").contains("module org.j7m.adapter.spi")) {
            throw new GradleException("j7m-adapter-spi JPMS descriptor is missing")
        }
        if (descriptor.getText("UTF-8").contains(".internal")) {
            throw new GradleException("j7m-adapter-spi exports an internal package")
        }
        File adapterProvider = file("j7m-adapter-spi/src/main/java/org/j7m/middleware/adapter/spi/AdapterProvider.java")
        String providerText = adapterProvider.getText("UTF-8").toLowerCase(java.util.Locale.ROOT)
        ["vendor-neutral", "thread-safe", "lifecycle", "error codes", "redacted", "blocking"].each { String token ->
            if (!providerText.contains(token)) {
                throw new GradleException("AdapterProvider Javadocs missing semantic term: ${token}")
            }
        }
    }
}

tasks.register("validateAdapterTck") {
    group = "verification"
    description = "Validates Phase 6.9 adapter TCK harness, fake fixture boundaries, documentation, and demo wiring."
    dependsOn ":j7m-adapter-tck:test"
    dependsOn "validateAdapterSpi"
    doLast {
        File document = file("documentation/docs/programming/adapters.md")
        if (!document.isFile()) {
            throw new GradleException("missing documentation/docs/programming/adapters.md")
        }
        String text = document.getText("UTF-8").toLowerCase(java.util.Locale.ROOT)
        [
                "adapterprovider", "semantic profiles", "capabilities", "compatibility",
                "durable log", "messaging", "coordination", "consensus", "repository replication",
                "saga", "isolation", "failure-mode", "redaction", "limitations", "reference operations"
        ].each { String token ->
            if (!text.contains(token)) {
                throw new GradleException("adapter SPI/TCK document missing required section or phrase: ${token}")
            }
        }
        [
                "sentinel leakage", "public provider and report surfaces", "actual observable operations",
                "adapterreferencesession.recordeffect"
        ].each { String token ->
            if (!text.contains(token)) {
                throw new GradleException("adapter SPI/TCK document missing hardened redaction/security-scope wording: ${token}")
            }
        }
        if (text.contains("security checks verify authorization hooks, audit hooks, verification gates")) {
            throw new GradleException("adapter SPI/TCK document still overclaims universal verification-gate security checks")
        }
        File redactionPolicy = file("j7m-adapter-spi/src/main/java/org/j7m/middleware/adapter/spi/AdapterRedactionPolicy.java")
        String redactionPolicyText = redactionPolicy.getText("UTF-8")
        ["containsSensitiveValue", "redactMetadata", "J7M_SENTINEL_SECRET_TOKEN", "endpointcredential"].each { String token ->
            if (!redactionPolicyText.toLowerCase(java.util.Locale.ROOT).contains(token.toLowerCase(java.util.Locale.ROOT))) {
                throw new GradleException("AdapterRedactionPolicy missing required scanner/redactor token: ${token}")
            }
        }
        File runner = file("j7m-adapter-tck/src/main/java/org/j7m/middleware/adapter/tck/AdapterTckRunner.java")
        String runnerText = runner.getText("UTF-8")
        ["scanTckOutput", "scanProviderPublicOutput", "publicTextLeaksSensitiveValue", "containsRedactionMarker"].each { String token ->
            if (!runnerText.contains(token)) {
                throw new GradleException("AdapterTckRunner missing independent report-level redaction scan: ${token}")
            }
        }
        File redactionTest = file("j7m-adapter-tck/src/test/java/org/j7m/middleware/adapter/tck/AdapterRedactionEnforcementTest.java")
        String redactionTestText = redactionTest.getText("UTF-8")
        ["note", "description", "message", "J7M_SENTINEL_SECRET_TOKEN", "maliciousProbeCannotPassBySelfReportingNoLeak"].each { String token ->
            if (!redactionTestText.contains(token)) {
                throw new GradleException("adapter redaction enforcement test missing required case: ${token}")
            }
        }
        File demo = file("j7m-demo/src/main/java/org/j7m/middleware/demo/adapter/AdapterTckDemo.java")
        String demoText = demo.getText("UTF-8")
        ["semanticMatrix", "compatibilityReport", "securityFindings", "failureModeFindings", "redactionFindings"].each { String token ->
            if (!demoText.contains(token)) {
                throw new GradleException("runAdapterTckDemo does not print required TCK summary field: ${token}")
            }
        }
        fileTree("j7m-adapter-tck/src/main/java").matching { include "**/*.java" }.files.each { File source ->
            if (source.getText("UTF-8").contains("Fake")) {
                throw new GradleException("fake adapter fixture leaked into TCK main sources: ${source}")
            }
        }
    }
}
