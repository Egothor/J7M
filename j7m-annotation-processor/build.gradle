dependencies {
    implementation project(":j7m-api")
    testImplementation project(":j7m-kernel")
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    dependsOn ':j7m-api:jar', ':j7m-kernel:jar', tasks.named('jar')
    doFirst { systemProperty 'j7m.processor.test.classpath', sourceSets.test.runtimeClasspath.asPath }
    systemProperty 'j7m.processor.test.api', project(':j7m-api').tasks.named('jar').get().archiveFile.get().asFile
    systemProperty 'j7m.processor.test.jar', tasks.named('jar').get().archiveFile.get().asFile
}
