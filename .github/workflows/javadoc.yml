name: Publish Javadoc after source changes

on:
  push:
    branches: [main]
    paths:
      - '**/src/main/**'
      - '**/*.gradle'
      - 'gradle/**'
      - 'buildSrc/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-pages.yml
