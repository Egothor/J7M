name: Build and deploy the complete Pages site

on:
  workflow_call:

# A Javadoc refresh is a complete deployment, preserving the manual in the same artifact.
concurrency:
  group: j7m-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: documentation/requirements.txt
      - name: Read Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install documentation dependencies
        run: python -m pip install --requirement documentation/requirements.txt
      - name: Verify publication assembly
        run: python -m unittest discover -s documentation/tools/tests -v
      - name: Build strict module Javadoc
        run: ./gradlew javadoc --no-daemon --stacktrace
      - name: Build MkDocs for the project web root
        run: python -m mkdocs build --strict --config-file documentation/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/build/pages"
      - name: Add module Javadoc and its index
        run: python documentation/tools/assemble_site.py --site build/pages
      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete project site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
