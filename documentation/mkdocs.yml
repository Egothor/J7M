site_name: J7M Documentation
site_url: https://www.egothor.org/J7M/
site_description: Develop, configure and operate distributed Java applications with J7M. Annotated and
  explicit APIs, verified patterns and operational contracts.
copyright: Copyright © 2026 Leo Galambos and the Egothor team
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true
theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/images/j7m-mark.svg
  favicon: assets/images/j7m-mark.svg
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - navigation.footer
  - navigation.tracking
  - toc.follow
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.code.annotate
  - content.tabs.link
  palette:
  - scheme: default
    media: "(prefers-color-scheme: light)"
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - scheme: slate
    media: "(prefers-color-scheme: dark)"
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
plugins:
- search
