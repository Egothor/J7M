markdown_extensions:
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences: {}
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.snippets:
    check_paths: true
    base_path:
    - !relative $config_dir/..
extra_css:
- assets/stylesheets/enterprise.css
extra:
  generator: false


validation:
  links:
    anchors: warn
    not_found: warn
