<text x="315" y="130" text-anchor="middle" fill="#235775" font-family="Segoe UI,Arial,sans-serif" font-size="13">invoke</text>
<path d="M625 145H715" fill="none" stroke="#2587b6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="670" y="130" text-anchor="middle" fill="#235775" font-family="Segoe UI,Arial,sans-serif" font-size="13">resource API</text>
