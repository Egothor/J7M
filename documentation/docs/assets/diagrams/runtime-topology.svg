<text x="46" y="147" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Java interfaces and proxies</text>
<text x="46" y="168" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Local or managed components</text>
<rect x="360" y="90" width="265" height="110" rx="10" fill="white" stroke="#9fbdcf" stroke-width="1.4"/><rect x="360" y="90" width="265" height="7" rx="3" fill="#efc45c"/><text x="376" y="122" fill="#0b263e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Application JVM B</text>
<text x="376" y="147" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Runtime / Nugget host</text>
<text x="376" y="168" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Validated policies and adapters</text>
<rect x="715" y="90" width="215" height="110" rx="10" fill="white" stroke="#9fbdcf" stroke-width="1.4"/><rect x="715" y="90" width="215" height="7" rx="3" fill="#efc45c"/><text x="731" y="122" fill="#0b263e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Resource group</text>
