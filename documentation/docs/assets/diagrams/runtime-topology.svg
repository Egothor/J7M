<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Applications, discovery and durable resources</title><desc id="desc">Two JVMs communicate using references discovered through their configured registries; optional resource groups provide separate durable state.</desc>
