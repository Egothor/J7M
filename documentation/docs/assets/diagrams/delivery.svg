<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Database effects and durable message delivery</title><desc id="desc">An outbox transaction and inbox transaction each own one database connection. Queue send and acknowledgement remain separate boundaries.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2587b6"/></marker></defs>
<rect x="1" y="1" width="958" height="418" rx="16" fill="#f3f8fc" stroke="#d9e6ee"/>
<text x="30" y="37" fill="#071a2c" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Database effects and durable message delivery</text>
<path d="M220 160H265" fill="none" stroke="#2587b6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="242" y="143" text-anchor="middle" fill="#235775" font-family="Segoe UI,Arial,sans-serif" font-size="13">commit</text>
<path d="M455 160H500" fill="none" stroke="#2587b6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="478" y="143" text-anchor="middle" fill="#235775" font-family="Segoe UI,Arial,sans-serif" font-size="13">send</text>
<path d="M690 160H735" fill="none" stroke="#2587b6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="712" y="143" text-anchor="middle" fill="#235775" font-family="Segoe UI,Arial,sans-serif" font-size="13">deliver</text>
<path d="M830 220V250H595V220" fill="none" stroke="#2587b6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="720" y="273" text-anchor="middle" fill="#235775" font-family="Segoe UI,Arial,sans-serif" font-size="13">ACK after DB commit</text>
<path d="M360 220V280" fill="none" stroke="#2587b6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<path d="M595 280V220" fill="none" stroke="#2587b6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="30" y="100" width="190" height="120" rx="10" fill="white" stroke="#9fbdcf" stroke-width="1.4"/><rect x="30" y="100" width="190" height="7" rx="3" fill="#efc45c"/><text x="46" y="132" fill="#0b263e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Producer DB tx</text>
<text x="46" y="157" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Business mutation</text>
<text x="46" y="178" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Outbox row</text>
<text x="46" y="199" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">One Connection</text>
<rect x="265" y="100" width="190" height="120" rx="10" fill="white" stroke="#9fbdcf" stroke-width="1.4"/><rect x="265" y="100" width="190" height="7" rx="3" fill="#efc45c"/><text x="281" y="132" fill="#0b263e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Outbox relay</text>
<text x="281" y="157" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Recover pending row</text>
<text x="281" y="178" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Send stable identity</text>
<text x="281" y="199" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Mark confirmation</text>
<rect x="500" y="100" width="190" height="120" rx="10" fill="white" stroke="#9fbdcf" stroke-width="1.4"/><rect x="500" y="100" width="190" height="7" rx="3" fill="#efc45c"/><text x="516" y="132" fill="#0b263e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Durable queue</text>
<text x="516" y="157" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Atomic claim</text>
<text x="516" y="178" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Payload + receipt push</text>
<text x="516" y="199" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Bounded credits</text>
<rect x="735" y="100" width="195" height="120" rx="10" fill="white" stroke="#9fbdcf" stroke-width="1.4"/><rect x="735" y="100" width="195" height="7" rx="3" fill="#efc45c"/><text x="751" y="132" fill="#0b263e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Consumer DB tx</text>
<text x="751" y="157" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Inbox + business effect</text>
<text x="751" y="178" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Commit, then ACK</text>
<text x="751" y="199" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Duplicate guard</text>
<rect x="265" y="280" width="425" height="65" rx="10" fill="white" stroke="#9fbdcf" stroke-width="1.4"/><rect x="265" y="280" width="425" height="7" rx="3" fill="#efc45c"/><text x="281" y="312" fill="#0b263e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Recovery boundary</text>
<text x="281" y="337" fill="#3e5d73" font-family="Segoe UI,Arial,sans-serif" font-size="14">Retry stable identities; preserve UNKNOWN outcomes</text>
<text x="30" y="395" fill="#466174" font-family="Segoe UI,Arial,sans-serif" font-size="13">A database transaction and a queue acknowledgement do not form an implicit cross-system transaction.</text></svg>
