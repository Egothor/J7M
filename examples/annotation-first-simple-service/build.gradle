plugins {
    id 'application'
}

description = 'Annotation-first simple service example validated by Phase 6.11 example tasks.'

java {
    modularity.inferModulePath = true
}

String defaultJ7mRepository = layout.projectDirectory.dir("j7m-local-repository").asFile.absolutePath
String j7mRepository = providers.gradleProperty("j7mRepository").orElse(defaultJ7mRepository).get()

repositories {
    maven {
        url = uri(j7mRepository)
    }
}

dependencies {
    implementation "org.j7m:j7m-api:0.1.0-SNAPSHOT"
    implementation "org.j7m:j7m-application-platform:0.1.0-SNAPSHOT"
}

application {
    mainClass = "org.j7m.examples.annotation.simple.SimpleExampleMain"
}

tasks.named("test") {
    failOnNoDiscoveredTests = false
}

tasks.register("verifyExpectedOutput", JavaExec) {
    group = "verification"
    description = "Runs the simple annotation-first smoke flow and checks EXPECTED_OUTPUT markers."
    dependsOn "classes"
    mainClass = application.mainClass.get()
    classpath = sourceSets.main.runtimeClasspath
    ByteArrayOutputStream capturedOutput = new ByteArrayOutputStream()
    standardOutput = capturedOutput
    errorOutput = capturedOutput
    inputs.file layout.projectDirectory.file("EXPECTED_OUTPUT.txt")
    outputs.file layout.buildDirectory.file("reports/annotation-first-simple-service.out")

    doLast {
        File outputFile = layout.buildDirectory.file("reports/annotation-first-simple-service.out").get().asFile
        outputFile.parentFile.mkdirs()
        String actual = capturedOutput.toString("UTF-8").replace("\r\n", "\n")
        outputFile.setText(actual, "UTF-8")
        file("EXPECTED_OUTPUT.txt").readLines("UTF-8").findAll { String line -> !line.isBlank() }.each { String marker ->
            if (!actual.contains(marker)) {
                throw new GradleException("simple annotation example output missing expected marker: ${marker}")
            }
        }
    }
}
