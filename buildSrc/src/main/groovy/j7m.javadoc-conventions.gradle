tasks.withType(Javadoc).configureEach {
    failOnError = true
    options.addBooleanOption("Xdoclint:all", true)
    options.addBooleanOption("Werror", true)
}

ext.j7mConventionPurpose = "Strict Javadoc convention with doclint and warnings-as-errors for all Java modules."
ext.j7mConventionKind = "shared-configuration"
