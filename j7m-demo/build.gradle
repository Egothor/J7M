plugins {
    id "j7m.demo-module"
}

application {
    mainClass = "org.j7m.middleware.demo.Phase1Demo"
}

dependencies {
    implementation project(":j7m-api")
    implementation project(":j7m-kernel")
    implementation project(":j7m-runtime")
    implementation project(":j7m-application-platform")
    implementation project(":j7m-durable-log")
    implementation project(":j7m-messaging")
    implementation project(":j7m-coordination")
    implementation project(":j7m-consensus")
    implementation project(":j7m-saga")
    implementation project(":j7m-isolation")
    implementation project(":j7m-adapter-spi")
    implementation project(":j7m-adapter-tck")
    implementation project(":j7m-deployer-cli")
    implementation project(":j7m-examples")
    implementation project(":j7m-transport-grpc")
    implementation project(":j7m-transport-rmi")
}

