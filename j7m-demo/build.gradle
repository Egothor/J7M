tasks.register("runGradlePluginWorkflowDemo") {
    group = "application"
    description = "Runs the Phase 5.5 Gradle plugin local workflow demo."
    dependsOn rootProject.tasks.named("j7mPackage")
    dependsOn rootProject.tasks.named("j7mSign")
    dependsOn rootProject.tasks.named("j7mVerify")
    dependsOn rootProject.tasks.named("j7mDeployLocal")
    dependsOn rootProject.tasks.named("j7mPlanLocal")
    dependsOn rootProject.tasks.named("j7mRunLocal")
    dependsOn rootProject.tasks.named("j7mStatusLocal")
    dependsOn rootProject.tasks.named("j7mStopLocal")
    dependsOn rootProject.tasks.named("j7mUnloadLocal")
    doLast {
        println "phase5.5 gradle plugin workflow: package/sign/verify/deploy/plan/run/status/stop/unload PASS"
    }
}

tasks.register("runDeployerCliWorkflowDemo") {
    group = "application"
    description = "Runs the Phase 5.5 deployer CLI local lifecycle workflow demo."
    dependsOn ":j7m-deployer-cli:test"
    doLast {
        println "phase5.5 deployer cli workflow: package/sign/verify/deploy/plan/start/list/status/stop/unload PASS"
    }
}

tasks.register("runDeployerCliUpgradeRollbackDemo") {
    group = "application"
    description = "Runs the Phase 5.5 deployer CLI upgrade and rollback workflow demo."
    dependsOn ":j7m-deployer-cli:test"
    dependsOn ":j7m-demo:runApplicationUpgradeRollbackDemo"
    dependsOn ":j7m-demo:runRollingUpgradeDemo"
    dependsOn ":j7m-demo:runBlueGreenUpgradeDemo"
    dependsOn ":j7m-demo:runCanaryBaselineUpgradeDemo"
    doLast {
        println "phase5.5 deployer cli upgrade rollback workflow: stop-start/rolling/blue-green/canary-baseline PASS"
    }
}

