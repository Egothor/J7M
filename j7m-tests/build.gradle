static boolean phase7LedgerTextMatchesEvidence(final String ledger, final Map<String, Object> evidence) {
    if (ledger == null || ledger.isBlank()) {
        return false
    }
    Map<String, Long> generatedTotals = phase7GeneratedEvidenceTotals(evidence)
    Map<String, Long> ledgerTotals = phase7LedgerStableEvidenceTotals(ledger)
    if (generatedTotals == null || ledgerTotals == null) {
        return false
    }
    Map<String, Object> categories = evidence.categories as Map<String, Object>
    String scope = evidence.scope == null ? "" : evidence.scope.toString()
    String finalAcceptance = categories == null || categories.phase711FinalAcceptance == null
            ? ""
            : categories.phase711FinalAcceptance.toString()
    String currentRunIdentity = evidence.currentRunIdentity == null ? "" : evidence.currentRunIdentity.toString()
    boolean ledgerHasHardCodedIdentity = ledger.contains("Evidence current-run identity:")
            || ledger.contains("Current-run identity:")
            || (!currentRunIdentity.isBlank() && ledger.contains(currentRunIdentity))
    boolean generatedStableCountsPass = generatedTotals.failures == 0L
            && generatedTotals.errors == 0L
            && generatedTotals.skipped == 0L
    return ledger.contains("IMPLEMENTED_READY_FOR_OWNER_COMMIT_AND_FINAL_PHASE7_11_REVIEW")
            && ledger.contains(scope)
            && phase7EvidenceTotalsEqual(ledgerTotals, generatedTotals)
            && generatedStableCountsPass
            && ledger.contains("0 failures, 0 errors, 0 skipped tests")
            && !ledgerHasHardCodedIdentity
            && ledger.contains("excludes volatile `generatedAt` and obsolete `junitArtifacts`/`demoArtifacts`")
            && ledger.contains("phase711FinalAcceptance")
            && (finalAcceptance == "PASS" || finalAcceptance == "NOT_RELEASE_READY_DIRTY_TREE" || finalAcceptance == "FAILED")
            && !ledger.contains("phase711DeferredFeatures")
            && !ledger.contains("Phase 7.10 accepted")
            && !ledger.contains("Phase 7.11 accepted")
}

static boolean phase7GeneratedDirtyNonReleaseStatePass(final Map<String, Object> evidence) {
    return evidence.dirtyWorkingTree == true
            && evidence.releaseState == "TECHNICAL_PASS_DIRTY_TREE_RELEASE_SEAL_REQUIRES_OWNER_COMMIT"
            && evidence.releaseRecommendation == "DO_NOT_RELEASE_FROM_UNCOMMITTED_CURRENT_RUN_EVIDENCE"
}

static boolean phase7GeneratedReleaseStatePass(final Map<String, Object> evidence, final boolean currentDirtyTree) {
    if (currentDirtyTree) {
        return evidence.dirtyWorkingTree == true
                && evidence.releaseState == "TECHNICAL_PASS_DIRTY_TREE_RELEASE_SEAL_REQUIRES_OWNER_COMMIT"
                && evidence.releaseRecommendation == "DO_NOT_RELEASE_FROM_UNCOMMITTED_CURRENT_RUN_EVIDENCE"
    }
    return evidence.dirtyWorkingTree == false
            && evidence.releaseState == "PHASE7_RELEASE_ACCEPTED"
            && evidence.releaseRecommendation == "ACCEPT_PHASE7_RELEASE"
}

static List<String> phase7CurrentSemanticProblems(
        final Map<String, Object> evidence,
        final Map<String, Object> currentSummary,
        final Map<String, String> currentCategories,
        final String currentHead,
        final boolean currentDirtyTree) {
    List<String> problems = []
        if (evidence.formatVersion != "j7m-phase7-evidence-v8") {
            problems.add("stale format ${evidence.formatVersion}")
        }
    if (evidence.scope != "Phase 7.0-7.11 nugget operations final acceptance evidence") {
        problems.add("stale scope ${evidence.scope}")
    }
    if (evidence.currentHead != currentHead) {
        problems.add("stale HEAD")
    }
    Map<String, Long> evidenceTotals = phase7GeneratedEvidenceTotals(evidence)
    Map<String, Long> currentTotals = phase7GeneratedEvidenceTotals([tests: currentSummary.counts])
    if (evidenceTotals == null || currentTotals == null || !phase7EvidenceTotalsEqual(evidenceTotals, currentTotals)) {
        problems.add("JUnit semantic totals changed")
    }
    if (!phase7RequiredSuitesPass(currentSummary, phase7RequiredSuites())) {
        problems.add("required suites are not passing")
    }
    Map<String, Object> categories = evidence.categories as Map<String, Object>
    if (categories == null) {
        problems.add("missing categories")
    } else {
        if (categories.phase711DeferredFeatures != null) {
            problems.add("obsolete Phase 7.11 deferred marker present")
        }
        String expectedFinalAcceptance = currentDirtyTree ? "NOT_RELEASE_READY_DIRTY_TREE" : "PASS"
        if (!phase7ExecutableCategoriesPass(currentCategories)) {
            expectedFinalAcceptance = "FAILED"
        }
        if (categories.phase711FinalAcceptance != expectedFinalAcceptance) {
            problems.add("Phase 7.11 final acceptance state is ${categories.phase711FinalAcceptance}")
        }
        if (!phase7ExecutableCategoriesPass(categories)) {
            problems.add("executable category failed")
        }
        if (categories != currentCategories) {
            problems.add("category statuses changed")
        }
    }
    if (evidence.validationState != "PASS") {
        problems.add("validation state is ${evidence.validationState}")
    }
    if (!phase7GeneratedReleaseStatePass(evidence, currentDirtyTree)) {
        problems.add("release state does not match current dirty-tree state")
    }
    return problems
}

