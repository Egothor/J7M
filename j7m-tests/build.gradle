static boolean phase7MalformedSuiteSelfCheck(final File scratchRoot) {
    File directory = new File(scratchRoot, "phase7-malformed-suite-self-check")
    directory.mkdirs()
    File xml = new File(directory, "TEST-MalformedSuite.xml")
    xml.setText("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n"
            + "<testsuite name=\"MalformedSuite\" tests=\"1\"></testsuite>\n", "UTF-8")
    Map<String, Object> summary = phase7EvidenceSummary([directory])
    File tooManyDirectory = new File(scratchRoot, "phase7-too-many-suite-self-check")
    tooManyDirectory.mkdirs()
    for (int index = 0; index <= phase7MaxXmlFilesPerDirectory(); index++) {
        File extra = new File(tooManyDirectory, "TEST-TooMany-" + index + ".xml")
        extra.setText("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n"
                + "<testsuite name=\"TooMany${index}\" tests=\"1\" failures=\"0\" errors=\"0\" skipped=\"0\"></testsuite>\n",
                "UTF-8")
    }
    Map<String, Object> tooManySummary = phase7EvidenceSummary([tooManyDirectory])
    File oversizedDirectory = new File(scratchRoot, "phase7-oversized-suite-self-check")
    oversizedDirectory.mkdirs()
    File oversized = new File(oversizedDirectory, "TEST-Oversized.xml")
    oversized.setText("x".repeat(phase7MaxXmlBytes() + 1), "UTF-8")
    Map<String, Object> oversizedSummary = phase7EvidenceSummary([oversizedDirectory])
    File oversizedDemo = new File(scratchRoot, "phase7-oversized-demo.out")
    oversizedDemo.setText("x".repeat(phase7MaxDemoBytes() + 1), "UTF-8")
    return (summary.malformed as Boolean) && !phase7CountsPass(summary)
            && (tooManySummary.malformed as Boolean) && !phase7CountsPass(tooManySummary)
            && (oversizedSummary.malformed as Boolean) && !phase7CountsPass(oversizedSummary)
            && !phase7OutputContains(oversizedDemo, ["x"])
}

