static boolean phase7LedgerDirtyNonReleaseStatePass(final String ledger) {
    String marker = ("- Stable Phase 7 dirty-tree non-release marker: dirtyWorkingTree=true "
            + "releaseState=TECHNICAL_PASS_DIRTY_TREE_RELEASE_SEAL_REQUIRES_OWNER_COMMIT "
            + "releaseRecommendation=DO_NOT_RELEASE_FROM_UNCOMMITTED_CURRENT_RUN_EVIDENCE.")
    java.util.regex.Matcher markerMatcher = java.util.regex.Pattern
            .compile("(?m)^" + java.util.regex.Pattern.quote(marker) + "\$")
            .matcher(ledger)
    int markerCount = 0
    while (markerMatcher.find()) {
        markerCount = markerCount + 1
        if (markerCount > 1) {
            return false
        }
    }
    return markerCount == 1
}

static Map<String, Long> phase7GeneratedEvidenceTotals(final Map<String, Object> evidence) {
    if (evidence == null) {
        return null
    }
    Map<String, Object> tests = evidence.tests as Map<String, Object>
    if (tests == null) {
        return null
    }
    Long testCount = phase7EvidenceNonNegativeLong(tests.tests)
    Long failures = phase7EvidenceNonNegativeLong(tests.failures)
    Long errors = phase7EvidenceNonNegativeLong(tests.errors)
    Long skipped = phase7EvidenceNonNegativeLong(tests.skipped)
    if (testCount == null || failures == null || errors == null || skipped == null) {
        return null
    }
    return [tests: testCount, failures: failures, errors: errors, skipped: skipped]
}

static Map<String, Long> phase7LedgerStableEvidenceTotals(final String ledger) {
    java.util.regex.Matcher prefixMatcher = java.util.regex.Pattern
            .compile("(?m)^- Stable Phase 7 evidence totals marker:")
            .matcher(ledger)
    int prefixCount = 0
    while (prefixMatcher.find()) {
        prefixCount = prefixCount + 1
        if (prefixCount > 1) {
            return null
        }
    }
    if (prefixCount != 1) {
        return null
    }

    java.util.regex.Matcher markerMatcher = java.util.regex.Pattern
            .compile("(?m)^- Stable Phase 7 evidence totals marker: tests=(0|[1-9][0-9]*) failures=(0|[1-9][0-9]*) errors=(0|[1-9][0-9]*) skipped=(0|[1-9][0-9]*)\\.\$")
            .matcher(ledger)
    if (!markerMatcher.find()) {
        return null
    }
    Long testCount = phase7ParseStableEvidenceTotal(markerMatcher.group(1))
    Long failures = phase7ParseStableEvidenceTotal(markerMatcher.group(2))
    Long errors = phase7ParseStableEvidenceTotal(markerMatcher.group(3))
    Long skipped = phase7ParseStableEvidenceTotal(markerMatcher.group(4))
    if (testCount == null || failures == null || errors == null || skipped == null || markerMatcher.find()) {
        return null
    }
    return [tests: testCount, failures: failures, errors: errors, skipped: skipped]
}

static Long phase7EvidenceNonNegativeLong(final Object value) {
    if (!(value instanceof Number)) {
        return null
    }
    if (value instanceof java.math.BigInteger) {
        java.math.BigInteger integerValue = value as java.math.BigInteger
        if (integerValue.signum() < 0 || integerValue.compareTo(java.math.BigInteger.valueOf(Long.MAX_VALUE)) > 0) {
            return null
        }
        return integerValue.longValue()
    }
    if (value instanceof java.math.BigDecimal) {
        try {
            return phase7EvidenceNonNegativeLong(((java.math.BigDecimal) value).toBigIntegerExact())
        } catch (ArithmeticException ignored) {
            return null
        }
    }
    if (value instanceof Double || value instanceof Float) {
        double doubleValue = ((Number) value).doubleValue()
        if (!Double.isFinite(doubleValue) || Math.rint(doubleValue) != doubleValue
                || doubleValue < 0.0d || doubleValue > Long.MAX_VALUE) {
            return null
        }
        return (long) doubleValue
    }
    long longValue = ((Number) value).longValue()
    return longValue < 0L ? null : longValue
}

static Long phase7ParseStableEvidenceTotal(final String value) {
    try {
        long parsed = Long.parseLong(value)
        return parsed < 0L ? null : parsed
    } catch (NumberFormatException ignored) {
        return null
    }
}

static boolean phase7EvidenceTotalsEqual(final Map<String, Long> first, final Map<String, Long> second) {
    return first.tests == second.tests
            && first.failures == second.failures
            && first.errors == second.errors
            && first.skipped == second.skipped
}

static boolean phase7LedgerMismatchSelfCheck() {
    Map<String, Object> evidence = [
            scope: "Phase 7.0-7.11 nugget operations final acceptance evidence",
            tests: [tests: 279, failures: 0, errors: 0, skipped: 0],
            categories: [phase711FinalAcceptance: "NOT_RELEASE_READY_DIRTY_TREE"],
            dirtyWorkingTree: true,
            releaseState: "TECHNICAL_PASS_DIRTY_TREE_RELEASE_SEAL_REQUIRES_OWNER_COMMIT",
            releaseRecommendation: "DO_NOT_RELEASE_FROM_UNCOMMITTED_CURRENT_RUN_EVIDENCE",
            currentRunIdentity: "identity-a"
    ]
    String marker = "- Stable Phase 7 evidence totals marker: tests=279 failures=0 errors=0 skipped=0.\n"
    String matching = ("**Status:** IMPLEMENTED_READY_FOR_OWNER_COMMIT_AND_FINAL_PHASE7_11_REVIEW.\n"
            + "Scope: Phase 7.0-7.11 nugget operations final acceptance evidence.\n"
            + marker
            + "Evidence stable contract: generated reports must validate with 0 failures, 0 errors, "
            + "0 skipped tests, stable scope, current HEAD, required suite/category status, "
            + "and a `phase711FinalAcceptance` state of `NOT_RELEASE_READY_DIRTY_TREE`, `PASS`, or `FAILED`.\n"
            + "Generated evidence excludes volatile `generatedAt` and obsolete "
            + "`junitArtifacts`/`demoArtifacts` fields from stable acceptance checks.\n")
    Map<String, Object> cleanReleaseEvidence = new LinkedHashMap<String, Object>(evidence)
    Map<String, String> cleanReleaseCategories = new LinkedHashMap<String, String>(evidence.categories as Map<String, String>)
    cleanReleaseCategories.phase711FinalAcceptance = "PASS"
    cleanReleaseEvidence.categories = cleanReleaseCategories
    cleanReleaseEvidence.dirtyWorkingTree = false
    cleanReleaseEvidence.releaseState = "PHASE7_RELEASE_ACCEPTED"
    cleanReleaseEvidence.releaseRecommendation = "ACCEPT_PHASE7_RELEASE"
    String staleTests = matching.replace(marker,
            "- Stable Phase 7 evidence totals marker: tests=278 failures=0 errors=0 skipped=0.\n")
    String staleFailures = matching.replace(marker,
            "- Stable Phase 7 evidence totals marker: tests=279 failures=1 errors=0 skipped=0.\n")
    String staleErrors = matching.replace(marker,
            "- Stable Phase 7 evidence totals marker: tests=279 failures=0 errors=1 skipped=0.\n")
    String staleSkips = matching.replace(marker,
            "- Stable Phase 7 evidence totals marker: tests=279 failures=0 errors=0 skipped=1.\n")
    String missingMarker = matching.replace(marker, "")
    String malformedMarker = matching.replace(marker,
            "- Stable Phase 7 evidence totals marker: tests=-279 failures=0 errors=0 skipped=0.\n")
    String duplicateMarker = matching + marker
    String overflowMarker = matching.replace(marker,
            "- Stable Phase 7 evidence totals marker: tests=9223372036854775808 failures=0 errors=0 skipped=0.\n")
    String staleIdentity = matching + "Evidence current-run identity:\n`identity-b`.\n"
    String missingFinalState = matching.replace("phase711FinalAcceptance", "phase711DeferredFeatures")
    String obsoleteDeferred = matching + "phase711DeferredFeatures=DEFERRED_NOT_ACCEPTED.\n"
    return phase7LedgerTextMatchesEvidence(matching, evidence)
            && phase7LedgerTextMatchesEvidence(matching, cleanReleaseEvidence)
            && !phase7LedgerTextMatchesEvidence(staleTests, evidence)
            && !phase7LedgerTextMatchesEvidence(staleFailures, evidence)
            && !phase7LedgerTextMatchesEvidence(staleErrors, evidence)
            && !phase7LedgerTextMatchesEvidence(staleSkips, evidence)
            && !phase7LedgerTextMatchesEvidence(missingMarker, evidence)
            && !phase7LedgerTextMatchesEvidence(malformedMarker, evidence)
            && !phase7LedgerTextMatchesEvidence(duplicateMarker, evidence)
            && !phase7LedgerTextMatchesEvidence(overflowMarker, evidence)
            && !phase7LedgerTextMatchesEvidence(staleIdentity, evidence)
            && !phase7LedgerTextMatchesEvidence(missingFinalState, evidence)
            && !phase7LedgerTextMatchesEvidence(obsoleteDeferred, evidence)
}

static boolean phase7ExecutableCategoriesPass(final Map<String, Object> categories) {
    return categories.every { Map.Entry<String, Object> entry ->
        if (entry.key == "operatorGuidance") {
            return entry.value == "GUIDANCE_ONLY"
        }
        if (entry.key == "phase711FinalAcceptance") {
            return entry.value == "PASS" || entry.value == "NOT_RELEASE_READY_DIRTY_TREE"
        }
        return entry.value == "PASS"
    }
}

static boolean phase7DirtyWorkingTree(final File root) {
    Process gitStatusProcess = new ProcessBuilder("git", "status", "--short")
            .directory(root)
            .redirectErrorStream(true)
            .start()
    String gitStatus = gitStatusProcess.inputStream.getText("UTF-8")
    int exit = gitStatusProcess.waitFor()
    return exit == 0 && !gitStatus.trim().isEmpty()
}

static String phase7RunIdentity(final List<File> resultDirectories, final File phase7Directory, final File root) {
    java.security.MessageDigest digest = java.security.MessageDigest.getInstance("SHA-256")
    resultDirectories.each { File resultDirectory ->
        phase7UpdateDigestWithFiles(digest, resultDirectory)
    }
    phase7UpdateDigestWithFiles(digest, phase7Directory)
    phase7UpdateDigest(digest, new File(root, "documentation/docs/reference/admin-api.md"))
    return phase7Hex(digest.digest())
}

static void phase7UpdateDigestWithFiles(final java.security.MessageDigest digest, final File directory) {
    if (!directory.isDirectory()) {
        phase7UpdateDigestText(digest, "missing:" + directory.name)
        return
    }
    List<File> files = phase7BoundedDigestFiles(directory, phase7MaxXmlFilesPerDirectory())
    if (files == null) {
        phase7UpdateDigestText(digest, "invalid:" + directory.name)
        return
    }
    files.each { File file -> phase7UpdateDigest(digest, file) }
}

static void phase7UpdateDigest(final java.security.MessageDigest digest, final File file) {
    phase7UpdateDigestText(digest, file.name)
    if (file.isFile()) {
        int maxBytes = file.name.endsWith(".out") ? phase7MaxDemoBytes() : phase7MaxXmlBytes()
        byte[] bytes = phase7ReadBoundedBytes(file, maxBytes)
        if (bytes == null) {
            phase7UpdateDigestText(digest, "invalid:" + file.name)
            return
        }
        digest.update(bytes)
    }
}

static void phase7UpdateDigestText(final java.security.MessageDigest digest, final String text) {
    digest.update(text.getBytes("UTF-8"))
}

static String phase7Hex(final byte[] bytes) {
    char[] alphabet = "0123456789abcdef".toCharArray()
    char[] chars = new char[bytes.length * 2]
    for (int index = 0; index < bytes.length; index++) {
        int value = bytes[index] & 0xff
        chars[index * 2] = alphabet[value >>> 4]
        chars[(index * 2) + 1] = alphabet[value & 0x0f]
    }
    return new String(chars)
}

static String phase7EvidenceMarkdown(final Map<String, Object> evidence) {
    List<String> lines = ["# Phase 7.0-7.11 Nugget Operations Evidence", ""]
    lines.addAll(phase7EvidenceMarkdownLines(evidence))
    lines.add("")
    if (evidence.categories?.phase711FinalAcceptance == "PASS") {
        lines.add("This evidence is deterministic final Phase 7.11 release acceptance output for the current clean tree.")
    } else {
        lines.add("This evidence is deterministic Phase 7.11 validation output for the current dirty tree. It is a non-release preview.")
    }
    lines.add("Script mode, remote transport, web/API adapter, browser authentication, and deep invocation drain gating remain deferred beyond Phase 7.")
    return lines.join("\n") + "\n"
}

static List<String> phase7EvidenceMarkdownLines(final Map<String, Object> evidence) {
    Map<String, Object> tests = evidence.tests as Map<String, Object>
    Map<String, Object> categories = evidence.categories as Map<String, Object>
    List<String> lines = [
            "- Format version: `${evidence.formatVersion}`",
            "- Scope: `${evidence.scope}`",
            "- Generated at: `${evidence.generatedAt}`",
            "- Current HEAD: `${evidence.currentHead}`",
            "- Current-run identity: `${evidence.currentRunIdentity}`",
            "- Test suites: `${tests.suites}`",
            "- Tests: `${tests.tests}`",
            "- Failures: `${tests.failures}`",
            "- Errors: `${tests.errors}`",
            "- Skipped: `${tests.skipped}`"
    ]
    categories.keySet().sort().each { String key ->
        lines.add("- ${key}: `${categories[key]}`")
    }
    lines.add("- Validation state: `${evidence.validationState}`")
    lines.add("- Dirty working tree: `${evidence.dirtyWorkingTree}`")
    lines.add("- Release state: `${evidence.releaseState}`")
    lines.add("- Release recommendation: `${evidence.releaseRecommendation}`")
    return lines
}

