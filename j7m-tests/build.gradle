tasks.register("generateCheckpoint4Evidence") {
    group = "verification"
    description = "Generates current-run Wave 2 Checkpoint 4 evidence from focused tests and demos."
    dependsOn tasks.named("checkpoint4ValidationTest")
    dependsOn tasks.named("checkpoint4WorkloadDemoEvidence")
    dependsOn tasks.named("checkpoint4StreamingDemoEvidence")
    outputs.file rootProject.layout.buildDirectory.file("reports/j7m/wave2-checkpoint4-evidence.json")
    outputs.file rootProject.layout.buildDirectory.file("reports/j7m/wave2-checkpoint4-evidence.md")
    outputs.upToDateWhen { false }
    doLast {
        File resultDirectory = layout.buildDirectory.dir("test-results/checkpoint4ValidationTest").get().asFile
        File checkpoint4Directory = rootProject.layout.buildDirectory.dir("reports/j7m/checkpoint4").get().asFile
        Map<String, Object> summary = checkpoint4EvidenceSummary(resultDirectory)
        Map<String, Object> suites = summary.suites as Map<String, Object>
        boolean junitPass = checkpoint4CountsPass(summary)
        boolean currentRunTasks = checkpoint4CurrentRunTaskEvidence(checkpoint4Directory)
        boolean demoPass = checkpoint4DemoOutputPass(checkpoint4Directory)
        Map<String, String> categories = [
                operatorGuidance: "GUIDANCE_ONLY",
                gradleTaskOutcomes: (currentRunTasks && junitPass && demoPass) ? "PASS" : "FAIL",
                junitEvidence: junitPass ? "PASS" : "FAIL",
                discoveryTrustEvidence: checkpoint4SuitePass(suites, "Phase2DiscoveryIntegrationTest") ? "PASS" : "FAIL",
                authorizationContextEvidence: checkpoint4SuitePass(suites, "Phase3SecurityIntegrationTest") ? "PASS" : "FAIL",
                deadlineCancellationEvidence: (checkpoint4SuitePass(suites, "Phase4WorkloadIntegrationTest")
                        && checkpoint4SuitePass(suites, "Phase41StreamingWorkloadFidelityTest")) ? "PASS" : "FAIL",
                hpRoutingEvidence: (checkpoint4SuitePass(suites, "Phase2DiscoveryIntegrationTest")
                        && checkpoint4SuitePass(suites, "Phase4WorkloadIntegrationTest")) ? "PASS" : "FAIL",
                streamingEvidence: (checkpoint4SuitePass(suites, "Phase41StreamingWorkloadFidelityTest")
                        && checkpoint4SuitePass(suites, "Phase4WorkloadIntegrationTest")) ? "PASS" : "FAIL",
                demoEvidence: demoPass ? "PASS" : "FAIL",
                staticArchitecturePolicy: checkpoint4SuitePass(suites, "ArchitectureBoundaryTest") ? "PASS" : "FAIL"
        ]
        Process gitStatusProcess = new ProcessBuilder("git", "status", "--short")
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        String gitStatus = gitStatusProcess.inputStream.getText("UTF-8")
        int gitStatusExit = gitStatusProcess.waitFor()
        boolean dirtyTree = gitStatusExit == 0 && !gitStatus.trim().isEmpty()
        List<String> executableCategories = categories.findAll { String key, String value -> key != "operatorGuidance" }.values().toList()
        boolean allCategoriesPass = executableCategories.every { String value -> value == "PASS" }
        String validationState = allCategoriesPass ? "PASS" : "FAIL"
        Map<String, Object> evidence = [
                scope: "Wave 2 Checkpoint 4 focused evidence",
                validationTask: ":j7m-tests:checkpoint4ValidationTest",
                demoTasks: [
                        ":j7m-tests:checkpoint4WorkloadDemoEvidence",
                        ":j7m-tests:checkpoint4StreamingDemoEvidence"
                ],
                tests: summary.counts,
                categories: categories,
                validationState: validationState,
                dirtyWorkingTree: dirtyTree,
                releaseState: dirtyTree ? "NON_RELEASE_DIRTY_TREE" : "NON_RELEASE_CLEAN_TREE",
                releaseRecommendation: "DO_NOT_RELEASE_FROM_CHECKPOINT4_FOCUSED_EVIDENCE"
        ]
        File jsonOutput = rootProject.layout.buildDirectory.file("reports/j7m/wave2-checkpoint4-evidence.json").get().asFile
        File markdownOutput = rootProject.layout.buildDirectory.file("reports/j7m/wave2-checkpoint4-evidence.md").get().asFile
        jsonOutput.parentFile.mkdirs()
        jsonOutput.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(evidence)) + "\n"
        markdownOutput.text = checkpoint4EvidenceMarkdown(evidence)
    }
}

tasks.register("validateCheckpoint4Evidence") {
    group = "verification"
    description = "Validates Wave 2 Checkpoint 4 focused evidence without issuing a release seal."
    dependsOn tasks.named("generateCheckpoint4Evidence")
    outputs.upToDateWhen { false }
    doLast {
        File evidenceFile = rootProject.layout.buildDirectory.file("reports/j7m/wave2-checkpoint4-evidence.json").get().asFile
        File markdownFile = rootProject.layout.buildDirectory.file("reports/j7m/wave2-checkpoint4-evidence.md").get().asFile
        Map<String, Object> evidence = new groovy.json.JsonSlurper().parse(evidenceFile) as Map<String, Object>
        String markdown = markdownFile.getText("UTF-8")
        if (evidence.validationState != "PASS") {
            throw new GradleException("Checkpoint 4 focused evidence is not passing: ${evidence.validationState}")
        }
        if (!evidence.releaseState.toString().startsWith("NON_RELEASE_")) {
            throw new GradleException("Checkpoint 4 focused evidence must not issue a release seal")
        }
        if (evidence.releaseRecommendation != "DO_NOT_RELEASE_FROM_CHECKPOINT4_FOCUSED_EVIDENCE") {
            throw new GradleException("Checkpoint 4 focused evidence must keep a non-release recommendation")
        }
        checkpoint4EvidenceMarkdownLines(evidence).each { String line ->
            if (!markdown.contains(line)) {
                throw new GradleException("Checkpoint 4 Markdown evidence does not match JSON evidence for line: ${line}")
            }
        }
        String rootPath = rootProject.projectDir.absolutePath
        if (evidenceFile.getText("UTF-8").contains(rootPath) || markdown.contains(rootPath)) {
            throw new GradleException("Checkpoint 4 evidence must not contain absolute workspace paths")
        }
    }
}

