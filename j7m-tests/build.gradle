tasks.register("generatePhase7AcceptanceReport") {
    group = "verification"
    description = "Generates deterministic Phase 7.0-7.11 nugget operations final acceptance evidence from tests, demos, and validators."
    dependsOn tasks.named("validateNuggetOperations")
    dependsOn tasks.named("phase7NuggetAdminDemoEvidence")
    dependsOn tasks.named("phase7NuggetCliDemoEvidence")
    dependsOn tasks.named("phase7NuggetCliApplicationLifecycleDemoEvidence")
    dependsOn tasks.named("phase7NuggetPinFailureDemoEvidence")
    dependsOn tasks.named("phase7NuggetCliKillDisabledDemoEvidence")
    outputs.file rootProject.layout.buildDirectory.file("reports/j7m/phase7/phase-7-acceptance.json")
    outputs.file rootProject.layout.buildDirectory.file("reports/j7m/phase7/phase-7-acceptance.md")
    outputs.upToDateWhen { false }
    doLast {
        File phase7Directory = rootProject.layout.buildDirectory.dir("reports/j7m/phase7").get().asFile
        Map<String, Object> summary = phase7EvidenceSummary(phase7ResultDirectories(project, rootProject))
        Map<String, Object> suites = summary.suites as Map<String, Object>
        boolean requiredSuitesPass = phase7RequiredSuitesPass(summary, phase7RequiredSuites())
        boolean demoPass = phase7DemoOutputPass(phase7Directory)
        boolean documentationPass = phase7DocumentationPass(rootProject.projectDir)
        boolean dirtyTree = phase7DirtyWorkingTree(rootProject.projectDir)
        Map<String, String> categories = phase7AcceptanceCategories(
                suites,
                requiredSuitesPass,
                demoPass,
                documentationPass,
                dirtyTree)
        boolean executablePass = phase7ExecutableCategoriesPass(categories)
        String validationState = executablePass ? "PASS" : "FAIL"
        Map<String, Object> evidence = [
                formatVersion: "j7m-phase7-evidence-v8",
                scope: "Phase 7.0-7.11 nugget operations final acceptance evidence",
                generatedAt: java.time.Instant.now().toString(),
                currentHead: w7RunGit(rootProject.projectDir, ["rev-parse", "HEAD"]),
                validationTasks: [
                        ":j7m-tests:validateNuggetAdmin",
                        ":j7m-tests:validateNuggetSecurity",
                        ":j7m-tests:validateNuggetDiscovery",
                        ":j7m-tests:validateNuggetIntrospectionRedaction",
                        ":j7m-tests:validateNuggetInspection",
                        ":j7m-tests:validateNuggetApplicationLifecycle",
                        ":j7m-tests:validateNuggetShutdownControls",
                        ":j7m-tests:validateNuggetAdminApiContract",
                        ":j7m-deployer-cli:validateJ7mCliConsole",
                        ":j7m-tests:validateNuggetPublicApiBoundary",
                        ":j7m-tests:validateNuggetNoSkippedTests",
                        ":validateNuggetExamples",
                        ":validateNuggetDocs",
                        ":j7m-tests:validateNuggetOperations"
                ],
                demoTasks: [
                        ":j7m-demo:runNuggetAdminDemo",
                        ":j7m-demo:runNuggetCliDemo",
                        ":j7m-demo:runNuggetCliApplicationLifecycleDemo",
                        ":j7m-demo:runNuggetCliKillDisabledDemo",
                        ":j7m-demo:runNuggetCliPinFailureDemo"
                ],
                evidenceDemoTasks: [
                        ":j7m-tests:phase7NuggetAdminDemoEvidence",
                        ":j7m-tests:phase7NuggetCliDemoEvidence",
                        ":j7m-tests:phase7NuggetCliApplicationLifecycleDemoEvidence",
                        ":j7m-tests:phase7NuggetCliKillDisabledDemoEvidence",
                        ":j7m-tests:phase7NuggetPinFailureDemoEvidence"
                ],
                tests: summary.counts,
                requiredSuites: phase7RequiredSuites(),
                categories: categories,
                validationState: validationState,
                dirtyWorkingTree: dirtyTree,
                releaseState: dirtyTree
                        ? "TECHNICAL_PASS_DIRTY_TREE_RELEASE_SEAL_REQUIRES_OWNER_COMMIT"
                        : "PHASE7_RELEASE_ACCEPTED",
                releaseRecommendation: dirtyTree
                        ? "DO_NOT_RELEASE_FROM_UNCOMMITTED_CURRENT_RUN_EVIDENCE"
                        : "ACCEPT_PHASE7_RELEASE"
        ]
        evidence.currentRunIdentity = phase7CurrentRunIdentity(evidence)
        File jsonOutput = rootProject.layout.buildDirectory.file("reports/j7m/phase7/phase-7-acceptance.json").get().asFile
        File markdownOutput = rootProject.layout.buildDirectory.file("reports/j7m/phase7/phase-7-acceptance.md").get().asFile
        jsonOutput.parentFile.mkdirs()
        jsonOutput.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(evidence)) + "\n"
        markdownOutput.text = phase7EvidenceMarkdown(evidence)
    }
}

tasks.register("validateGeneratedPhase7Acceptance") {
    group = "verification"
    description = "Validates existing deterministic Phase 7.0-7.11 nugget operations final acceptance evidence without regenerating it."
    outputs.upToDateWhen { false }
    doLast {
        File evidenceFile = rootProject.layout.buildDirectory.file("reports/j7m/phase7/phase-7-acceptance.json").get().asFile
        File markdownFile = rootProject.layout.buildDirectory.file("reports/j7m/phase7/phase-7-acceptance.md").get().asFile
        if (!evidenceFile.isFile() || !markdownFile.isFile()) {
            throw new GradleException("Phase 7 evidence is missing; run generatePhase7AcceptanceReport once before validation-only checks")
        }
        Map<String, Object> evidence = new groovy.json.JsonSlurper().parse(evidenceFile) as Map<String, Object>
        String markdown = markdownFile.getText("UTF-8")
        File phase7Directory = rootProject.layout.buildDirectory.dir("reports/j7m/phase7").get().asFile
        Map<String, Object> currentSummary = phase7EvidenceSummary(phase7ResultDirectories(project, rootProject))
        Map<String, Object> currentSuites = currentSummary.suites as Map<String, Object>
        boolean currentRequiredSuitesPass = phase7RequiredSuitesPass(currentSummary, phase7RequiredSuites())
        boolean currentDemoPass = phase7DemoOutputPass(phase7Directory)
        boolean currentDocumentationPass = phase7DocumentationPass(rootProject.projectDir)
        boolean currentDirtyTree = phase7DirtyWorkingTree(rootProject.projectDir)
        Map<String, String> currentCategories = phase7AcceptanceCategories(
                currentSuites,
                currentRequiredSuitesPass,
                currentDemoPass,
                currentDocumentationPass,
                currentDirtyTree)
        List<String> semanticProblems = phase7CurrentSemanticProblems(
                evidence,
                currentSummary,
                currentCategories,
                w7RunGit(rootProject.projectDir, ["rev-parse", "HEAD"]),
                currentDirtyTree)
        if (!semanticProblems.isEmpty()) {
            throw new GradleException("Phase 7 evidence semantic facts are stale or contradictory: ${semanticProblems}")
        }
        if (evidence.currentRunIdentity != phase7CurrentRunIdentity(evidence)) {
            throw new GradleException("Phase 7 evidence current-run identity does not match report contents")
        }
        String identityLine = "- Current-run identity: `${evidence.currentRunIdentity}`"
        if (!markdown.contains(identityLine)) {
            throw new GradleException("Phase 7 Markdown current-run identity does not match JSON evidence")
        }
        if (!phase7CurrentRunIdentitySelfCheck()) {
            throw new GradleException("Phase 7 current-run identity stability self-check failed")
        }
        if (!phase7CurrentSemanticSelfCheck()) {
            throw new GradleException("Phase 7 current semantic evidence self-check failed")
        }
        phase7EvidenceMarkdownLines(evidence).each { String line ->
            if (!markdown.contains(line)) {
                throw new GradleException("Phase 7 Markdown evidence does not match JSON evidence for line: ${line}")
            }
        }
        String rootPath = rootProject.projectDir.absolutePath
        if (evidenceFile.getText("UTF-8").contains(rootPath) || markdown.contains(rootPath)) {
            throw new GradleException("Phase 7 evidence must not contain absolute workspace paths")
        }
        if (!phase7DocumentationPass(rootProject.projectDir)) {
            throw new GradleException("Phase 7 documentation consistency validation failed")
        }
        if (!phase7ReportEvidencePass(rootProject.projectDir, evidence)) {
            throw new GradleException("Phase 7 Markdown report does not exactly match current generated JSON evidence")
        }
        if (!phase7LedgerMismatchSelfCheck()) {
            throw new GradleException("Phase 7 ledger/evidence mismatch self-check did not fail closed")
        }
        File scratchRoot = rootProject.layout.buildDirectory.dir("tmp/phase7").get().asFile
        if (!phase7MalformedSuiteSelfCheck(scratchRoot)) {
            throw new GradleException("Phase 7 malformed JUnit XML self-check did not fail closed")
        }
    }
}

