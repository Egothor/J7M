static Map<String, Object> phase7EvidenceSummary(final List<File> resultDirectories) {
    Map<String, Integer> counts = [tests: 0, failures: 0, errors: 0, skipped: 0, suites: 0]
    Map<String, Object> suites = [:]
    boolean malformed = false
    resultDirectories.each { File resultDirectory ->
        if (!resultDirectory.isDirectory()) {
            malformed = true
            return
        }
        List<File> xmlFiles = phase7BoundedEvidenceFiles(resultDirectory, ".xml", phase7MaxXmlFilesPerDirectory())
        if (xmlFiles == null) {
            malformed = true
            return
        }
        if (xmlFiles.isEmpty()) {
            malformed = true
        }
        xmlFiles.each { File xml ->
            String text = phase7ReadBoundedText(xml, phase7MaxXmlBytes())
            if (text == null) {
                malformed = true
                return
            }
            java.util.regex.Matcher suiteMatcher = java.util.regex.Pattern
                    .compile("<testsuite\\s+([^>]*)>")
                    .matcher(text)
            if (!suiteMatcher.find()) {
                malformed = true
                return
            }
            String attributes = suiteMatcher.group(1)
            String name = xmlStringAttribute(attributes, "name")
            Integer testsValue = phase7XmlRequiredIntAttribute(attributes, "tests")
            Integer failuresValue = phase7XmlRequiredIntAttribute(attributes, "failures")
            Integer errorsValue = phase7XmlRequiredIntAttribute(attributes, "errors")
            Integer skippedValue = phase7XmlRequiredIntAttribute(attributes, "skipped")
            if (name.isBlank() || testsValue == null || failuresValue == null
                    || errorsValue == null || skippedValue == null) {
                malformed = true
            } else if (testsValue <= 0 || failuresValue < 0 || errorsValue < 0 || skippedValue < 0) {
                malformed = true
            } else {
                int tests = testsValue
                int failures = failuresValue
                int errors = errorsValue
                int skipped = skippedValue
                counts.tests = counts.tests + tests
                counts.failures = counts.failures + failures
                counts.errors = counts.errors + errors
                counts.skipped = counts.skipped + skipped
                counts.suites = counts.suites + 1
                suites[name] = [
                        tests: tests,
                        failures: failures,
                        errors: errors,
                        skipped: skipped,
                        pass: tests > 0 && failures == 0 && errors == 0 && skipped == 0
                ]
            }
        }
    }
    return [counts: counts, suites: suites, malformed: malformed]
}

static Integer phase7XmlRequiredIntAttribute(final String attributes, final String name) {
    java.util.regex.Matcher matcher = java.util.regex.Pattern
            .compile(name + "=\"(\\d+)\"")
            .matcher(attributes)
    return matcher.find() ? Integer.valueOf(matcher.group(1)) : null
}

static List<File> phase7BoundedEvidenceFiles(final File directory, final String suffix, final int maxFiles) {
    List<File> files = []
    try (java.nio.file.DirectoryStream<java.nio.file.Path> stream =
                 java.nio.file.Files.newDirectoryStream(directory.toPath())) {
        Iterator<java.nio.file.Path> iterator = stream.iterator()
        while (iterator.hasNext()) {
            java.nio.file.Path path = iterator.next()
            File file = path.toFile()
            if (file.isFile() && file.name.startsWith("TEST-") && file.name.endsWith(suffix)) {
                files.add(file)
                if (files.size() > maxFiles) {
                    return null
                }
            }
        }
    } catch (IOException exception) {
        return null
    }
    files.sort { File file -> file.name }
    return files
}

static List<File> phase7BoundedDigestFiles(final File directory, final int maxFiles) {
    List<File> files = []
    try (java.nio.file.DirectoryStream<java.nio.file.Path> stream =
                 java.nio.file.Files.newDirectoryStream(directory.toPath())) {
        Iterator<java.nio.file.Path> iterator = stream.iterator()
        while (iterator.hasNext()) {
            java.nio.file.Path path = iterator.next()
            File file = path.toFile()
            if (file.isFile() && (file.name.endsWith(".xml") || file.name.endsWith(".out"))) {
                files.add(file)
                if (files.size() > maxFiles) {
                    return null
                }
            }
        }
    } catch (IOException exception) {
        return null
    }
    files.sort { File file -> file.name }
    return files
}

static String phase7ReadBoundedText(final File file, final int maxBytes) {
    byte[] bytes = phase7ReadBoundedBytes(file, maxBytes)
    return bytes == null ? null : new String(bytes, "UTF-8")
}

static byte[] phase7ReadBoundedBytes(final File file, final int maxBytes) {
    if (!file.isFile()) {
        return null
    }
    java.io.ByteArrayOutputStream output = new java.io.ByteArrayOutputStream(Math.min(maxBytes, 8192))
    byte[] buffer = new byte[8192]
    int total = 0
    try (java.io.InputStream input = new java.io.BufferedInputStream(new java.io.FileInputStream(file))) {
        int read = input.read(buffer)
        while (read >= 0) {
            total += read
            if (total > maxBytes) {
                return null
            }
            output.write(buffer, 0, read)
            read = input.read(buffer)
        }
    } catch (IOException exception) {
        return null
    }
    return output.toByteArray()
}

