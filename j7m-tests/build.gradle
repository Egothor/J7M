tasks.register("generatePhase1Evidence") {
    group = "verification"
    description = "Generates current-run Phase 1 validation evidence from the focused Phase 1 test slice."
    dependsOn tasks.named("phase1RuntimeValidationTest")
    outputs.file rootProject.layout.buildDirectory.file("reports/j7m/phase-1-evidence.json")
    outputs.file rootProject.layout.buildDirectory.file("reports/j7m/phase-1-evidence.md")
    outputs.upToDateWhen { false }
    doLast {
        File resultDirectory = layout.buildDirectory.dir("test-results/phase1RuntimeValidationTest").get().asFile
        Map<String, Integer> counts = [tests: 0, failures: 0, errors: 0, skipped: 0, suites: 0]
        List<Map<String, Object>> junitArtifacts = []
        if (resultDirectory.exists()) {
            List<File> xmlFiles = fileTree(resultDirectory) {
                include "TEST-*.xml"
            }.files.toList().sort { File file -> file.name }
            xmlFiles.each { File xml ->
                junitArtifacts.add(w7EvidenceFileArtifact(rootProject.projectDir, xml))
                String text = xml.getText("UTF-8")
                java.util.regex.Matcher suiteMatcher = java.util.regex.Pattern
                        .compile("<testsuite\\s+([^>]*)>")
                        .matcher(text)
                if (suiteMatcher.find()) {
                    String attributes = suiteMatcher.group(1)
                    counts.tests = counts.tests + xmlIntAttribute(attributes, "tests")
                    counts.failures = counts.failures + xmlIntAttribute(attributes, "failures")
                    counts.errors = counts.errors + xmlIntAttribute(attributes, "errors")
                    counts.skipped = counts.skipped + xmlIntAttribute(attributes, "skipped")
                    counts.suites = counts.suites + 1
                }
            }
        }
        Process gitStatusProcess = new ProcessBuilder("git", "status", "--short")
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        String gitStatus = gitStatusProcess.inputStream.getText("UTF-8")
        gitStatusProcess.waitFor()
        boolean dirtyTree = !gitStatus.trim().isEmpty()
        String currentHead = w7RunGit(rootProject.projectDir, ["rev-parse", "HEAD"])
        String validationState = counts.suites > 0 && counts.failures == 0 && counts.errors == 0 && counts.skipped == 0 ? "PASS" : "FAIL"
        Map<String, Object> evidence = [
                formatVersion: "j7m-phase1-evidence-v2",
                scope: "Phase 1 focused runtime evidence",
                generatedAt: java.time.Instant.now().toString(),
                currentHead: currentHead,
                validationTask: ":j7m-tests:phase1RuntimeValidationTest",
                tests: counts,
                junitArtifacts: junitArtifacts,
                validationState: validationState,
                dirtyWorkingTree: dirtyTree,
                releaseState: dirtyTree ? "NON_RELEASE_DIRTY_TREE" : "NON_RELEASE_CLEAN_TREE",
                releaseRecommendation: "DO_NOT_RELEASE_FROM_FOCUSED_PHASE1_EVIDENCE"
        ]
        evidence.currentRunIdentity = w7MapIdentity(evidence)
        File jsonOutput = rootProject.layout.buildDirectory.file("reports/j7m/phase-1-evidence.json").get().asFile
        File markdownOutput = rootProject.layout.buildDirectory.file("reports/j7m/phase-1-evidence.md").get().asFile
        jsonOutput.parentFile.mkdirs()
        jsonOutput.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(evidence)) + "\n"
        markdownOutput.text = phase1EvidenceMarkdown(evidence)
    }
}

tasks.register("validatePhase1Evidence") {
    group = "verification"
    description = "Validates the generated focused Phase 1 current-run evidence without issuing a release seal."
    dependsOn tasks.named("generatePhase1Evidence")
    outputs.upToDateWhen { false }
    doLast {
        File evidenceFile = rootProject.layout.buildDirectory.file("reports/j7m/phase-1-evidence.json").get().asFile
        File markdownFile = rootProject.layout.buildDirectory.file("reports/j7m/phase-1-evidence.md").get().asFile
        Map<String, Object> evidence = new groovy.json.JsonSlurper().parse(evidenceFile) as Map<String, Object>
        String markdown = markdownFile.getText("UTF-8")
        if (evidence.validationState != "PASS") {
            throw new GradleException("Phase 1 focused validation evidence is not passing: ${evidence.validationState}")
        }
        if (!evidence.releaseState.toString().startsWith("NON_RELEASE_")) {
            throw new GradleException("Phase 1 focused evidence must not issue a release seal")
        }
        if (evidence.releaseRecommendation != "DO_NOT_RELEASE_FROM_FOCUSED_PHASE1_EVIDENCE") {
            throw new GradleException("Phase 1 focused evidence must keep a non-release recommendation")
        }
        if (evidence.formatVersion != "j7m-phase1-evidence-v2") {
            throw new GradleException("Phase 1 evidence format is stale: ${evidence.formatVersion}")
        }
        if (evidence.currentHead != w7RunGit(rootProject.projectDir, ["rev-parse", "HEAD"])) {
            throw new GradleException("Phase 1 evidence was generated for a stale HEAD")
        }
        if (evidence.currentRunIdentity != w7MapIdentity(evidence.findAll { Map.Entry<String, Object> entry ->
            entry.key != "currentRunIdentity"
        } as Map<String, Object>)) {
            throw new GradleException("Phase 1 evidence current-run identity does not match report contents")
        }
        List<Map<String, Object>> artifactProblems = w7ValidateArtifacts(rootProject.projectDir, evidence.junitArtifacts as List<Object>)
        if (!artifactProblems.isEmpty()) {
            throw new GradleException("Phase 1 JUnit XML evidence is stale or missing: ${artifactProblems}")
        }
        List<String> expectedLines = phase1EvidenceMarkdownLines(evidence)
        expectedLines.each { String line ->
            if (!markdown.contains(line)) {
                throw new GradleException("Phase 1 Markdown evidence does not match JSON evidence for line: ${line}")
            }
        }
        String rootPath = rootProject.projectDir.absolutePath
        if (evidenceFile.getText("UTF-8").contains(rootPath) || markdown.contains(rootPath)) {
            throw new GradleException("Phase 1 evidence must not contain absolute workspace paths")
        }
    }
}

static int xmlIntAttribute(final String attributes, final String name) {
    java.util.regex.Matcher matcher = java.util.regex.Pattern
            .compile(name + "=\"(\\d+)\"")
            .matcher(attributes)
    return matcher.find() ? Integer.parseInt(matcher.group(1)) : 0
}

static String phase1EvidenceMarkdown(final Map<String, Object> evidence) {
    List<String> lines = ["# Phase 1 Focused Evidence", ""]
    lines.addAll(phase1EvidenceMarkdownLines(evidence))
    lines.add("")
    lines.add("This focused evidence is deterministic current-run validation output. It is not a release seal.")
    return lines.join("\n") + "\n"
}

static List<String> phase1EvidenceMarkdownLines(final Map<String, Object> evidence) {
    Map<String, Object> tests = evidence.tests as Map<String, Object>
    return [
            "- Format version: `${evidence.formatVersion}`",
            "- Scope: `${evidence.scope}`",
            "- Generated at: `${evidence.generatedAt}`",
            "- Current HEAD: `${evidence.currentHead}`",
            "- Current-run identity: `${evidence.currentRunIdentity}`",
            "- Validation task: `${evidence.validationTask}`",
            "- Test suites: `${tests.suites}`",
            "- Tests: `${tests.tests}`",
            "- Failures: `${tests.failures}`",
            "- Errors: `${tests.errors}`",
            "- Skipped: `${tests.skipped}`",
            "- JUnit artifacts: `${(evidence.junitArtifacts as List<Object>).size()}`",
            "- Validation state: `${evidence.validationState}`",
            "- Dirty working tree: `${evidence.dirtyWorkingTree}`",
            "- Release state: `${evidence.releaseState}`",
            "- Release recommendation: `${evidence.releaseRecommendation}`"
    ]
}

static String w7RunGit(final File root, final List<String> args) {
    List<String> command = ["git"]
    command.addAll(args)
    Process process = new ProcessBuilder(command)
            .directory(root)
            .redirectErrorStream(true)
            .start()
    String output = process.inputStream.getText("UTF-8")
    int exit = process.waitFor()
    return exit == 0 ? output.trim() : "unavailable"
}

static Map<String, Object> w7EvidenceFileArtifact(final File root, final File file) {
    return [
            path: root.toPath().relativize(file.toPath()).toString().replace('\\', '/'),
            sizeBytes: file.length(),
            sha256: w7FileSha256(file)
    ]
}

static List<Map<String, Object>> w7ValidateArtifacts(final File root, final List<Object> artifacts) {
    List<Map<String, Object>> problems = []
    if (artifacts == null || artifacts.isEmpty()) {
        problems.add([path: "", problem: "missing-artifacts"])
        return problems
    }
    artifacts.each { Object artifact ->
        Map<String, Object> row = artifact as Map<String, Object>
        String relative = row.path as String
        File file = new File(root, relative)
        if (!file.isFile()) {
            problems.add([path: relative, problem: "missing"])
        } else if (file.length() != (row.sizeBytes as Number).longValue()) {
            problems.add([path: relative, problem: "size-mismatch"])
        } else {
            String digest = w7FileSha256(file)
            if (digest != row.sha256) {
                problems.add([path: relative, problem: "digest-mismatch"])
            }
        }
    }
    return problems
}

static List<Map<String, Object>> w7EvidenceArtifacts(final File root, final List<File> directories, final String suffix) {
    List<Map<String, Object>> artifacts = []
    directories.each { File directory ->
        if (directory.isDirectory()) {
            directory.listFiles()
                    ?.findAll { File file -> file.isFile() && file.name.endsWith(suffix) }
                    ?.sort { File file -> file.name }
                    ?.each { File file -> artifacts.add(w7EvidenceFileArtifact(root, file)) }
        }
    }
    return artifacts
}

static String w7MapIdentity(final Map<String, Object> evidence) {
    return w7Sha256(groovy.json.JsonOutput.toJson(evidence).getBytes("UTF-8"))
}

static Map<String, Object> phase7StableIdentityInput(final Map<String, Object> evidence) {
    return [
            formatVersion: evidence.formatVersion,
            scope: evidence.scope,
            currentHead: evidence.currentHead,
            validationTasks: evidence.validationTasks,
            demoTasks: evidence.demoTasks,
            evidenceDemoTasks: evidence.evidenceDemoTasks,
            tests: evidence.tests,
            requiredSuites: evidence.requiredSuites,
            categories: evidence.categories,
            validationState: evidence.validationState,
            dirtyWorkingTree: evidence.dirtyWorkingTree,
            releaseState: evidence.releaseState,
            releaseRecommendation: evidence.releaseRecommendation
    ]
}

static String phase7CurrentRunIdentity(final Map<String, Object> evidence) {
    return w7MapIdentity(phase7StableIdentityInput(evidence))
}

static boolean phase7CurrentRunIdentitySelfCheck() {
    Map<String, Object> first = [
            formatVersion: "j7m-phase7-evidence-v8",
            scope: "Phase 7.0-7.11 nugget operations final acceptance evidence",
            generatedAt: "2026-01-01T00:00:00Z",
            currentHead: "head-a",
            validationTasks: [":j7m-tests:validateNuggetOperations"],
            demoTasks: [":j7m-demo:runNuggetAdminDemo"],
            evidenceDemoTasks: [":j7m-tests:phase7NuggetAdminDemoEvidence"],
            tests: [tests: 10, failures: 0, errors: 0, skipped: 0],
            requiredSuites: ["NuggetAdminStartupTest"],
            categories: [phase711FinalAcceptance: "NOT_RELEASE_READY_DIRTY_TREE"],
            validationState: "PASS",
            dirtyWorkingTree: true,
            releaseState: "TECHNICAL_PASS_DIRTY_TREE_RELEASE_SEAL_REQUIRES_OWNER_COMMIT",
            releaseRecommendation: "DO_NOT_RELEASE_FROM_UNCOMMITTED_CURRENT_RUN_EVIDENCE",
            junitArtifacts: [[path: "build/test-results/old.xml", sizeBytes: 1L, sha256: "old"]],
            demoArtifacts: [[path: "build/reports/old.out", sizeBytes: 1L, sha256: "old"]]
    ]
    Map<String, Object> second = new LinkedHashMap<>(first)
    second.generatedAt = "2026-01-01T00:00:01Z"
    second.currentRunIdentity = "ignored"
    second.junitArtifacts = [[path: "build/test-results/rewritten.xml", sizeBytes: 2L, sha256: "rewritten"]]
    second.demoArtifacts = [[path: "build/reports/rewritten.out", sizeBytes: 2L, sha256: "rewritten"]]
    Map<String, Object> changedStableField = new LinkedHashMap<>(first)
    changedStableField.tests = [tests: 11, failures: 0, errors: 0, skipped: 0]
    Map<String, Object> changedScope = new LinkedHashMap<>(first)
    changedScope.scope = "Phase 7.0-7.9 nugget operations current-run evidence"
    Map<String, Object> changedFinalState = new LinkedHashMap<>(first)
    changedFinalState.categories = [phase711FinalAcceptance: "PASS"]
    return phase7CurrentRunIdentity(first) == phase7CurrentRunIdentity(second)
            && phase7CurrentRunIdentity(first) != phase7CurrentRunIdentity(changedStableField)
            && phase7CurrentRunIdentity(first) != phase7CurrentRunIdentity(changedScope)
            && phase7CurrentRunIdentity(first) != phase7CurrentRunIdentity(changedFinalState)
}

static String w7FileSha256(final File file) {
    java.security.MessageDigest digest = java.security.MessageDigest.getInstance("SHA-256")
    byte[] buffer = new byte[8192]
    try (java.io.InputStream input = new java.io.BufferedInputStream(new java.io.FileInputStream(file))) {
        int read = input.read(buffer)
        while (read >= 0) {
            digest.update(buffer, 0, read)
            read = input.read(buffer)
        }
    }
    return w7Hex(digest.digest())
}

static String w7Sha256(final byte[] bytes) {
    java.security.MessageDigest digest = java.security.MessageDigest.getInstance("SHA-256")
    digest.update(bytes)
    return w7Hex(digest.digest())
}

static String w7Hex(final byte[] bytes) {
    char[] alphabet = "0123456789abcdef".toCharArray()
    char[] chars = new char[bytes.length * 2]
    for (int index = 0; index < bytes.length; index++) {
        int value = bytes[index] & 0xff
        chars[index * 2] = alphabet[value >>> 4]
        chars[(index * 2) + 1] = alphabet[value & 0x0f]
    }
    return new String(chars)
}

static Map<String, Object> checkpoint4EvidenceSummary(final File resultDirectory) {
    Map<String, Integer> counts = [tests: 0, failures: 0, errors: 0, skipped: 0, suites: 0]
    Map<String, Object> suites = [:]
    boolean malformed = false
    if (!resultDirectory.exists()) {
        return [counts: counts, suites: suites, malformed: true]
    }
    List<File> xmlFiles = resultDirectory.listFiles()
            ?.findAll { File file -> file.name.startsWith("TEST-") && file.name.endsWith(".xml") }
            ?.sort { File file -> file.name } ?: []
    if (xmlFiles.isEmpty()) {
        return [counts: counts, suites: suites, malformed: true]
    }
    xmlFiles.each { File xml ->
        String text = xml.getText("UTF-8")
        java.util.regex.Matcher suiteMatcher = java.util.regex.Pattern
                .compile("<testsuite\\s+([^>]*)>")
                .matcher(text)
        if (!suiteMatcher.find()) {
            malformed = true
            return
        }
        String attributes = suiteMatcher.group(1)
        String name = xmlStringAttribute(attributes, "name")
        int tests = xmlIntAttribute(attributes, "tests")
        int failures = xmlIntAttribute(attributes, "failures")
        int errors = xmlIntAttribute(attributes, "errors")
        int skipped = xmlIntAttribute(attributes, "skipped")
        if (name.isBlank() || tests <= 0 || failures < 0 || errors < 0 || skipped < 0) {
            malformed = true
        }
        counts.tests = counts.tests + tests
        counts.failures = counts.failures + failures
        counts.errors = counts.errors + errors
        counts.skipped = counts.skipped + skipped
        counts.suites = counts.suites + 1
        suites[name] = [
                tests: tests,
                failures: failures,
                errors: errors,
                skipped: skipped,
                pass: tests > 0 && failures == 0 && errors == 0 && skipped == 0
        ]
    }
    return [counts: counts, suites: suites, malformed: malformed]
}

