tasks.register("generateWave7FinalAssuranceEvidence") {
    group = "verification"
    description = "Generates authoritative Wave 7 cross-phase final-assurance evidence from current Phase 1, Phase 5, Wave 5, Phase 6, and Phase 7 reports."
    dependsOn tasks.named("validatePhase1Evidence")
    dependsOn ":validateApplicationPlatform"
    dependsOn ":validateSovereignReliability"
    dependsOn tasks.named("validatePhase7Acceptance")
    outputs.file rootProject.layout.buildDirectory.file("reports/j7m/wave7/wave7-final-assurance.json")
    outputs.file rootProject.layout.buildDirectory.file("reports/j7m/wave7/wave7-final-assurance.md")
    outputs.upToDateWhen { false }
    doLast {
        String currentHead = w7RunGit(rootProject.projectDir, ["rev-parse", "HEAD"])
        boolean dirtyTree = phase7DirtyWorkingTree(rootProject.projectDir)
        List<Map<String, Object>> subordinates = [
                w7SubordinateEvidence("phase1", rootProject.projectDir,
                        rootProject.layout.buildDirectory.file("reports/j7m/phase-1-evidence.json").get().asFile,
                        rootProject.layout.buildDirectory.file("reports/j7m/phase-1-evidence.md").get().asFile,
                        currentHead),
                w7SubordinateEvidence("phase5", rootProject.projectDir,
                        rootProject.layout.buildDirectory.file("reports/j7m/application-platform-acceptance.json").get().asFile,
                        rootProject.layout.buildDirectory.file("reports/j7m/application-platform-acceptance.md").get().asFile,
                        currentHead),
                w7SubordinateEvidence("wave5", rootProject.projectDir,
                        rootProject.layout.buildDirectory.file("reports/j7m/wave5-phase6-evidence.json").get().asFile,
                        rootProject.layout.buildDirectory.file("reports/j7m/wave5-phase6-evidence.md").get().asFile,
                        currentHead),
                w7SubordinateEvidence("phase6", rootProject.projectDir,
                        rootProject.layout.buildDirectory.file("reports/j7m/phase-6-acceptance-report.json").get().asFile,
                        rootProject.layout.buildDirectory.file("reports/j7m/phase-6-acceptance-report.md").get().asFile,
                        currentHead),
                w7SubordinateEvidence("phase7", rootProject.projectDir,
                        rootProject.layout.buildDirectory.file("reports/j7m/phase7/phase-7-acceptance.json").get().asFile,
                        rootProject.layout.buildDirectory.file("reports/j7m/phase7/phase-7-acceptance.md").get().asFile,
                        currentHead)
        ]
        boolean allPass = subordinates.every { Map<String, Object> row -> row.status == "PASS" }
        Map<String, Object> evidence = [
                formatVersion: "j7m-wave7-final-assurance-v1",
                generatedAt: java.time.Instant.now().toString(),
                currentHead: currentHead,
                dirtyWorkingTree: dirtyTree,
                technicalStatus: w7FinalTechnicalStatus(allPass),
                releaseVerdict: w7FinalReleaseVerdict(allPass, dirtyTree),
                validationTasks: [
                        ":j7m-tests:validatePhase1Evidence",
                        ":validateApplicationPlatform",
                        ":validateSovereignReliability",
                        ":j7m-tests:validatePhase7Acceptance",
                        ":j7m-tests:validateWave7FinalAssuranceEvidence"
                ],
                subordinateEvidence: subordinates,
                blockers: subordinates.collectMany { Map<String, Object> row -> row.blockers as List<Object> },
                releaseRecommendation: allPass && !dirtyTree ? "OWNER_MAY_RELEASE_AFTER_REVIEW" : "DO_NOT_RELEASE"
        ]
        evidence.currentRunIdentity = w7MapIdentity(evidence)
        File jsonOutput = rootProject.layout.buildDirectory.file("reports/j7m/wave7/wave7-final-assurance.json").get().asFile
        File markdownOutput = rootProject.layout.buildDirectory.file("reports/j7m/wave7/wave7-final-assurance.md").get().asFile
        jsonOutput.parentFile.mkdirs()
        jsonOutput.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(evidence)) + "\n"
        markdownOutput.text = w7FinalAssuranceMarkdown(evidence)
    }
}

tasks.register("validateWave7FinalAssuranceEvidence") {
    group = "verification"
    description = "Validates authoritative Wave 7 final-assurance evidence and rejects stale, contradictory, blocked, or guidance-only subordinate evidence."
    dependsOn tasks.named("generateWave7FinalAssuranceEvidence")
    outputs.upToDateWhen { false }
    doLast {
        File evidenceFile = rootProject.layout.buildDirectory.file("reports/j7m/wave7/wave7-final-assurance.json").get().asFile
        File markdownFile = rootProject.layout.buildDirectory.file("reports/j7m/wave7/wave7-final-assurance.md").get().asFile
        if (!evidenceFile.isFile() || !markdownFile.isFile()) {
            throw new GradleException("Wave 7 final-assurance evidence is missing")
        }
        Map<String, Object> evidence = new groovy.json.JsonSlurper().parse(evidenceFile) as Map<String, Object>
        String markdown = markdownFile.getText("UTF-8")
        if (evidence.formatVersion != "j7m-wave7-final-assurance-v1") {
            throw new GradleException("Wave 7 final-assurance evidence format is stale: ${evidence.formatVersion}")
        }
        if (evidence.currentHead != w7RunGit(rootProject.projectDir, ["rev-parse", "HEAD"])) {
            throw new GradleException("Wave 7 final-assurance evidence was generated for a stale HEAD")
        }
        if (evidence.currentRunIdentity != w7MapIdentity(evidence.findAll { Map.Entry<String, Object> entry ->
            entry.key != "currentRunIdentity"
        } as Map<String, Object>)) {
            throw new GradleException("Wave 7 final-assurance current-run identity does not match report contents")
        }
        if (evidence.technicalStatus != "TECHNICAL_PASS") {
            throw new GradleException("Wave 7 final-assurance evidence is blocked: ${evidence.blockers}")
        }
        List<Object> subordinates = evidence.subordinateEvidence as List<Object>
        if (subordinates == null || subordinates.size() != 5) {
            throw new GradleException("Wave 7 final-assurance subordinate evidence set is incomplete")
        }
        subordinates.each { Object value ->
            Map<String, Object> row = value as Map<String, Object>
            if (row.status != "PASS" || !(row.blockers as List<Object>).isEmpty()) {
                throw new GradleException("Wave 7 subordinate evidence is not passing: ${row}")
            }
            if (row.currentHead != evidence.currentHead) {
                throw new GradleException("Wave 7 subordinate evidence HEAD mismatch: ${row}")
            }
            List<Map<String, Object>> problems = w7ValidateArtifacts(rootProject.projectDir, [row.jsonArtifact, row.markdownArtifact])
            if (!problems.isEmpty()) {
                throw new GradleException("Wave 7 subordinate report artifact is stale or missing: ${problems}")
            }
        }
        w7FinalAssuranceMarkdownLines(evidence).each { String line ->
            if (!markdown.contains(line)) {
                throw new GradleException("Wave 7 final-assurance Markdown evidence does not match JSON evidence for line: ${line}")
            }
        }
        if (!w7FinalAssuranceSelfCheck(rootProject.layout.buildDirectory.dir("tmp/wave7-final-self-check").get().asFile, rootProject.projectDir)) {
            throw new GradleException("Wave 7 final-assurance fail-closed self-check failed")
        }
    }
}

static Map<String, Object> w7SubordinateEvidence(
        final String id,
        final File root,
        final File jsonFile,
        final File markdownFile,
        final String currentHead) {
    List<String> blockers = []
    if (!jsonFile.isFile()) {
        blockers.add("${id}: missing JSON report")
    }
    if (!markdownFile.isFile()) {
        blockers.add("${id}: missing Markdown report")
    }
    Map<String, Object> parsed = [:]
    if (blockers.isEmpty()) {
        try {
            parsed = new groovy.json.JsonSlurper().parse(jsonFile) as Map<String, Object>
        } catch (RuntimeException exception) {
            blockers.add("${id}: malformed JSON report")
        }
    }
    String reportHead = w7SubordinateHead(id, parsed)
    if (reportHead != currentHead) {
        blockers.add("${id}: stale HEAD ${reportHead}")
    }
    blockers.addAll(w7SubordinateStatusBlockers(id, parsed, root))
    Map<String, Object> row = [
            id: id,
            status: blockers.isEmpty() ? "PASS" : "BLOCKED",
            currentHead: reportHead,
            jsonArtifact: jsonFile.isFile() ? w7EvidenceFileArtifact(root, jsonFile) : [path: root.toPath().relativize(jsonFile.toPath()).toString().replace('\\', '/'), sizeBytes: 0L, sha256: "missing"],
            markdownArtifact: markdownFile.isFile() ? w7EvidenceFileArtifact(root, markdownFile) : [path: root.toPath().relativize(markdownFile.toPath()).toString().replace('\\', '/'), sizeBytes: 0L, sha256: "missing"],
            reportIdentity: jsonFile.isFile() ? w7FileSha256(jsonFile) : "missing",
            blockers: blockers
    ]
    Object identity = parsed.currentRunIdentity
    if (identity != null) {
        row.currentRunIdentity = identity
    }
    return row
}

static String w7SubordinateHead(final String id, final Map<String, Object> parsed) {
    if (id == "phase1" || id == "phase7") {
        return parsed.currentHead ?: "missing"
    }
    if (id == "phase5" || id == "phase6" || id == "wave5") {
        return parsed.gitCommit ?: "missing"
    }
    return "missing"
}

static List<String> w7SubordinateStatusBlockers(final String id, final Map<String, Object> parsed, final File root) {
    List<String> blockers = []
    if (parsed.isEmpty()) {
        return blockers
    }
    if (id == "phase1") {
        w7Require(parsed.formatVersion == "j7m-phase1-evidence-v2", blockers, "phase1: stale format")
        w7Require(parsed.validationState == "PASS", blockers, "phase1: validation did not pass")
        w7Require(w7CountsClean(parsed.tests as Map<String, Object>), blockers, "phase1: JUnit counts are not clean")
        blockers.addAll(w7ValidateArtifacts(root, parsed.junitArtifacts as List<Object>).collect { Map<String, Object> row -> "phase1: ${row}" })
    } else if (id == "phase5") {
        w7Require(parsed.technicalRecommendation == "ACCEPT", blockers, "phase5: technical recommendation is not ACCEPT")
        w7Require(w7CountsClean(parsed.testCounts as Map<String, Object>), blockers, "phase5: JUnit counts are not clean")
        w7Require(((parsed.acceptanceMatrixStatusSummary as Map<String, Object>)?.FAIL ?: 0) == 0, blockers, "phase5: acceptance matrix contains FAIL")
    } else if (id == "wave5") {
        w7Require(parsed.technicalStatus == "TECHNICAL_PASS", blockers, "wave5: technical status is not pass")
        w7Require(((parsed.blockers as List<Object>) ?: []).isEmpty(), blockers, "wave5: blockers present")
        Map<String, Object> junit = parsed.junit as Map<String, Object>
        w7Require(w7CountsClean(junit == null ? null : junit.totals as Map<String, Object>), blockers, "wave5: JUnit totals are not clean")
    } else if (id == "phase6") {
        w7Require(parsed.finalVerdict == "ACCEPT" || parsed.finalVerdict == "ACCEPT_PENDING_OWNER_COMMIT", blockers, "phase6: final verdict is blocked")
        w7Require(parsed.sameRunWave5Evidence != null && (parsed.sameRunWave5Evidence as Map<String, Object>).technicalStatus == "TECHNICAL_PASS", blockers, "phase6: same-run Wave 5 evidence missing")
        w7Require(w7CountsClean(parsed.testCounts as Map<String, Object>), blockers, "phase6: JUnit counts are not clean")
    } else if (id == "phase7") {
        w7Require(parsed.formatVersion == "j7m-phase7-evidence-v8", blockers, "phase7: stale format")
        w7Require(parsed.validationState == "PASS", blockers, "phase7: validation did not pass")
        w7Require(w7CountsClean(parsed.tests as Map<String, Object>), blockers, "phase7: JUnit counts are not clean")
        Map<String, Object> categories = parsed.categories as Map<String, Object>
        w7Require(categories != null && categories.phase711FinalAcceptance == "PASS", blockers, "phase7: final acceptance is not PASS")
        w7Require(phase7ExecutableCategoriesPass(categories), blockers, "phase7: executable category failed")
        w7Require(phase7GeneratedReleaseStatePass(parsed, phase7DirtyWorkingTree(root)), blockers, "phase7: release state does not match dirty-tree state")
        w7Require(phase7ReportEvidencePass(root, parsed), blockers, "phase7: generated report evidence mismatch")
    }
    return blockers
}

static boolean w7CountsClean(final Map<String, Object> counts) {
    if (counts == null) {
        return false
    }
    int tests = ((counts.tests ?: 0) as Number).intValue()
    int failures = ((counts.failures ?: 0) as Number).intValue()
    int errors = ((counts.errors ?: 0) as Number).intValue()
    int skipped = ((counts.skipped ?: 0) as Number).intValue()
    return tests > 0 && failures == 0 && errors == 0 && skipped == 0
}

static void w7Require(final boolean condition, final List<String> blockers, final String message) {
    if (!condition) {
        blockers.add(message)
    }
}

static String w7FinalAssuranceMarkdown(final Map<String, Object> evidence) {
    List<String> lines = ["# Wave 7 Final-Assurance Evidence", ""]
    lines.addAll(w7FinalAssuranceMarkdownLines(evidence))
    lines.add("")
    lines.add("Dirty working trees may produce a technical pass, but release remains blocked until owner-reviewed committed state is validated.")
    return lines.join("\n") + "\n"
}

static List<String> w7FinalAssuranceMarkdownLines(final Map<String, Object> evidence) {
    List<String> lines = [
            "- Format version: `${evidence.formatVersion}`",
            "- Generated at: `${evidence.generatedAt}`",
            "- Current HEAD: `${evidence.currentHead}`",
            "- Current-run identity: `${evidence.currentRunIdentity}`",
            "- Dirty working tree: `${evidence.dirtyWorkingTree}`",
            "- Technical status: `${evidence.technicalStatus}`",
            "- Release verdict: `${evidence.releaseVerdict}`",
            "- Release recommendation: `${evidence.releaseRecommendation}`"
    ]
    (evidence.subordinateEvidence as List<Object>).each { Object value ->
        Map<String, Object> row = value as Map<String, Object>
        lines.add("- Subordinate `${row.id}`: `${row.status}` `${row.currentHead}`")
    }
    return lines
}

static boolean w7FinalAssuranceSelfCheck(final File scratchRoot, final File root) {
    scratchRoot.mkdirs()
    String head = "0123456789012345678901234567890123456789"
    Map<String, Object> phase1 = [formatVersion: "j7m-phase1-evidence-v2", currentHead: head,
                                  validationState: "PASS", tests: [tests: 1, failures: 0, errors: 0, skipped: 0],
                                  junitArtifacts: [[path: "missing.xml", sizeBytes: 0L, sha256: "missing"]]]
    Map<String, Object> stalePhase1 = new LinkedHashMap<>(phase1)
    stalePhase1.currentHead = "stale"
    Map<String, Object> failingPhase1 = new LinkedHashMap<>(phase1)
    failingPhase1.tests = [tests: 1, failures: 1, errors: 0, skipped: 0]
    Map<String, Object> phase5 = [gitCommit: head, technicalRecommendation: "ACCEPT",
                                  testCounts: [tests: 1, failures: 0, errors: 0, skipped: 0],
                                  acceptanceMatrixStatusSummary: [FAIL: 0]]
    Map<String, Object> stalePhase5 = new LinkedHashMap<>(phase5)
    stalePhase5.gitCommit = "stale"
    Map<String, Object> blockedWave5 = [gitCommit: head, technicalStatus: "BLOCKED", blockers: ["blocked"],
                                        junit: [totals: [tests: 1, failures: 0, errors: 0, skipped: 0]]]
    Map<String, Object> markdownFixture = [
            formatVersion: "j7m-wave7-final-assurance-v1",
            generatedAt: "2026-01-01T00:00:00Z",
            currentHead: head,
            currentRunIdentity: "identity",
            dirtyWorkingTree: false,
            technicalStatus: "TECHNICAL_PASS",
            releaseVerdict: "ACCEPT",
            releaseRecommendation: "OWNER_MAY_RELEASE_AFTER_REVIEW",
            subordinateEvidence: [[id: "phase1", status: "PASS", currentHead: head]]
    ]
    Map<String, Object> missingReport = w7SubordinateEvidence("phase1", root,
            new File(scratchRoot, "missing-phase1.json"), new File(scratchRoot, "missing-phase1.md"), head)
    return w7SyntheticBlocked("phase1", stalePhase1, root, head)
            && w7SyntheticBlocked("phase5", stalePhase5, root, head)
            && w7SyntheticBlocked("phase1", failingPhase1, root, head)
            && w7SyntheticBlocked("wave5", blockedWave5, root, head)
            && missingReport.status == "BLOCKED"
            && w7CountsClean([tests: 1, failures: 0, errors: 0, skipped: 0])
            && !w7CountsClean([tests: 1, failures: 0, errors: 0, skipped: 1])
            && w7FinalTechnicalStatus(true) == "TECHNICAL_PASS"
            && w7FinalTechnicalStatus(false) == "BLOCKED"
            && w7FinalReleaseVerdict(true, false) == "ACCEPT"
            && w7FinalReleaseVerdict(true, true) == "RELEASE_BLOCKED_DIRTY_TREE"
            && w7FinalReleaseVerdict(false, false) == "BLOCKED"
            && w7FinalAssuranceMarkdownLines(markdownFixture).every { String line -> w7FinalAssuranceMarkdown(markdownFixture).contains(line) }
            && w7MapIdentity([a: "b"]) == w7MapIdentity([a: "b"])
}

static boolean w7SyntheticBlocked(final String id, final Map<String, Object> parsed, final File root, final String head) {
    List<String> blockers = []
    if (w7SubordinateHead(id, parsed) != head) {
        blockers.add("stale")
    }
    blockers.addAll(w7SubordinateStatusBlockers(id, parsed, root))
    return !blockers.isEmpty()
}

static String w7FinalTechnicalStatus(final boolean allPass) {
    return allPass ? "TECHNICAL_PASS" : "BLOCKED"
}

static String w7FinalReleaseVerdict(final boolean allPass, final boolean dirtyTree) {
    if (!allPass) {
        return "BLOCKED"
    }
    return dirtyTree ? "RELEASE_BLOCKED_DIRTY_TREE" : "ACCEPT"
}

/* Bounded documentation/evidence checks; excludes the historical aggregate test/demo run. */
tasks.register("validateNuggetDocumentationContracts") {
    group = "verification"
    description = "Checks current public Nugget contracts and fail-closed evidence parsers."
    doLast {
        if (!phase7DocumentationPass(rootProject.projectDir)) {
            throw new GradleException("Current public Nugget documentation contract is incomplete")
        }
        File scratch = layout.buildDirectory.dir("tmp/current-documentation-contracts").get().asFile
        scratch.mkdirs()
        if (phase7DocumentationPass(scratch)) {
            throw new GradleException("Missing public documentation did not fail closed")
        }
        Map<String, Object> fixture = [tests: [suites: 1, tests: 1, failures: 0, errors: 0, skipped: 0],
                categories: [phase711FinalAcceptance: "NOT_RELEASE_READY_DIRTY_TREE"], currentRunIdentity: "fixture-only"]
        File report = new File(scratch, "build/reports/j7m/phase7/phase-7-acceptance.md")
        report.parentFile.mkdirs()
        report.setText(phase7EvidenceMarkdown(fixture), "UTF-8")
        if (!phase7ReportEvidencePass(scratch, fixture)) {
            throw new GradleException("Matching generated report was rejected")
        }
        report.append("Unexpected evidence text\n", "UTF-8")
        if (phase7ReportEvidencePass(scratch, fixture)) {
            throw new GradleException("Mutated generated report did not fail closed")
        }
        if (!phase7LedgerMismatchSelfCheck() || !phase7CurrentRunIdentitySelfCheck()
                || !phase7CurrentSemanticSelfCheck() || !phase7MalformedSuiteSelfCheck(scratch)) {
            throw new GradleException("Nugget generated evidence mutation self-check failed")
        }
    }
}
