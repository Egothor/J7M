tasks.named("test") {
    dependsOn ":j7m-examples:jar"
    dependsOn ":examples:modular-hello-api:jar"
    dependsOn ":examples:modular-hello-impl:jar"
}

def configureJ7mTestsTask = { Test task ->
    task.testClassesDirs = sourceSets.test.output.classesDirs
    task.classpath = sourceSets.test.runtimeClasspath
    task.dependsOn ":j7m-examples:jar"
    task.dependsOn ":examples:modular-hello-api:jar"
    task.dependsOn ":examples:modular-hello-impl:jar"
    task.shouldRunAfter tasks.named("test")
}

