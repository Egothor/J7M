}

static Map<String, String> phase7AcceptanceCategories(
        final Map<String, Object> suites,
        final boolean requiredSuitesPass,
        final boolean demoPass,
        final boolean documentationPass,
        final boolean dirtyTree) {
    boolean publicBoundaryPass = phase7SuitePass(suites, "NuggetPhase7DocumentationConsistencyTest")
    Map<String, String> categories = [
            operatorGuidance: "GUIDANCE_ONLY",
            gradleTaskOutcomes: requiredSuitesPass && demoPass && documentationPass ? "PASS" : "FAIL",
            junitEvidence: requiredSuitesPass ? "PASS" : "FAIL",
            pinSecurity: phase7SuitePass(suites, "NuggetPinAuthTest") && phase7SuitePass(suites, "NuggetAuditSecurityTest") ? "PASS" : "FAIL",
            discovery: phase7SuitePass(suites, "NuggetDiscoveryTest") ? "PASS" : "FAIL",
            introspectionRedaction: phase7SuitePass(suites, "NuggetIntrospectionTest") ? "PASS" : "FAIL",
            phase75Inspection: phase7SuitePass(suites, "NuggetIntrospectionTest") && phase7SuitePass(suites, "J7mCliTest") ? "PASS" : "FAIL",
            phase76ApplicationLifecycle: phase7SuitePass(suites, "NuggetApplicationLifecycleTest")
                    && phase7SuitePass(suites, "J7mCliTest") ? "PASS" : "FAIL",
            phase77ShutdownControls: phase7SuitePass(suites, "NuggetShutdownControlTest")
                    && phase7SuitePass(suites, "J7mCliTest") ? "PASS" : "FAIL",
            adminApiContract: phase7SuitePass(suites, "NuggetAdminApiContractTest") ? "PASS" : "FAIL",
            jsonContractSchema: phase7SuitePass(suites, "NuggetAdminApiContractTest") ? "PASS" : "FAIL",
            cliPublicContractEquivalence: phase7SuitePass(suites, "J7mCliTest")
                    && phase7SuitePass(suites, "NuggetAdminApiContractTest") ? "PASS" : "FAIL",
            noWebDependency: phase7SuitePass(suites, "NuggetAdminApiContractTest") ? "PASS" : "FAIL",
            resourceMapping: phase7SuitePass(suites, "NuggetAdminApiContractTest") ? "PASS" : "FAIL",
            phase79SecurityHardening: phase7SuitePass(suites, "NuggetPinAuthTest")
                    && phase7SuitePass(suites, "NuggetAuditSecurityTest")
                    && phase7SuitePass(suites, "NuggetIntrospectionTest")
                    && phase7SuitePass(suites, "J7mCliTest")
                    && publicBoundaryPass ? "PASS" : "FAIL",
            phase710DemosExamplesDocs: demoPass && documentationPass ? "PASS" : "FAIL",
            cli: phase7SuitePass(suites, "J7mCliTest") ? "PASS" : "FAIL",
            demo: demoPass ? "PASS" : "FAIL",
            architectureStaticPolicy: publicBoundaryPass && documentationPass ? "PASS" : "FAIL",
            zeroSkippedRequiredTests: requiredSuitesPass ? "PASS" : "FAIL"
    ]
    categories.phase711FinalAcceptance = phase7ExecutableCategoriesPass(categories)
            ? (dirtyTree ? "NOT_RELEASE_READY_DIRTY_TREE" : "PASS")
            : "FAILED"
    return categories
}

